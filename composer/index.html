<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composer un agent — SalsiIAPrompt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/app.css">
<style>
  /*
   * Deux colonnes, et c'est tout le geste : les briques à gauche, la chaîne à droite.
   * On tire de l'une vers l'autre, on réordonne, on regarde le verdict.
   *
   * Aucun champ de prompt nulle part. C'est la promesse de l'écran, et elle doit se voir
   * avant d'être lue : ici on n'écrit pas, on assemble.
   */
  main{max-width:1240px;margin:26px auto 70px;padding:0 20px}

  h1{font-family:var(--fd);font-size:24px;margin:0 0 6px}
  .chapo{color:var(--ts);font-size:13.5px;line-height:1.65;margin:0 0 20px;max-width:76ch}

  /* ── La dictée de composition ── */
  .dictee{background:var(--bg-card);border:1px solid rgba(251,191,36,.35);border-radius:16px;
          padding:16px 18px;margin-bottom:20px}
  .dictee label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;
                letter-spacing:.06em;color:#fbbf24;margin-bottom:8px}
  .dictee .rangee{display:flex;gap:10px;flex-wrap:wrap}
  .dictee input{flex:1;min-width:260px;font-size:14.5px;padding:11px 13px}
  .dictee button{white-space:nowrap}
  .dictee .aide{font-size:11.5px;color:var(--tm);margin:9px 0 0;line-height:1.55}

  /* ── Les deux modes ── */
  .modes{display:grid;grid-template-columns:1fr;gap:10px;margin:0 0 18px}
  @media(min-width:760px){.modes{grid-template-columns:1fr 1fr}}
  .mode{text-align:left;padding:13px 15px;border-radius:14px;border:1px solid var(--line);
        background:rgba(0,0,0,.22);cursor:pointer;font:inherit;color:inherit;display:block}
  .mode:hover{border-color:rgba(167,139,250,.5);background:rgba(255,255,255,.04)}
  .mode.on{border-color:rgba(167,139,250,.75);background:rgba(124,92,252,.16)}
  .mode b{display:block;font-size:14px;color:var(--tp);margin-bottom:3px}
  .mode small{display:block;font-size:11.5px;color:var(--tm);line-height:1.55}
  .mode small b{display:inline;font-size:inherit;color:var(--ts)}

  /* ── L'identité d'un agent composé ──
     Elle n'existe qu'en mode agent, et c'est délibéré : une chaîne dérive la sienne de
     ses étapes, un agent neuf doit la porter — quelqu'un va le relire. */
  /* L'identité vient APRÈS la toile : le trait la sépare de ce qui la précède. */
  .identite{display:grid;gap:9px;margin-top:13px;padding-top:13px;
            border-top:1px solid var(--line)}
  .identite label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;
                  letter-spacing:.05em;color:var(--tm);margin-bottom:4px}
  .identite input,.identite textarea{width:100%;font-size:13px;padding:8px 11px}
  .identite textarea{min-height:52px;resize:vertical;line-height:1.55}

  /* Ce qui manque, dit en langage d'auteur avant que les règles le disent en L0xx. */
  .manque{margin:0 0 12px;padding:10px 13px;border-radius:10px;font-size:12px;line-height:1.6;
          border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fcd34d}
  .manque ul{margin:5px 0 0;padding-left:17px}

  /* ── La matière, en mode agent ── */
  .fam{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .fam button{font-size:11px;padding:4px 9px;border-radius:999px;color:var(--tm);font-weight:600}
  .fam button.on{color:#fff;background:rgba(124,92,252,.28);border-color:rgba(167,139,250,.6)}
  .brique .src{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
               border-radius:4px;padding:2px 6px;border:1px solid var(--line2);color:var(--tm);
               white-space:nowrap}
  .brique .src.registre{color:var(--ok);border-color:rgba(52,211,153,.45)}
  /* Un morceau qui REPRODUIT le rapport de son module — clés, calculs et seuils compris —
     et pas seulement un morceau qui parle du même sujet. La différence se voit au choix. */
  .brique .src.contrat{color:#c4b5fd;border-color:rgba(167,139,250,.5)}

  /* ── Un morceau posé dans la consigne ── */
  .morceau{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.24);
           padding:11px 13px}
  .morceau.tire{opacity:.4}
  .morceau-tete{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .morceau-tete .rang{font-family:var(--fm);font-size:10.5px;color:#a78bfa;
                      background:rgba(124,92,252,.16);border:1px solid rgba(167,139,250,.4);
                      border-radius:6px;padding:2px 7px}
  .morceau-tete b{font-size:13px;color:var(--tp)}
  .morceau-tete .sp{flex:1}
  .morceau-tete button{font-size:11px;padding:3px 8px}
  .morceau-tete .poignee{cursor:grab;color:var(--tm);font-size:14px}
  .morceau textarea{width:100%;font-size:12.5px;line-height:1.6;padding:8px 10px;
                    min-height:52px;resize:vertical}
  .morceau .ent{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
  .morceau .ent code{font-family:var(--fm);font-size:10.5px;color:#fcd34d;
                     background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);
                     border-radius:5px;padding:1px 6px}

  /* ── Reprendre un travail : replié, et hors de la matière ── */
  .reprendre{margin:0 0 16px;border:1px solid var(--line);border-radius:14px;
             background:var(--bg-card);padding:12px 15px}
  .reprendre > summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ts);
                       list-style:none;display:flex;align-items:center;gap:9px}
  .reprendre > summary::-webkit-details-marker{display:none}
  .reprendre > summary::before{content:'▸';color:var(--tm);font-size:11px}
  .reprendre[open] > summary::before{content:'▾'}
  .reprendre > summary .n{margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--tm)}
  .reprendre h2{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
                color:var(--tm);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
  .reprendre h2 .n{margin-left:auto;font-family:var(--fm);font-size:11px}

  /* ── L'établi ─────────────────────────────────────────────────────────────
     La matière prend la LARGEUR, l'établi la garde fixe. On lisait la matière dans une
     colonne de 320 px, en lignes serrées : illisible dès qu'il y a cent trente morceaux.
     Les cartes ont besoin de place ; l'établi, lui, n'en gagne rien. */
  .etabli{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
  @media(min-width:1000px){.etabli{grid-template-columns:minmax(0,1fr) 380px}}

  /* L'ÉTABLI SUIT LE REGARD.
     La matière est longue : en descendant pour trouver un morceau, la zone où le déposer
     sortait de l'écran — on glissait dans le vide, ou on remontait vérifier. Collé en
     haut, le point de dépose est toujours là. Il défile en interne s'il déborde. */
  @media(min-width:1000px){
    .etabli-droite{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
  }

  .panneau{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:15px}
  .panneau > h2{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
                color:var(--tm);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .panneau > h2 .n{margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--tm)}

  #recherche{width:100%;font-size:13.5px;padding:11px 14px;margin-bottom:10px}

  /* ── La provenance : le filtre qui démêle ce qui était mélangé ──
     Une consigne déjà relue par un humain et un besoin de la plateforme que personne n'a
     jamais écrit sont deux matières différentes. Elles se lisaient à la file, et rien ne
     permettait de n'en voir qu'une. */
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .seg button{font-size:11.5px;padding:5px 11px;border-radius:999px;color:var(--tm);font-weight:700}
  .seg button.on{color:#fff;background:rgba(124,92,252,.28);border-color:rgba(167,139,250,.6)}
  .seg button .n{opacity:.55;margin-left:5px;font-family:var(--fm)}

  /* ── La matière, en cartes ──
     Mêmes cartes qu'au Catalogue, et c'est le but : on y cherche de la même façon, on y
     lit de la même façon. Une ligne de 320 px de large ne laissait voir qu'un titre
     tronqué — on choisissait au hasard. */
  .cartes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
  .brique{display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left;
          padding:14px 15px;border-radius:14px;border:1px solid var(--line);
          background:rgba(0,0,0,.22);cursor:grab;user-select:none;transition:.15s}
  .brique:hover{border-color:rgba(167,139,250,.5);background:var(--bg-card-h);
                transform:translateY(-1px)}
  .brique:active{cursor:grabbing}
  .brique.tire{opacity:.4}
  .brique b{display:block;font-size:13.5px;color:var(--tp);line-height:1.35}
  /* Trois lignes puis les points de suspension : assez pour juger, pas assez pour qu'une
     carte bavarde écrase ses voisines et casse l'alignement de la grille. */
  .brique small{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
                overflow:hidden;font-size:11.5px;color:var(--tm);line-height:1.5}
  .brique .pied{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;
                padding-top:2px}
  .brique .poignee{color:var(--tm);font-size:13px;line-height:1.2;margin-left:auto}
  .brique .plus{font-size:15px;color:var(--accent);line-height:1;opacity:0}
  .brique:hover .plus{opacity:1}

  /* ── La chaîne ── */
  /* La cible de dépose se voit AVANT qu'on glisse : un cadre gris pâle ressemble à un
     bloc vide, et on ne vise pas un bloc vide. Elle s'allume franchement au survol. */
  #toile{min-height:150px;display:grid;gap:9px;padding:4px;border-radius:12px;
         border:1.5px dashed rgba(167,139,250,.4);background:rgba(124,92,252,.05);
         transition:.15s}
  #toile.survol{border-color:#fbbf24;background:rgba(251,191,36,.1)}
  .vide-toile{color:var(--tm);font-size:12.5px;line-height:1.7;padding:34px 20px;text-align:center}
  .vide-toile b{display:block;color:var(--ts);font-size:13.5px;margin-bottom:5px}

  .etape{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.24);
         padding:12px 13px}
  .etape.tire{opacity:.4}
  .etape.ko{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.07)}
  .etape-tete{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .etape-tete .rang{font-family:var(--fm);font-size:10.5px;color:#fbbf24;background:rgba(251,191,36,.14);
                    border:1px solid rgba(251,191,36,.35);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .etape-tete b{font-size:13.5px;color:var(--tp)}
  .etape-tete .sp{flex:1}
  .etape-tete button{font-size:11px;padding:3px 8px}
  .etape-tete .poignee{cursor:grab;color:var(--tm);font-size:14px}
  .etape .purpose{margin:0 0 9px;font-size:11.5px;color:var(--tm);line-height:1.55}
  .cablage{display:grid;gap:6px}
  .fil{display:flex;align-items:center;gap:8px}
  .fil label{font-family:var(--fm);font-size:11px;color:var(--ts);min-width:92px}
  .fil input{flex:1;font-family:var(--fm);font-size:11.5px;padding:6px 9px}
  .fil .flx{color:var(--tm);font-size:12px}

  .liaison{text-align:center;color:var(--tm);font-size:14px;line-height:1;margin:-4px 0}

  /* ── Mes chaînes, et celles des autres ── */
  .chaines{display:grid;gap:5px;max-height:230px;overflow:auto}
  .chaine{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:10px;
          border:1px solid var(--line);background:rgba(0,0,0,.22);cursor:pointer;
          text-align:left;width:100%;font:inherit;color:inherit}
  .chaine:hover{border-color:rgba(251,191,36,.5);background:rgba(255,255,255,.05)}
  .chaine b{display:block;font-size:12.5px;color:var(--tp);line-height:1.35}
  .chaine small{display:block;font-size:11px;color:var(--tm);margin-top:2px}
  .chaine .sp{flex:1}
  .et{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
      border-radius:5px;padding:2px 6px;border:1px solid var(--line2);color:var(--tm);white-space:nowrap}
  .et.privee{color:#fbbf24;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.1)}
  .et.partagee{color:var(--info);border-color:rgba(96,165,250,.45);background:rgba(96,165,250,.1)}
  .et.du-registre{color:var(--ok);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.1)}

  /* ── Le verdict ── */
  .verdict{margin-top:16px;display:flex;align-items:flex-start;gap:11px;padding:13px 15px;
           border-radius:12px;font-size:13px;line-height:1.6}
  .verdict.ok{border:1px solid rgba(52,211,153,.45);background:rgba(52,211,153,.1);color:#6ee7b7}
  .verdict.ko{border:1px solid rgba(248,113,113,.45);background:rgba(248,113,113,.1);color:#fca5a5}
  .verdict .sp{flex:1}
  .verdict ul{margin:7px 0 0;padding-left:18px;color:var(--ts)}
  .verdict li{margin-bottom:4px;font-size:12px}
  .verdict li code{font-family:var(--fm);font-size:11px;color:#fcd34d}

  .acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:15px}
  .acts .note{font-size:11.5px;color:var(--tm)}
  #msg{margin-top:12px;font-size:12.5px;line-height:1.6}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--err)}

  details.narration{margin-top:14px}
  details.narration summary{cursor:pointer;font-size:12px;color:var(--tm)}
  details.narration summary:hover{color:var(--tp)}
  details.narration pre{margin:9px 0 0;background:rgba(0,0,0,.35);border:1px solid var(--line);
    border-radius:10px;padding:13px;overflow:auto;font-size:11.5px;line-height:1.6;
    color:var(--ts);white-space:pre-wrap}
</style>
</head>
<body>

<main>
  <h1>Composer</h1>

  <!--
    Deux modes, et ils ne produisent PAS la même chose. Les afficher côte à côte est un
    choix : c'est la seule façon de rendre la différence visible au moment où elle se
    décide, plutôt que dans une doc que personne n'ouvrira.
  -->
  <div class="modes" id="modes">
    <button class="mode" data-mode="agent">
      <b>🧩 Un agent</b>
      <small>Tu assembles des morceaux d'instructions. Ça donne <b>un</b> agent, qui
        travaille en une fois.</small>
    </button>
    <button class="mode" data-mode="chaine">
      <b>🔗 Une suite d'agents</b>
      <small>Tu mets bout à bout des agents qui existent déjà. Chacun passe la main au
        suivant, et on contrôle entre les deux.</small>
    </button>
  </div>

  <p class="chapo" id="chapo"></p>

  <div class="dictee" id="dictee">
    <label for="phrase">…ou dis-le en une phrase</label>
    <div class="rangee">
      <input id="phrase" placeholder="je veux un agent qui mixe le rapport DORA et le rapport journalier">
      <button id="composer" class="primary">✨ Composer</button>
    </div>
    <p class="aide">L'IA choisit les agents et les relie. Elle ne peut écrire aucune
      instruction : elle ne fait que désigner ce qui existe déjà.</p>
  </div>

  <!--
    REPRENDRE, et non composer.

    « Mes agents » et « Les suites » vivaient dans la colonne de matière, sous les
    morceaux. On y lisait donc, à la file, des choses à GLISSER et des choses à ROUVRIR —
    deux gestes opposés dans la même liste. C'est ce qui rendait la colonne illisible.

    Ils sont sortis de l'établi et repliés : on les ouvre quand on veut retrouver un
    travail, jamais en cherchant de la matière.
  -->
  <details class="reprendre" id="reprendre">
    <summary>📂 Reprendre un travail <span class="n" id="nreprendre"></span></summary>

    <div id="blocChaines">
      <h2>Les suites <span class="n" id="nchaines">…</span></h2>
      <div class="chaines" id="chaines"></div>
    </div>

    <div id="blocMiens">
      <h2>Mes agents <span class="n" id="nmiens">…</span></h2>
      <div class="chaines" id="miens"></div>
    </div>
  </details>

  <div class="etabli">
    <section class="panneau matiere">
      <h2 id="titreMatiere">Briques validées <span class="n" id="nbriques">…</span></h2>
      <input id="recherche" placeholder="chercher un morceau — « dora », « secret », « migration »…">
      <div class="seg" id="provenances" hidden></div>
      <div class="fam" id="familles" hidden></div>
      <div class="cartes" id="briques"></div>
    </section>

    <!--
      LA ZONE DE DÉPOSE EN PREMIER.

      Elle venait après les trois champs d'identité. Sur un écran ordinaire, ça la
      poussait hors de vue : on demandait de glisser un morceau vers un endroit invisible,
      et l'établi avait beau rester collé en haut, c'était son BAS qu'il fallait atteindre.

      L'ordre suit maintenant le geste : on dépose, PUIS on nomme. Personne ne titre un
      agent avant de savoir de quoi il sera fait.
    -->
    <section class="panneau etabli-droite">
      <h2 id="titreToile">La chaîne <span class="n" id="netapes">0 étape</span></h2>

      <div id="toile"></div>
      <div id="manque"></div>

      <div class="identite" id="identite" hidden>
        <div>
          <label for="idTitre">Titre</label>
          <input id="idTitre" placeholder="Relire un diff et en rendre un rapport">
        </div>
        <div>
          <label for="idPurpose">À quoi il sert</label>
          <textarea id="idPurpose" placeholder="Lire un diff et signaler les ruptures de compatibilité."></textarea>
        </div>
        <div>
          <label for="idNotFor">Quand il ne faut PAS s'en servir</label>
          <textarea id="idNotFor" placeholder="Ne pas utiliser pour appliquer un correctif ni pour juger du style."></textarea>
        </div>
      </div>

      <div id="verdict"></div>

      <div class="acts">
        <button id="sauver" disabled>💾 Sauver chez moi</button>
        <button id="envoyer" class="primary" disabled>📮 Partager — envoyer en validation</button>
        <button id="vider">Vider</button>
        <span class="note" id="note"></span>
      </div>
      <div id="msg"></div>

      <details class="narration" id="narration" hidden>
        <summary>Voir la fiche complète, telle qu'elle sera enregistrée</summary>
        <pre id="yaml"></pre>
      </details>
    </section>
  </div>
</main>

<script type="module" src="./composer.js"></script>
</body>
</html>
