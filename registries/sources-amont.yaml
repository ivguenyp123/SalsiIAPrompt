  - id: voltagent-awesome
    nom: Communauté — Awesome Agent Skills
    depot: VoltAgent/awesome-agent-skills
    corpus: communaute
    ref: main
    pourquoi: >-
      Une liste « awesome » communautaire — probablement des liens plus que des
      SKILL.md. Utile comme carte du territoire, même si le scan y lit peu.

  # `ComposioHQ/*` figurait dans la veille : même règle que pour aws-samples — un
  # joker n'est pas une adresse. Un dépôt précis de ComposioHQ pourra entrer ici
  # nommé, avec sa ligne et son pourquoi.
