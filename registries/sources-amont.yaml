    ref: main
    pourquoi: >-
      Collection individuelle repérée dans la veille du 2026-08-19. Le scan dira
      le contenu ; la relecture dira le reste.

  - id: alirezarezvani-claude-skills
    nom: Communauté — claude-skills
    depot: alirezarezvani/claude-skills
    corpus: communaute
