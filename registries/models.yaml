# Registre des modèles — le palier déclaré, et le modèle réel derrière.
#
# POURQUOI UN REGISTRE ET PAS UN NOM DE MODÈLE DANS L'ARTEFACT
# Un artefact déclare `model_tier: nano`, jamais `gemini-2.5-flash-lite`. Trois raisons,
# et la troisième est la vraie :
#   · un nom de modèle change tous les six mois ; un palier, non
#   · 200 artefacts portant un nom de modèle = 200 fichiers à rouvrir à chaque montée
#   · surtout : le jour où le modèle change SOUS le prompt, il faut pouvoir dire quels
#     artefacts sont concernés et rejouer LEURS cas d'or. C'est ce fichier qui le dit.
#
# UNE COLONNE PAR FOURNISSEUR
# Le fournisseur se décide bien au-dessus de l'équipe qui écrit les agents, et il
# changera. Un artefact ne doit donc pas non plus nommer le fournisseur : il déclare un
# palier, et c'est ici qu'on dit qui répond pour ce palier chez chacun.
#
# LES TARIFS SONT SOUS LE FOURNISSEUR, ET SEULEMENT LÀ OÙ ILS SONT VÉRIFIÉS
# Un tarif au niveau du palier serait applique a n'importe qui : un appel DeepSeek
# facture au tarif Vertex afficherait un coût faux avec l'aplomb d'un coût mesuré.
#
# `tarifs.deepseek` est RENSEIGNÉ depuis la grille officielle, relevée le 2026-08-18 dans
# la console du compte. Deux précautions, parce qu'un tarif DeepSeek n'est pas UN nombre :
#
#   CACHE HIT / CACHE MISS  l'entrée coûte trente fois moins cher quand le préfixe est
#                           déjà en cache (0,014 contre 0,44 le million). On retient le
#                           CACHE MISS : notre couche ne sait pas si le cache a servi, et
#                           un coût affiché sous la réalité, dans un outil qui se vend sur
#                           le FinOps, est pire qu'un coût absent.
#   PLEIN / CREUX           le tarif est DIVISÉ PAR DEUX hors heures pleines. Les deux
#                           sont déclarés : `cout()` lit l'heure de l'appel et applique le
#                           bon. Sans heure, il applique le plein — majorant, jamais
#                           minorant.
#
# `large` reste sans tarif DeepSeek, et c'est délibéré : sur la capture d'écran de la
# grille, l'en-tête des colonnes était hors cadre. Le tarif de `deepseek-reasoner` n'a donc
# pas été LU, il aurait été déduit. Il manque, l'écran dira « tarif inconnu » pour ce
# palier, et c'est exact.

# ── LES HEURES PLEINES, TELLES QUE LA GRILLE LES DÉCLARE ─────────────────────
#
# « Off-peak rates are half of the peak rates. Peak hours are 01:00 - 04:00 and
#   06:00 - 10:00 UTC (all other hours are off-peak). »
#
# En UTC, jamais en heure locale : c'est le fournisseur qui facture, pas nous.
fournisseurs:
  deepseek:
    # Entre guillemets : notre analyseur YAML rend une chaîne là où js-yaml rend un
    # objet Date, et `test/conformance.test.js` compare les deux lectures. Une date de
    # relevé est de toute façon une étiquette, pas un instant à calculer.
    releve_le: "2026-08-18"
    heures_pleines_utc:
      - [1, 4]
      - [6, 10]

# ── LE PLAFOND DE SORTIE APPARTIENT AU PALIER ────────────────────────────────
#
# `max_sortie` dit combien de jetons un palier a le droit de produire. Il était en dur à
# 4096 dans le moteur, pour tout le monde : un agent qui rend cinq sections généreuses
# — une revue de sécurité, un plan DORA — se faisait couper en plein milieu. Et une
# réponse coupée ne se voit PAS : elle a l'air finie, on la lit, on agit dessus.
#
# Il appartient au palier et non à l'artefact. Un agent déclare ce qu'il veut FAIRE, pas
# combien de jetons il consomme ; écrit dans chaque artefact, ce nombre divergerait dès le
# troisième et personne ne saurait plus quel plafond s'applique.
#
# Les valeurs suivent l'usage du palier, pas la capacité du modèle : `nano` classe et
# reformate — au-delà de deux mille jetons il ne fait plus son métier. `large` raisonne sur
# un dépôt entier et rend des plans en cinq sections.

models:
  - tier: nano
    max_sortie: 2048
    vertex: gemini-2.5-flash-lite
    deepseek: deepseek-chat
    description: Classer, extraire, reformater. Aucun raisonnement attendu.
    tarifs:
      vertex: { entree_mtok: 0.10, sortie_mtok: 0.40 }
      # deepseek-chat. Entrée en CACHE MISS. `creux` = hors heures pleines, moitié prix.
      deepseek:
        entree_mtok: 0.44
        sortie_mtok: 1.32
        creux: { entree_mtok: 0.22, sortie_mtok: 0.66 }

  - tier: small
    max_sortie: 4096
    vertex: gemini-2.5-flash
    deepseek: deepseek-chat
    description: Rédiger court, résumer, expliquer un morceau de code isolé.
    tarifs:
      vertex: { entree_mtok: 0.30, sortie_mtok: 2.50 }
      # deepseek-chat. Entrée en CACHE MISS. `creux` = hors heures pleines, moitié prix.
      deepseek:
        entree_mtok: 0.44
        sortie_mtok: 1.32
        creux: { entree_mtok: 0.22, sortie_mtok: 0.66 }

  - tier: mid
    max_sortie: 8192
    vertex: gemini-2.5-flash
    deepseek: deepseek-chat
    description: >
      Analyser un diff, une requête, un journal. Le palier par défaut : c'est là que
      se joue la majorité du catalogue.
    tarifs:
      vertex: { entree_mtok: 0.30, sortie_mtok: 2.50 }
      # deepseek-chat. Entrée en CACHE MISS. `creux` = hors heures pleines, moitié prix.
      deepseek:
        entree_mtok: 0.44
        sortie_mtok: 1.32
        creux: { entree_mtok: 0.22, sortie_mtok: 0.66 }

  - tier: large
    max_sortie: 16384
    vertex: gemini-2.5-pro
    deepseek: deepseek-reasoner
    description: >
      Raisonner sur un dépôt entier, planifier une migration, arbitrer un risque.
      Coûte dix fois le palier mid : à réserver à ce qui l'exige vraiment.
    tarifs:
      vertex: { entree_mtok: 1.25, sortie_mtok: 10.00 }
