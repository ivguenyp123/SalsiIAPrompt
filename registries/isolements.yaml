# Registre des isolements — ce qu'une capacité a le droit de faire tourner, et où.
#
# ── POURQUOI UN REGISTRE, ET PAS UN CHAMP LIBRE ─────────────────────────────
#
# I001 : « soit la correspondance préexiste dans un registre écrit par un humain, soit le
# champ vaut `manquant` et bloque ». Un `isolement: "sandbox"` tapé à la main dans un
# formulaire d'import n'est pas un droit — c'est un mot. Le vocabulaire est donc fermé, et
# il vit ici.
#
# ── CE FICHIER NE DÉCLARE PLUS `applicable` ─────────────────────────────────
#
# Il l'a fait, et c'était l'erreur exacte que ce dépôt reproche à tout le monde : un
# booléen écrit à la main qui affirme ce que la plateforme sait ou ne sait pas faire
# respecter. Un `applicable: true` mal tapé aurait accordé un droit d'un caractère.
#
# À la place, chaque isolement déclare ses PREUVES : les faits qui doivent être vrais pour
# qu'il soit tenu. `lib/executeur.js` les confronte à ce que la forge rend, et le verdict
# est CALCULÉ. Trois issues, jamais deux :
#
#   applicable      toutes les preuves sont établies
#   non applicable  au moins une preuve est établie FAUSSE
#   non vérifiable  au moins une preuve ne peut pas être établie d'ici, et aucune n'est
#                   fausse. Ce n'est ni l'un ni l'autre, et ça ne se lance pas non plus :
#                   `non résolu` ne vaut jamais `satisfait`.
#
# ── QUI PEUT ÉTABLIR QUOI ───────────────────────────────────────────────────
#
# `par: plateforme`    lisible depuis le navigateur, avec le jeton de l'utilisateur. La
#                      plateforme le vérifie elle-même, à chaque fois, sans rien croire.
#
# `par: attestation`   invérifiable d'ici, et pas par paresse : la configuration d'un
#                      runner GitLab n'est exposée par aucune API que nous puissions
#                      lire. Quelqu'un qui administre ces runners peut en répondre — et
#                      son attestation est un fichier signé, daté, périmable, dans
#                      `attestations/`. Une signature n'est pas une mesure, et c'est dit à
#                      l'écran : c'est un engagement humain, comme le niveau `officiel`.
#
# La conséquence est inconfortable et elle est juste : aujourd'hui, sans attestation, les
# deux formes conteneurisées sortent NON VÉRIFIABLES. Pas « non applicable » — on ne sait
# pas. Et ce qu'on ne sait pas ne se lance pas.

isolements:
  - id: aucune-execution
    titre: Aucune exécution
    description: >-
      La capacité produit du texte. Rien n'est exécuté, ni sur l'hôte, ni ailleurs. C'est
      le cas de tous les prompts du registre aujourd'hui.
    preuves:
      - id: aucun_outil_write
        par: plateforme
        quoi: "La capacité ne déclare aucun outil en `mode: write`."

  - id: lecture-seule
    titre: Lecture seule, par la forge
    description: >-
      La capacité lit des fichiers, des pipelines ou des merge requests via la couche de
      forge, avec le jeton de l'utilisateur. Elle ne modifie rien.
    preuves:
      - id: aucun_outil_write
        par: plateforme
        quoi: "La capacité ne déclare aucun outil en `mode: write`."

  - id: ecriture-confirmee
    titre: Écriture, sous confirmation humaine
    description: >-
      La capacité modifie un dépôt par un outil `mode: write`, donc `executor: module`,
      donc `requires_confirmation: true`. Le chemin qui parle au modèle n'écrit jamais.
    preuves:
      - id: write_par_module
        par: plateforme
        quoi: >-
          Tout outil en `mode: write` est en `executor: module` et exige une confirmation.
          C'est l'invariant L005, déjà contrôlé à la porte.

  # ── Les deux formes qui exigent un exécuteur, et ce qu'il faudrait pour ────

  - id: conteneur-sans-reseau
    titre: Conteneur, réseau coupé
    description: >-
      La capacité exécute du code dans un conteneur jetable, sans accès réseau. C'est ce
      que Mantis exige de ses reproducteurs de crash.
    preuves:
      - id: job_ci_declare
        par: plateforme
        quoi: >-
          Le dépôt porte un fichier de CI qui définit un job dédié à l'exécution isolée,
          avec une image épinglée par digest.
      - id: executeur_jetable
        par: attestation
        quoi: >-
          Le runner qui prend ce job est en exécuteur conteneur, et le conteneur est
          détruit après chaque job.
        pourquoi_pas_lisible: >-
          La configuration d'un runner vit dans son `config.toml`, sur la machine du
          runner. Aucune API de forge ne la rend. Un job peut déclarer ce qu'il veut : ce
          qui décide est la machine qui l'exécute.
      - id: reseau_coupe
        par: attestation
        quoi: Le réseau du conteneur est coupé pendant l'exécution du job.
        pourquoi_pas_lisible: >-
          GitLab n'a pas de déclaration par job pour couper le réseau. Ça se règle dans le
          runner. Lire `.gitlab-ci.yml` et en conclure « réseau coupé » serait exactement
          ce que I001 refuse : accorder un droit sur la lecture d'un texte.

  - id: conteneur-avec-reseau
    titre: Conteneur, réseau ouvert
    description: >-
      La capacité exécute du code dans un conteneur jetable et a besoin du réseau —
      récupérer une dépendance, joindre un service.
    preuves:
      - id: job_ci_declare
        par: plateforme
        quoi: >-
          Le dépôt porte un fichier de CI qui définit un job dédié à l'exécution isolée,
          avec une image épinglée par digest.
      - id: executeur_jetable
        par: attestation
        quoi: >-
          Le runner qui prend ce job est en exécuteur conteneur, et le conteneur est
          détruit après chaque job.
        pourquoi_pas_lisible: >-
          Même raison : le `config.toml` du runner n'est lisible par aucune API.
      - id: sortie_maitrisee
        par: attestation
        quoi: >-
          Les destinations que le conteneur peut joindre sont restreintes par la
          configuration du runner ou du réseau.
        pourquoi_pas_lisible: >-
          Un conteneur avec réseau est la forme la plus permissive. Sans preuve de ce
          qu'il peut joindre, « avec réseau » veut dire « avec Internet », et ça ne
          s'accorde pas sur une lecture de fichier.

# ── Ce qu'une capacité MODIFIE. Vocabulaire fermé, pour la même raison. ──────
#
# `ecrit` décide si P007 exige une confirmation humaine. Un défaut permissif ici ferait
# écrire dans un dépôt sans que personne ait rien coché — c'est pourquoi il n'y a pas de
# défaut du tout.

ecritures:
  - id: rien
    titre: Rien
    description: La capacité produit une sortie et n'écrit nulle part.
    confirmation: false

  - id: depot
    titre: Un dépôt
    description: >-
      Elle modifie des fichiers versionnés — commit, branche, merge request. Passe
      obligatoirement par un outil `mode: write`.
    confirmation: true

  - id: etat-partage
    titre: Un état partagé
    description: >-
      Elle écrit un état que d'autres capacités relisent — l'atelier d'une chaîne, le
      `findings.json` de Mantis. Deux capacités qui écrivent le même état se marchent
      dessus sans qu'aucune ne le sache ; `L028` attrape le cas des chaînes.
    confirmation: true
