# Le dépôt vit sur GitHub, la destination est GitLab : les deux pipelines lancent
# exactement les mêmes commandes, voir .gitlab-ci.yml.
name: lint du registre

on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm test         # 21 règles + fixtures + conformité croisée
      - run: npm run lint     # tous les artefacts
