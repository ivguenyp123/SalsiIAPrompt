<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue — SalsiIAPrompt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/app.css">
<style>
  main{max-width:1120px;margin:26px auto 60px;padding:0 20px}
  h1{font-family:var(--fd);font-size:31px;line-height:1.15;margin:0 0 8px;letter-spacing:-.015em}
  .chapo{color:var(--ts);font-size:14px;line-height:1.65;margin:0 0 24px;max-width:70ch}
  .chapo b{color:var(--tp)}

  .search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search input{flex:1;min-width:260px;font-size:15px;padding:12px 14px}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .filters button{padding:6px 13px;font-size:12.5px;border-radius:999px}
  .filters button.on{color:#fff;background:rgba(124,92,252,.28);border-color:rgba(167,139,250,.6)}

  /* ── Étiquettes : dérivées du registre, jamais tenues à côté ── */
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .tags button{padding:4px 11px;font-size:11.5px;border-radius:999px;color:var(--tm);
               font-family:var(--fm);font-weight:600}
  .tags button:hover{color:var(--tp);border-color:rgba(167,139,250,.5)}
  .tags button.on{color:#fff;background:rgba(52,211,153,.22);border-color:rgba(52,211,153,.55)}
  .tags button .n{opacity:.55;margin-left:5px}
  .tags .titre{font-size:11px;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;
               font-weight:700;margin-right:2px}
  .tags .vider{color:var(--err);border-color:rgba(248,113,113,.4)}

  .pourquoi{font-size:10.5px;color:var(--tm);font-style:italic;margin-top:6px}

  /* ── Le tour : une bulle, un projecteur ── */
  #tourVoile{position:fixed;inset:0;z-index:80;display:none;background:rgba(8,5,18,.55)}
  #tourVoile.on{display:block}
  #tourTrou{position:absolute;border-radius:12px;pointer-events:none;
            box-shadow:0 0 0 3px rgba(251,191,36,.9),0 0 0 9999px rgba(8,5,18,.72);
            transition:.18s}
  #tourBulle{position:absolute;max-width:340px;background:#160f2b;border:1px solid rgba(251,191,36,.5);
             border-radius:14px;padding:15px 17px;box-shadow:0 18px 44px rgba(0,0,0,.5)}
  #tourBulle h4{margin:0 0 7px;font-size:14px;color:#fbbf24;font-family:var(--fd)}
  #tourBulle p{margin:0;font-size:12.5px;line-height:1.65;color:var(--ts)}
  #tourBulle .pied{display:flex;align-items:center;gap:8px;margin-top:13px}
  #tourBulle .rang{font-family:var(--fm);font-size:11px;color:var(--tm)}
  #tourBulle .sp{flex:1}
  #tourBulle button{font-size:12px;padding:6px 12px}
  .tour-btn{white-space:nowrap;color:#fbbf24;border-color:rgba(251,191,36,.45);
            background:rgba(251,191,36,.12);font-weight:700}
  .tour-btn:hover{background:rgba(251,191,36,.24)}

  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 12px;
        font-size:12px;color:var(--tm)}
  .meta .sp{flex:1}

  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .item{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:17px;
        cursor:pointer;transition:.15s;text-align:left;width:100%;font:inherit;color:inherit;display:block}
  .item:hover{background:var(--bg-card-h);border-color:rgba(167,139,250,.45);transform:translateY(-1px)}
  .item h3{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .item p{margin:0 0 12px;color:var(--ts);font-size:12.5px;line-height:1.55}
  .item .foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--tm)}

  .pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
        border-radius:5px;padding:2px 6px;border:1px solid var(--line2);color:var(--tm)}
  .pill.officiel{color:var(--ok);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.1)}
  .pill.team{color:var(--info);border-color:rgba(96,165,250,.45);background:rgba(96,165,250,.1)}
  .pill.ko{color:var(--err);border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.12)}
  /* « À moi » : sauvé chez soi, relu par personne. Distinct de tout niveau. */
  .pill.mien{color:#fbbf24;border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.12)}
  .item.mien{border-left:2px solid rgba(251,191,36,.45)}
  /* Un niveau non mesuré : pointillés et fond transparent. On lit « pas encore prouvé »
     avant d'avoir lu le mot. Une pastille pleine, elle, est un fait. */
  .pill.vise{border-style:dashed;background:transparent;opacity:.85}

  /* ── La sortie du modèle, LUE ──
     Un rapport se lit ; il ne se déchiffre pas. Le texte exact reste dessous, replié :
     c'est lui que les critères ont évalué, et on doit pouvoir le confronter. */
  .lu{font-size:13.5px;line-height:1.7;color:var(--ts);background:rgba(0,0,0,.24);
      border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .lu > :first-child{margin-top:0}
  .lu > :last-child{margin-bottom:0}
  .lu h1,.lu h2,.lu h3{font-family:var(--fd);color:var(--tp);line-height:1.3;
                       margin:22px 0 9px}
  .lu h1{font-size:18px} .lu h2{font-size:16px} .lu h3{font-size:14px}
  .lu p{margin:0 0 11px}
  .lu ul,.lu ol{margin:0 0 12px;padding-left:20px}
  .lu li{margin-bottom:6px}
  .lu li::marker{color:var(--accent)}
  .lu b,.lu strong{color:var(--tp)}
  .lu code{font-family:var(--fm);font-size:11.5px;color:#fcd34d;
           background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.22);
           border-radius:5px;padding:1px 5px}
  .lu pre{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;
          padding:12px 14px;overflow:auto;font-size:11.5px;line-height:1.6}
  .lu pre code{background:none;border:0;color:var(--ts);padding:0}
  .lu table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:12.5px}
  .lu th,.lu td{border:1px solid var(--line);padding:7px 10px;text-align:left}
  .lu th{background:rgba(255,255,255,.04);color:var(--tp)}
  .lu blockquote{margin:0 0 12px;padding-left:12px;border-left:2px solid var(--line2);
                 color:var(--tm)}
  .lu hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .sortie-tete{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px}
  .sortie-tete h4{margin:0}
  .sortie-tete .sp{flex:1}
  button.export{font-size:12px;padding:6px 13px;font-weight:700;color:#a5b4fc;
                border-color:rgba(167,139,250,.5);background:rgba(124,92,252,.14)}
  button.export:hover{background:rgba(124,92,252,.26);color:#fff}

  .brut{margin-top:9px}
  .brut summary{cursor:pointer;font-size:11px;color:var(--tm);text-transform:uppercase;
                letter-spacing:.05em;font-weight:700}
  .brut pre{margin-top:8px}

  .empty{padding:34px;text-align:center;color:var(--tm);border:1px dashed var(--line2);border-radius:16px}
  .empty b{color:var(--tp);display:block;margin-bottom:6px;font-family:var(--fd);font-size:15px}

  /* Fiche de détail */
  .sheet{position:fixed;inset:0;background:rgba(8,5,18,.72);backdrop-filter:blur(4px);
         display:none;z-index:40;padding:34px 20px;overflow:auto}
  .sheet.on{display:block}
  .sheet .inner{max-width:820px;margin:0 auto;background:#160f2b;border:1px solid var(--line2);
                border-radius:18px;overflow:hidden}
  .sheet header{display:flex;align-items:flex-start;gap:12px;padding:20px;border-bottom:1px solid var(--line)}
  .sheet header h2{font-size:19px;flex:1}
  .sheet .close{background:none;border:none;color:var(--tm);font-size:20px;cursor:pointer;padding:0}
  .sheet .body{padding:20px;display:grid;gap:20px}
  .sheet h4{margin:0 0 8px;font-size:10.5px;font-weight:800;text-transform:uppercase;
            letter-spacing:.06em;color:var(--tm);font-family:var(--fb)}
  /* ── Pré-vol : le déclaré confronté au réel ── */
  .pv{display:grid;gap:16px}
  .pv .champs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:620px){ .pv .champs{grid-template-columns:1fr} }
  .pv label{display:block;margin:0 0 5px;font-size:11px;font-weight:700;color:var(--tm);
            text-transform:uppercase;letter-spacing:.05em}
  /* ── La matière : aller la chercher dans la forge, et la garder modifiable ── */
  .mat{grid-column:1/-1}
  .mat-tete{display:flex;align-items:center;gap:8px;margin:0 0 5px}
  .mat-tete label{flex:1;margin:0}
  .mat-tete button{font-size:11px;padding:4px 10px;color:#fbbf24;
                   border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.12);font-weight:700}
  .mat-tete button:hover{background:rgba(251,191,36,.24)}
  .mat textarea{width:100%;min-height:82px;resize:vertical;font-family:var(--fm);
                font-size:11.5px;line-height:1.6}
  .mat-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;
            font-size:11px;color:var(--tm)}
  .mat-info b{color:var(--tp);font-weight:700}

  /* ── Une matière CALCULÉE : on montre le résultat, on ne demande rien ──
     La zone de texte existe toujours et porte la valeur ; elle est repliée. Personne
     n'a besoin de la voir pour s'en servir, tout le monde doit pouvoir la lire pour la
     contester. */
  .calc-etat{font-size:12.5px;line-height:1.6;padding:9px 12px;border-radius:10px;
             border:1px solid var(--line2);background:rgba(0,0,0,.24);color:var(--tm)}
  .calc-etat.attente{color:#fcd34d;border-color:rgba(251,191,36,.35)}
  .calc-etat.ok{color:#6ee7b7;border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.07);
                font-weight:700}
  .calc-etat.ko{color:#fca5a5;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08)}
  .calc-detail{margin-top:7px}
  .calc-detail summary{cursor:pointer;font-size:11px;color:var(--tm);text-transform:uppercase;
                       letter-spacing:.05em;font-weight:700}
  .calc-detail textarea{width:100%;margin-top:7px;font-family:var(--fm);font-size:11px;
                        line-height:1.6;resize:vertical}
  .mat.calc .mat-tete label{color:var(--ts);text-transform:none;letter-spacing:0;
                            font-size:12.5px;font-weight:700}
  .mat-info button{font-size:10.5px;padding:2px 8px}
  .mat-info.gros{color:#fcd34d}

  .picker{margin-top:8px;border:1px solid rgba(251,191,36,.35);border-radius:12px;
          background:rgba(0,0,0,.28);padding:12px}
  .picker .rangee{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .picker select,.picker input{font-size:12px;padding:7px 9px}
  .picker .rangee select{flex:1;min-width:150px}
  .picker input{width:100%}
  .picker .liste{max-height:212px;overflow:auto;display:grid;gap:3px;margin-top:8px}
  .picker .ligne{text-align:left;width:100%;font:inherit;color:inherit;padding:6px 9px;
                 border-radius:8px;border:1px solid transparent;background:transparent;
                 font-size:11.5px;font-family:var(--fm);cursor:pointer;color:var(--ts)}
  .picker .ligne:hover{background:rgba(255,255,255,.06);border-color:var(--line2);color:var(--tp)}
  .picker .ligne small{display:block;font-family:var(--fb);font-size:10.5px;color:var(--tm);margin-top:2px}
  .picker .vide{font-size:11.5px;color:var(--tm);padding:8px 2px;line-height:1.6}

  .pv .verdict{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:12px;
               font-weight:800;font-size:14px}
  .pv .verdict.ok{color:#6ee7b7;background:rgba(52,211,153,.13);border:1px solid rgba(52,211,153,.4)}
  .pv .verdict.ko{color:#fca5a5;background:rgba(248,113,113,.13);border:1px solid rgba(248,113,113,.4)}
  .pv .verdict .sp{flex:1}
  .pv .conf{padding:11px 15px;border-radius:10px;font-size:12.5px;line-height:1.6;
            color:#fcd34d;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35)}
  .pv .conf b{display:block;margin-bottom:7px;font-size:12.5px}
  .pv .conf ul{margin:0;padding-left:17px}
  .pv .conf li{margin-bottom:5px;color:var(--ts)}
  .pv .conf li b{display:inline;color:#fcd34d;font-family:var(--fm);font-size:11px}
  .pv .conf label{display:flex;gap:8px;align-items:flex-start;margin-top:10px;
                  padding-top:10px;border-top:1px solid rgba(251,191,36,.25);
                  cursor:pointer;color:var(--tp);font-weight:700;
                  text-transform:none;letter-spacing:0;font-size:12.5px}
  .pv .conf label input{width:auto;margin:2px 0 0}
  .pv ul.constats{margin:0;padding-left:18px;font-size:12.5px;line-height:1.75;color:var(--ts)}
  .pv ul.constats code{color:var(--tm);font-family:var(--fm);font-size:11px;font-weight:700}
  .pv .note{font-size:11.5px;color:var(--tm);line-height:1.6}
  /* Classé au référentiel : le contrôle refuse au lieu de demander. Ça se voit. */
  .pv .note.classe{color:#6ee7b7;border-left:2px solid rgba(52,211,153,.5);padding-left:11px}
  .pv select:disabled{opacity:.75;cursor:not-allowed;border-style:dashed}
  /* La sortie du modèle : lisible telle qu'elle est, jamais reformatée. */
  .pv pre{margin:0;padding:14px 16px;background:rgba(0,0,0,.32);border:1px solid var(--line);
          border-radius:11px;font-family:var(--fm);font-size:12.5px;line-height:1.65;
          color:var(--ts);white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow:auto}
  .pv .conf .acts,.pv .conf button{margin-top:9px}
  .pv .acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .pv .seg{display:inline-flex;gap:6px}
  .pv .seg button{padding:7px 13px;font-size:12.5px}
  .pv .seg button.on{color:var(--tp);border-color:var(--accent);background:rgba(167,139,250,.14)}
  .planbox{border:1px solid var(--line2);border-radius:12px;padding:14px 16px;background:rgba(0,0,0,.22)}
  .planbox h4{margin:0 0 8px} .planbox h4 + *{margin-bottom:14px}
  .planbox .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px}
  .planbox .kv dt{color:var(--tm)} .planbox .kv dd{margin:0;color:var(--tp);font-family:var(--fm);font-size:11.5px}
  .planbox a{color:var(--accent);font-weight:700}

  .sheet pre{margin:0;padding:13px 15px;background:rgba(0,0,0,.32);border-radius:12px;
             font-family:var(--fm);font-size:11.5px;line-height:1.6;overflow:auto;
             white-space:pre-wrap;color:var(--ts)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
  .kv dt{color:var(--tm)} .kv dd{margin:0;color:var(--ts)}
  ul.plain{margin:0;padding-left:17px;font-size:12.5px;line-height:1.7;color:var(--ts)}
  ul.plain code{color:var(--tp)}
</style>
</head>
<body>

<main>
  <h1>Les agents</h1>
  <p class="chapo">Tout ce que tu peux lancer sur ton projet. Chacun a été <b>relu par
    quelqu'un</b> avant d'arriver ici — sauf les tiens, marqués <b>💾 à moi</b>, que
    personne d'autre ne voit.</p>

  <div class="card">
    <div class="search">
      <input id="q" type="text" placeholder="décris ton besoin en une phrase…" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
  <div class="tags" id="tags"></div>
  </div>

  <div class="meta">
    <span id="count">Chargement…</span>
    <span class="sp"></span>
    <button id="tourStart" type="button" class="tour-btn">🧭 Visite guidée</button>
    <span id="source"></span>
  </div>

  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" style="display:none"></div>
</main>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>

<div id="tourVoile">
  <div id="tourTrou"></div>
  <div id="tourBulle">
    <h4 id="tourTitre"></h4>
    <p id="tourTexte"></p>
    <div class="pied">
      <span class="rang" id="tourRang"></span>
      <span class="sp"></span>
      <button id="tourPasser" type="button">Passer</button>
      <button id="tourSuivant" type="button" class="primary">Suivant</button>
    </div>
  </div>
</div>

<script type="module" src="./catalogue.js"></script>
</body>
</html>
