 html,body{margin:0;height:100%;background:#0f0a1f;font-family:'Manrope',system-ui,sans-serif}

 /* Coach — scénario guidé */
 #coach{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;width:min(680px,calc(100% - 32px));background:#160f2b;border:1px solid rgba(167,139,250,.5);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:16px 18px;display:none}
 #coach.on{display:block}
 #coach .ch{display:flex;align-items:center;gap:10px;margin-bottom:6px}
 #coach .step{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a78bfa}
 #coach .ct{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:16px;color:#f5f1ff}
 #coach .cx{margin-left:auto;cursor:pointer;color:#7a6fa3;font-size:18px;background:none;border:none}
 #coach .cbody{font-size:13px;color:#b8aed8;line-height:1.55}
 #coach .cbody b{color:#f5f1ff}
 #coach .dots{display:flex;gap:6px;margin:12px 0 0}
 #coach .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18)}
 #coach .dot.on{background:#a78bfa}
 #coach .cbtns{display:flex;gap:8px;margin-top:12px;align-items:center}
 #coach .cbtn{font:inherit;font-weight:800;font-size:13px;border:none;border-radius:10px;padding:10px 16px;cursor:pointer}
 #coach .cbtn.go{color:#0f0a1f;background:linear-gradient(135deg,#a78bfa,#2dd4bf)}
 #coach .cbtn.ghost{color:#b8aed8;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16)}
</style></head><body>
 <div class="tabs"><span class="brand">🧂 Salsifi<small>démo · un seul fichier</small></span>

 </div>

 <div id="coach">

 </div>

   <iframe id="f-catalogue" class="on" allow="clipboard-read; clipboard-write" srcdoc="<!DOCTYPE html>
<html lang=&quot;fr&quot; data-theme=&quot;dark&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>

<title>Catalogue IA — agents &amp;amp; prompts (maquette)</title>
<link rel=&quot;icon&quot; href=&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>&quot;>

<link href=&quot;https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;>
<style>
:root{
  --bg-deep:#0f0a1f; --bg-card:rgba(28,20,50,.55); --bg-card-h:rgba(40,28,70,.7);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --tp:#f5f1ff; --ts:#b8aed8; --tm:#7a6fa3;
  --accent:#a78bfa; --deliver:#2dd4bf; --info:#60a5fa; --warn:#fbbf24; --err:#f87171; --ok:#34d399;
  --fd:'Bricolage Grotesque',system-ui,sans-serif; --fb:'Manrope',system-ui,sans-serif; --fm:ui-monospace,'SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--fb);background:var(--bg-deep);color:var(--tp);min-height:100vh;overflow-x:hidden;padding:0 0 70px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60% 50% at 10% 0%,rgba(124,92,252,.16),transparent),radial-gradient(50% 40% at 92% 6%,rgba(45,212,191,.10),transparent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
header{display:flex;align-items:center;gap:15px;padding:24px 0 6px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--deliver));display:grid;place-items:center;font-size:24px}
header h1{font-family:var(--fd);font-size:23px;font-weight:800;letter-spacing:-.02em}
header .sub{font-size:12.5px;color:var(--ts);margin-top:1px}
.ctx-pill{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:12px;color:var(--ts)}
.ctx-pill b{color:var(--tp)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px;font-size:12.5px}
.nav a{color:var(--ts);text-decoration:none;background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:6px 13px}
.nav a.on{color:var(--tp);border-color:var(--accent);background:rgba(124,92,252,.12)}

/* HERO */
.hero{margin:16px 0 8px;border:1px solid var(--line2);border-radius:20px;background:linear-gradient(180deg,rgba(124,92,252,.09),rgba(45,212,191,.03));padding:22px 26px}
.hero h2{font-family:var(--fd);font-size:20px;font-weight:800;margin-bottom:4px}
.hero p{font-size:13px;color:var(--ts);margin-bottom:15px;max-width:780px}
.hero p .rk{color:var(--deliver);font-weight:700} .hero p .pk{color:var(--accent);font-weight:700}
.ask{display:flex;gap:10px;flex-wrap:wrap}
.ask input{flex:1;min-width:260px;font-family:var(--fb);font-size:15px;color:var(--tp);background:rgba(10,7,22,.6);border:1px solid var(--line2);border-radius:13px;padding:13px 16px;outline:none}
.ask input:focus{border-color:var(--accent)}
.ask button{font-family:var(--fb);font-weight:800;font-size:14px;color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver));border:none;border-radius:13px;padding:13px 20px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;color:var(--ts);background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--tp)}
#intentResult{margin-top:16px}

/* Toolbar — le toggle est la clé */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.kindseg{display:flex;gap:4px;background:var(--bg-card);border:1px solid var(--line2);border-radius:13px;padding:5px}
.kindseg button{font-family:var(--fb);font-size:13px;font-weight:800;color:var(--ts);background:transparent;border:none;border-radius:10px;padding:9px 15px;cursor:pointer;transition:.15s}
.kindseg button[data-k=&quot;recipe&quot;].on{background:rgba(45,212,191,.18);color:var(--deliver)}
.kindseg button[data-k=&quot;prompt&quot;].on{background:rgba(124,92,252,.2);color:var(--accent)}
.kindseg button[data-k=&quot;&quot;].on{background:rgba(255,255,255,.08);color:var(--tp)}
.tagbar{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:11.5px;color:var(--ts);background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer}
.tag.on{border-color:var(--accent);color:var(--accent);background:rgba(124,92,252,.12)}
.filts{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ts);cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--accent)}
.favbanner{display:flex;align-items:center;gap:12px;margin:6px 0 16px;padding:15px 18px;border:1px solid rgba(251,191,36,.3);border-radius:16px;background:linear-gradient(180deg,rgba(251,191,36,.08),rgba(251,191,36,.02))}
.favbanner .fbt{font-family:var(--fd);font-weight:800;font-size:17px}
.favbanner .fbs{font-size:12.5px;color:var(--ts);margin-top:2px;max-width:760px;line-height:1.5}
/* Golden path */
.gpath{border:1px solid var(--line2);border-radius:22px;background:linear-gradient(180deg,rgba(45,212,191,.10),rgba(124,92,252,.05));padding:26px 28px;margin:18px 0 22px}
.gp-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--deliver);margin-bottom:8px}
.gpath h2{font-family:var(--fd);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.gpath p{font-size:13.5px;color:var(--ts);margin:8px 0 18px;max-width:720px;line-height:1.55}
.gsteps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.gstep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ts);background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:8px 14px}
.gstep b{color:var(--tp)}
.gstep .n{width:19px;height:19px;border-radius:50%;background:rgba(124,92,252,.28);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.garrow{color:var(--tm);font-size:15px}
.gcta{font-family:var(--fb);font-weight:800;font-size:15.5px;color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver));border:none;border-radius:14px;padding:15px 26px;cursor:pointer;transition:.15s}
.gcta:hover{transform:translateY(-1px);filter:brightness(1.05)}
.gp-note{font-size:11.5px;color:var(--tm);margin-top:12px}
.gwhy{all:unset;cursor:pointer;font-size:12px;color:var(--ts);text-decoration:underline;text-underline-offset:3px;margin-left:10px}
.gwhy:hover{color:var(--tp)}
.gchain-cta{font-family:var(--fb);font-weight:700;font-size:12.5px;color:var(--accent);background:rgba(124,92,252,.1);border:1px solid rgba(124,92,252,.3);border-radius:10px;padding:9px 14px;cursor:pointer;margin-left:8px}
/* Moments */
.moments h3{font-family:var(--fd);font-size:16px;font-weight:800}
.moments .mcap{font-size:12.5px;color:var(--tm);margin:2px 0 13px}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.mtile{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:14px;background:var(--bg-card);padding:14px 16px;cursor:pointer;transition:.15s}
.mtile:hover{border-color:var(--accent);background:var(--bg-card-h);transform:translateY(-2px)}
.mtile .mi{font-size:25px;line-height:1}
.mtile .mt{font-family:var(--fd);font-weight:700;font-size:14px;line-height:1.2}
.mtile .md{font-size:11.5px;color:var(--tm);margin-top:3px}
.moments .ask{margin-top:16px}
.browsetoggle{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;color:var(--ts);font-size:13px;font-weight:700;margin:22px 0 6px;padding:9px 0}
.browsetoggle:hover{color:var(--tp)}
.browsetoggle .adv{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--tm);border:1px solid var(--line2);border-radius:20px;padding:2px 8px}
/* Sélecteur de mode (bien visible) */
.modeseg{display:inline-flex;gap:5px;background:var(--bg-card);border:1px solid var(--line2);border-radius:13px;padding:5px;margin:16px 0 6px}
.modeseg button{font-family:var(--fb);font-weight:800;font-size:13.5px;color:var(--ts);background:transparent;border:none;border-radius:10px;padding:9px 16px;cursor:pointer;transition:.15s}
.modeseg button:hover{color:var(--tp)}
.modeseg button.on{background:rgba(124,92,252,.22);color:var(--tp)}
/* Suggestions IA de favoris */
.suggest{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px;font-size:12.5px;color:var(--ts)}
.suggest .sg-t{color:var(--tm);font-weight:700}
.suggest .sg{display:inline-flex;align-items:center;gap:7px;background:var(--bg-card);border:1px dashed var(--line2);border-radius:20px;padding:6px 12px;cursor:pointer;transition:.15s}
.suggest .sg:hover{border-color:var(--accent);color:var(--tp)}
.suggest .sg b{color:var(--tp)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--bg-card);padding:16px 18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px;position:relative}
.card:hover{border-color:var(--line2);background:var(--bg-card-h);transform:translateY(-2px)}
.card.recipe{border-left:3px solid rgba(45,212,191,.5)}
.card.prompt{border-left:3px solid rgba(124,92,252,.5)}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card .ic{font-size:22px}
.card .ti{font-family:var(--fd);font-weight:800;font-size:15px;line-height:1.25;flex:1}
.kindbadge{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.kindbadge.recipe{color:var(--deliver);background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.3)}
.kindbadge.prompt{color:var(--accent);background:rgba(124,92,252,.12);border:1px solid rgba(124,92,252,.3)}
.lvl{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap}
.lvl.off,.lvl.official{color:var(--ok);background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.35)}
.lvl.team{color:var(--info);background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.35)}
.lvl.exp{color:var(--warn);background:rgba(251,191,36,.12);border:1px dashed rgba(251,191,36,.5)}
.lvl.mine{color:var(--accent);background:rgba(124,92,252,.14);border:1px solid rgba(124,92,252,.35)}
.card .desc{font-size:12.5px;color:var(--ts);line-height:1.5}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.card .tags span{font-size:10.5px;color:var(--tm);background:rgba(255,255,255,.04);border-radius:6px;padding:2px 7px}
.snippet{font-family:var(--fm);font-size:11px;color:var(--tm);background:rgba(10,7,22,.5);border:1px solid var(--line);border-radius:9px;padding:8px 10px;line-height:1.5;max-height:52px;overflow:hidden}
.snippet .v{color:var(--deliver)}
.metrics{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ts);border-top:1px solid var(--line);padding-top:10px}
.metrics b{color:var(--tp);font-size:13px;font-weight:800}
.metrics .m{display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tm);border-top:1px solid var(--line);padding-top:9px}
.star{all:unset;cursor:pointer;font-size:15px;line-height:1;opacity:.4;transition:.15s}.star.on{opacity:1}
.act{margin-left:auto;font-family:var(--fb);font-weight:800;font-size:12px;color:#0f0a1f;border:none;border-radius:9px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.act.run{background:linear-gradient(135deg,#2dd4bf,#34d399)}
.act.copy{background:linear-gradient(135deg,var(--accent),#c4b5fd)}
.varpill{font-size:10px;color:var(--deliver);border:1px solid rgba(45,212,191,.4);border-radius:20px;padding:2px 8px}
.autopill{font-size:10px;color:var(--info);border:1px solid rgba(96,165,250,.4);background:rgba(96,165,250,.08);border-radius:20px;padding:2px 8px}
.agentic{font-size:10px;color:var(--deliver);border:1px solid rgba(45,212,191,.4);border-radius:20px;padding:2px 8px}
/* contexte injecté + conventions */
.ctxbn{border:1px solid rgba(96,165,250,.35);background:rgba(96,165,250,.07);border-radius:12px;padding:11px 14px;margin-top:12px;font-size:12.5px;color:var(--ts);line-height:1.5}
.ctxbn b{color:var(--tp)}
.ctxbn .srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.src{font-size:10.5px;color:var(--info);background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);border-radius:6px;padding:2px 7px;font-family:var(--fm)}
.varrow.filled input,.varrow.filled textarea{border-color:rgba(96,165,250,.45);background:rgba(96,165,250,.05)}
.vtag{font-size:10px;color:var(--info);margin-left:7px;font-weight:600}
.conv{display:flex;gap:6px;flex-wrap:wrap}
.conv span{font-size:11px;color:var(--deliver);background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.28);border-radius:7px;padding:3px 9px}
.cmp{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.cmp summary{cursor:pointer;font-size:12px;color:var(--ts);font-weight:700;list-style:none}
.cmp summary::-webkit-details-marker{display:none}
.cmp summary::before{content:'▸ ';color:var(--tm)}
.cmp[open] summary::before{content:'▾ '}
.rawbox{font-family:var(--fm);font-size:12px;color:var(--tm);background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.22);border-radius:10px;padding:11px 13px;line-height:1.6;white-space:pre-wrap;margin-top:9px}
.delta{font-size:11.5px;color:var(--warn);margin-top:8px;line-height:1.5}
/* diff + preuve (continuité prompt→agent) */
.hunk{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:9px;background:rgba(10,7,22,.5)}
.hwhy{font-size:11.5px;color:var(--ts);padding:7px 11px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.dl{font-family:var(--fm);font-size:11.5px;padding:2px 11px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.dl.del{color:#f6a5a5;background:rgba(248,113,113,.08)}
.dl.add{color:#7ee6c9;background:rgba(45,212,191,.08)}
.proof{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;color:var(--ts);align-items:baseline}
.proof .pl2{color:var(--tm);font-weight:700;white-space:nowrap}
.proof b{color:var(--tp)}

/* Modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(6,4,14,.74);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.ov.show{display:flex}
.modal{width:100%;max-width:680px;background:#160f2b;border:1px solid var(--line2);border-radius:20px;padding:22px 24px}
.modal .mh{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.modal .mh .ic{font-size:26px}
.modal h3{font-family:var(--fd);font-size:19px;font-weight:800;flex:1}
.x{all:unset;cursor:pointer;font-size:20px;color:var(--tm)}
.field{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);padding:12px 14px;margin-top:12px}
.field .fl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.field .fv{font-size:13px;color:var(--ts);line-height:1.55}
.field .fv b{color:var(--tp)}
.promptbox{font-family:var(--fm);font-size:12.5px;color:var(--tp);background:rgba(10,7,22,.6);border:1px solid var(--line);border-radius:10px;padding:13px 15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.promptbox .v{color:var(--deliver);background:rgba(45,212,191,.1);border-radius:4px;padding:0 3px}
.varform{display:grid;gap:9px;margin-top:4px}
.varrow{display:flex;flex-direction:column;gap:4px}
.varrow label{font-size:11px;color:var(--ts);font-weight:700}
.varrow input,.varrow textarea{font-family:var(--fb);font-size:13px;color:var(--tp);background:rgba(10,7,22,.6);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;outline:none;resize:vertical}
.varrow input:focus,.varrow textarea:focus{border-color:var(--accent)}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:8px;padding:4px 9px;margin:3px 4px 0 0}
.tool.read{color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.tool.write{color:var(--warn);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3)}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.mbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.mbtn{font-family:var(--fb);font-weight:800;font-size:13px;border-radius:11px;padding:11px 18px;cursor:pointer;border:none}
.mbtn.go{color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver))}
.mbtn.run{color:#0f0a1f;background:linear-gradient(135deg,#2dd4bf,#34d399)}
.mbtn.ghost{color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.mbtn.mini{padding:8px 12px;font-size:12px}
.note{font-size:11px;color:var(--tm);margin-top:12px;line-height:1.5}
.thumbs{display:flex;gap:8px;margin-left:auto}
.thumb{all:unset;cursor:pointer;font-size:16px;padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.empty{color:var(--tm);font-size:13px;text-align:center;padding:30px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;background:rgba(40,28,70,.97);color:var(--tp);font-weight:700;font-size:13px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>

  function toggleFav(id){ var r=R.find(function(x){return x.id===id;}); if(!r)return; r.fav=!r.fav; renderGrid(); if(typeof view!=='undefined'&amp;&amp;view==='favoris') renderSuggest(); if($('gpath')){ renderForYou(); renderMoments(); } toast(r.fav?'⭐ Ajouté à tes favoris':'Retiré des favoris'); }

  function renderGrid(){
    var list=R.filter(function(r){
      if(favMode) return r.fav;              // vue Favoris : uniquement les étoilés
      if(fKind &amp;&amp; r.kind!==fKind) return false;
      if(fTag &amp;&amp; r.tags.indexOf(fTag)===-1) return false;
      if(ctxOnly &amp;&amp; !compatible(r)) return false;
      if(favOnly &amp;&amp; !r.fav) return false;
      return true;
    });
    var emptyMsg = favMode
      ? '<div class=&quot;empty&quot;>Aucun favori pour l\'instant.<br>Clique l\'étoile ☆ sur une carte du Catalogue pour l\'ajouter ici.</div>'
      : '<div class=&quot;empty&quot;>Aucune entrée pour ces filtres.</div>';
    $('grid').innerHTML = list.length ? list.map(card).join('') : emptyMsg;
    $('grid').querySelectorAll('.card').forEach(function(el){ el.addEventListener('click',function(e){ if(e.target.closest('[data-act]')||e.target.closest('[data-fav]')) return; openDetail(el.dataset.id); }); });
    $('grid').querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click',function(){ primary(b.dataset.act); }); });

  }
  function renderTags(){
    $('tagbar').innerHTML=TAGS.map(function(t){return '<span class=&quot;tag'+(fTag===t?' on':'')+'&quot; data-tag=&quot;'+t+'&quot;>'+t+'</span>';}).join('');
    $('tagbar').querySelectorAll('[data-tag]').forEach(function(el){ el.addEventListener('click',function(){ fTag=fTag===el.dataset.tag?'':el.dataset.tag; renderTags(); renderGrid(); }); });
  }

  // action primaire : tout se lance. Agent -> workflow ; prompt -> génération.

      '<div class=&quot;field&quot;><div class=&quot;fl&quot;>📊 Métriques</div><div class=&quot;fv&quot;><b>'+r.usage+'</b> usages · réussite <b style=&quot;color:'+succCol(r.success)+'&quot;>'+r.success+'%</b> · <b>'+r.humanFix+'%</b> corrigés · gagné <b>'+r.timeSaved+'</b></div></div>'+
      modelField(r)+

      '<div class=&quot;mbtns&quot;><button class=&quot;mbtn run&quot; data-run=&quot;'+r.id+'&quot;>🚀 Lancer l\'agent</button><button class=&quot;mbtn ghost&quot; data-close>Fermer</button>'+

  function runRecipe(r){
    if(r.isDelivery) return runDelivery(r);
    if(r.engine==='gentests') return runGenTests(r);
    var writes=r.tools.some(function(t){return t[1]==='write';});
    modal(
      '<div class=&quot;mh&quot;><span class=&quot;ic&quot;>'+r.ic+'</span><h3>'+esc(r.title)+'</h3><button class=&quot;x&quot; data-close>✕</button></div>'+
      '<div style=&quot;font-size:12.5px;color:var(--ts);margin-bottom:8px&quot;>Contexte du dépôt injecté : <b style=&quot;color:var(--tp)&quot;>'+CTX.repo+'</b> · Java 21 · Spring.</div>'+
      (writes?'<div class=&quot;field&quot; style=&quot;border-color:rgba(251,191,36,.35)&quot;><div class=&quot;fl&quot; style=&quot;color:var(--warn)&quot;>Dry-run — rien n\'est écrit</div><div class=&quot;fv&quot;>Cet agent peut écrire ; il te montre d\'abord ce qu\'il ferait, puis attend ta confirmation.</div></div>':'')+
      '<div class=&quot;field&quot;><div class=&quot;fl&quot;>Résultat</div><div class=&quot;fv&quot;><b>'+esc(r.expected)+'</b><br><span style=&quot;color:var(--tm)&quot;>(sortie IA simulée — maquette)</span></div></div>'+
      '<div class=&quot;field&quot;><div class=&quot;fl&quot;>Vérification automatique</div><div class=&quot;fv&quot;>'+r.criteria.map(function(c){return '☑ '+esc(c);}).join('<br>')+'</div></div>'+
      '<div class=&quot;mbtns&quot;><button class=&quot;mbtn run&quot; data-close>'+(writes?'✔ Confirmer':'Terminer')+'</button><button class=&quot;mbtn ghost&quot; data-close>Fermer</button>'+
        '<div class=&quot;thumbs&quot;><button class=&quot;thumb&quot; data-fb=&quot;up&quot;>👍</button><button class=&quot;thumb&quot; data-fb=&quot;down&quot;>👎</button></div></div>'
    );

  function runGenTests(r){
    modal(
      '<div class=&quot;mh&quot;><span class=&quot;ic&quot;>'+r.ic+'</span><div style=&quot;flex:1&quot;><h3>Générer des tests unitaires</h3>'+
        '<div style=&quot;font-size:12px;color:var(--deliver);margin-top:2px&quot;>⚙️ agent · produit un fichier de test à partir de ton code</div></div><button class=&quot;x&quot; data-close>✕</button></div>'+
      '<div class=&quot;ctxbn&quot;>⚡ <b>Code injecté depuis ton poste</b> — tu peux l\'ajuster.<div class=&quot;srcs&quot;><span class=&quot;src&quot;>'+esc(AUTOFILL.code.src)+'</span></div></div>'+
      '<div class=&quot;field&quot;><div class=&quot;fl&quot;>Code source</div><textarea class=&quot;promptbox&quot; id=&quot;gtCode&quot; style=&quot;width:100%;min-height:120px;border:1px solid var(--line2)&quot;>'+esc(AUTOFILL.code.val)+'</textarea></div>'+
      '<div id=&quot;gtOut&quot;></div>'+
      '<div class=&quot;mbtns&quot;><button class=&quot;mbtn run&quot; id=&quot;gtRun&quot;>▶ Générer les tests (dry-run)</button><button class=&quot;mbtn ghost&quot; data-close>Fermer</button></div>'+
      '<div class=&quot;note&quot;>Différence avec un prompt : l\'agent ne se contente pas de répondre — il <b>produit un fichier</b> et propose de le <b>créer sur ta branche</b> (après ta confirmation). Rien n\'est écrit sans « ✔ Créer ».</div>'
    );
    $('gtRun').addEventListener('click',function(){
      var code=$('gtCode').value; var g=genTests(code); var out=$('gtOut');
      if(g.name==='—'){ out.innerHTML='<div class=&quot;field&quot; style=&quot;border-color:rgba(251,191,36,.35)&quot;><div class=&quot;fv&quot; style=&quot;color:var(--warn)&quot;>Aucune fonction détectée — colle du code avec au moins une méthode.</div></div>'; return; }
      out.innerHTML='<div class=&quot;field&quot; style=&quot;border-color:rgba(251,191,36,.35)&quot;><div class=&quot;fl&quot; style=&quot;color:var(--warn)&quot;>Dry-run — fichier proposé, pas encore créé</div>'+
          '<div class=&quot;fv&quot;><b style=&quot;font-family:var(--fm)&quot;>'+esc(g.name)+'</b> · '+g.count+' méthode'+(g.count>1?'s':'')+' détectée'+(g.count>1?'s':'')+' → 2 tests chacune (nominal + cas limite)</div>'+
          '<div class=&quot;promptbox&quot; style=&quot;color:var(--tp);margin-top:9px;max-height:260px;overflow:auto&quot;>'+esc(g.text)+'</div>'+
          '<div class=&quot;mbtns&quot; style=&quot;margin-top:12px&quot;><button class=&quot;mbtn run mini&quot; id=&quot;gtConfirm&quot;>✔ Créer '+esc(g.name)+' sur ma branche</button><button class=&quot;mbtn ghost mini&quot; id=&quot;gtCopy&quot;>📋 Copier</button></div></div>';
      $('gtConfirm').addEventListener('click',function(){ toast('✅ '+g.name+' créé sur ta branche (simulation) — l\'agent a écrit, pas juste répondu'); });
      $('gtCopy').addEventListener('click',function(){ copy(g.text); toast('📋 Fichier de test copié'); });
      $('gtOut').scrollIntoView({behavior:'smooth',block:'nearest'});
      toast('🧪 Tests générés à partir de ton code');
    });
    wireFb();
  }

  function runDelivery(r){

      '<div class=&quot;field&quot; style=&quot;border-color:rgba(251,191,36,.35)&quot;><div class=&quot;fl&quot; style=&quot;color:var(--warn)&quot;>Dry-run — aucune écriture</div><div class=&quot;fv&quot;><b>Rien n\'est commité tant que tu ne confirmes pas.</b></div></div>'+
      '<div class=&quot;field&quot;><div class=&quot;fl&quot;>Contrôles</div><div class=&quot;fv&quot; style=&quot;padding:0&quot;>'+checks.map(function(c){return '<div class=&quot;chk&quot;><span style=&quot;color:var(--ok)&quot;>✓</span><span>'+esc(c)+'</span></div>';}).join('')+'</div></div>'+
      '<div class=&quot;mbtns&quot;><button class=&quot;mbtn run&quot; id=&quot;dlv&quot;>✔ Créer la MR de livraison</button><button class=&quot;mbtn ghost&quot; data-close>Annuler</button>'+
        '<div class=&quot;thumbs&quot;><button class=&quot;thumb&quot; data-fb=&quot;up&quot;>👍</button><button class=&quot;thumb&quot; data-fb=&quot;down&quot;>👎</button></div></div>'+
      '<div class=&quot;note&quot;>L\'action irréversible (créer la MR) passe par cette confirmation humaine — jamais déclenchée par le modèle.</div>'
    );
    var c=$('dlv'); if(c) c.addEventListener('click',function(){ toast('🚀 MR de livraison créée'); closeM(); });

  }

  function promptDetail(r){
    var vs=vars(r.body);
    var autoVars=vs.filter(function(v){return AUTOFILL[v];});
    // bandeau « contexte injecté » : sources réellement utilisées par ce prompt
    var srcs=[]; autoVars.forEach(function(v){ if(srcs.indexOf(AUTOFILL[v].src)===-1) srcs.push(AUTOFILL[v].src); });
    var ctxBanner=autoVars.length?
      '<div class=&quot;ctxbn&quot;>⚡ <b>Contexte injecté depuis ton poste</b> — '+autoVars.length+' variable'+(autoVars.length>1?'s':'')+' déjà remplie'+(autoVars.length>1?'s':'')+', tu n\'as rien à retaper. <span style=&quot;color:var(--tm)&quot;>(ce qu\'un chat nu ne peut pas savoir)</span>'+
        '<div class=&quot;srcs&quot;>'+srcs.map(function(s){return '<span class=&quot;src&quot;>'+esc(s)+'</span>';}).join('')+'</div></div>':'';
    var varForm=vs.length?
      '<div class=&quot;field&quot;><div class=&quot;fl&quot;>✏️ Variables '+(autoVars.length?'<span style=&quot;color:var(--info);font-weight:600;text-transform:none;letter-spacing:0&quot;>— '+autoVars.length+' pré-remplie'+(autoVars.length>1?'s':'')+' par la plateforme</span>':'')+'</div><div class=&quot;varform&quot; id=&quot;vf&quot;>'+
        vs.map(function(v){var big=/code|diff|texte|requete|story|erreur|contexte/i.test(v);var af=AUTOFILL[v];var val=af?esc(af.val):'';
          return '<div class=&quot;varrow'+(af?' filled':'')+'&quot;><label>{{'+esc(v)+'}}'+(af?'<span class=&quot;vtag&quot;>⚡ '+esc(af.src)+'</span>':'')+'</label>'+
            (big?'<textarea rows=&quot;'+(af?'3':'3')+'&quot; data-v=&quot;'+esc(v)+'&quot;>'+val+'</textarea>':'<input data-v=&quot;'+esc(v)+'&quot; value=&quot;'+val+'&quot;>')+'</div>';}).join('')+
      '</div><div class=&quot;note&quot;>Champs bleutés = injectés du contexte. Tu peux les ajuster ; les autres sont à toi (niveau, cible…).</div></div>':'';
    var convBlock=CONV[r.id]?
      '<div class=&quot;field&quot;><div class=&quot;fl&quot;>🏷 Conventions maison <span style=&quot;color:var(--tm);font-weight:600;text-transform:none;letter-spacing:0&quot;>— injectées dans le prompt, jamais retapées</span></div>'+
        '<div class=&quot;conv&quot;>'+CONV[r.id].map(function(c){return '<span>'+c+'</span>';}).join('')+'</div>'+
        '<div class=&quot;note&quot;>C\'est ça qui rend la sortie « à ta norme » plutôt que générique. Éditable par un <b>ai-maintainer</b> dans le Studio.</div></div>':'';
    modal(
      '<div class=&quot;mh&quot;><span class=&quot;ic&quot;>'+r.ic+'</span><div style=&quot;flex:1&quot;><h3>'+esc(r.title)+'</h3>'+
        '<div style=&quot;font-size:12px;color:var(--tm);margin-top:2px&quot;><span class=&quot;kindbadge prompt&quot;>💬 Prompt</span> <span class=&quot;lvl '+r.lvl+'&quot;>'+LVL_LABEL[r.lvl]+'</span> · '+esc(r.owner)+' · maj '+r.verified+' · lance une <b style=&quot;color:var(--accent)&quot;>génération</b></div></div>'+
        '<button class=&quot;x&quot; data-close>✕</button></div>'+
      ctxBanner+
      varForm+
      convBlock+
      '<div class=&quot;field&quot;><div class=&quot;fl&quot;>📄 Le prompt <span style=&quot;color:var(--tm);font-weight:600;text-transform:none;letter-spacing:0&quot;>— variables + conventions, prêt à partir</span></div><div class=&quot;promptbox&quot; id=&quot;pv&quot;>'+hl(r.body)+'</div></div>'+
      modelField(r)+
      '<div id=&quot;promptOut&quot;></div>'+
      '<div class=&quot;mbtns&quot;><button class=&quot;mbtn go&quot; id=&quot;cf&quot;>▶ Lancer le prompt</button><button class=&quot;mbtn ghost mini&quot; id=&quot;cp&quot;>📋 Copier le prompt</button><button class=&quot;mbtn ghost mini&quot; data-close>Fermer</button>'+
        '<div class=&quot;thumbs&quot;><button class=&quot;thumb&quot; data-fb=&quot;up&quot;>👍</button><button class=&quot;thumb&quot; data-fb=&quot;down&quot;>👎</button></div></div>'+
      '<div class=&quot;note&quot;>« Lancer » envoie le prompt (contexte + conventions) à l\'IA de la plateforme et affiche la réponse ici. « Copier » ne sert que si tu préfères le jouer dans ton outil — mais tu perds le contexte injecté. Pour une action qui <b>touche le dépôt</b> (écriture, MR…), c\'est une <b>agent</b>.</div>'
    );
    function convSuffix(){ return CONV[r.id]?('\n\n— Conventions maison appliquées : '+CONV[r.id].join(' · ').replace(/&amp;lt;/g,'<').replace(/&amp;gt;/g,'>')):''; }
    function refresh(){ var vals={}; $('modal').querySelectorAll('[data-v]').forEach(function(i){vals[i.dataset.v]=i.value;}); $('pv').innerHTML=hl(fill(r.body,vals))+(CONV[r.id]?'<span style=&quot;color:var(--deliver);opacity:.8&quot;>'+esc(convSuffix())+'</span>':''); return vals; }
    $('modal').querySelectorAll('[data-v]').forEach(function(i){ i.addEventListener('input',refresh); });
    refresh();
    $('cf').addEventListener('click',function(){ runPrompt(r); });
    $('cp').addEventListener('click',function(){ var vals=refresh(); copy(fill(r.body,vals)+convSuffix()); toast('📋 Prompt copié (avec conventions)'); });
    wireFb();
  }

  function runPrompt(r){
    var vals={}; $('modal').querySelectorAll('[data-v]').forEach(function(i){vals[i.dataset.v]=i.value;});
    var missing=vars(r.body).filter(function(v){return !vals[v];});
    if(missing.length){ toast('Renseigne : '+missing.map(function(m){return '{{'+m+'}}';}).join(', ')); return; }
    var out=$('promptOut'); r.uses++;
    var live=r.engine==='analyze';
    out.innerHTML='<div class=&quot;field&quot; style=&quot;border-color:var(--accent)&quot;><div class=&quot;fl&quot;>▶ '+(live?'Analyse en cours…':'Génération en cours…')+'</div><div class=&quot;fv&quot; style=&quot;color:var(--tm)&quot;>'+(live?'Application des règles de la plateforme au code…':'L\'IA de la plateforme traite le prompt rempli…')+'</div></div>';
    setTimeout(function(){
      var bodyHtml, text;
      if(live){ var a=analyzeCode(vals.code||''); bodyHtml='<div class=&quot;promptbox&quot; style=&quot;color:var(--tp)&quot;>'+a.html+'</div>'; text=a.text; }
      else {
        text=ANS[r.id]||'(réponse simulée — maquette)\n\nL\'IA a traité le prompt rempli et te renvoie ici sa réponse.';
        bodyHtml='<div class=&quot;promptbox&quot; style=&quot;color:var(--tp)&quot;>'+esc(text)+'</div>';
      }
      var raw=ANSRAW[r.id];
      var cmp=raw?'<details class=&quot;cmp&quot;><summary>Comparer : ce qu\'un chat nu aurait répondu</summary>'+
        '<div class=&quot;rawbox&quot;>'+esc(raw)+'</div>'+
        '<div class=&quot;delta&quot;>⚠ Sans le contexte de ton dépôt ni tes conventions : réponse générique, à retravailler. Le catalogue part du bon code et de tes standards → utilisable tel quel.</div></details>':'';
      var fixable=live &amp;&amp; a &amp;&amp; (a.r+a.y)>0;
      var fixBtn=fixable?'<button class=&quot;mbtn run mini&quot; id=&quot;toFix&quot;>🔧 Corriger avec un agent →</button>':'';

  function detectLang(c){
    if(/import java|System\.out|@Override|@Test/.test(c)) return 'java';
    if(/\b(public|private|protected)\b/.test(c) &amp;&amp; /;\s*$/m.test(c)) return 'java';
    if(/\bdef\s+\w+\s*\(|^\s*print\s*\(/m.test(c)) return 'python';
    if(/\bfunction\b|=>|\b(const|let)\b|console\.log|\bexport\b/.test(c)) return 'js';
    if(/;\s*$/m.test(c) &amp;&amp; /\)\s*\{/.test(c)) return 'java';

  function extractFns(c,lang){
    var out=[],m,re;
    if(lang==='java'){ re=/(?:public|private|protected|static|final|\s)+[\w<>\[\],\s]+?\s+(\w+)\s*\(([^)]*)\)\s*\{/g; }
    else if(lang==='python'){ re=/def\s+(\w+)\s*\(([^)]*)\)/g; }
    else { re=/(?:function\s+(\w+)|(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s*)?\([^)]*\)\s*=>|(\w+)\s*\(([^)]*)\)\s*\{)/g; }
    var seen={};
    while((m=re.exec(c))){ var n=m[1]||m[2]||m[3]; if(n &amp;&amp; !seen[n] &amp;&amp; !/^(if|for|while|switch|catch|return|function)$/.test(n)){ seen[n]=1; out.push({name:n,args:(m[2]||m[4]||'').trim()}); } }
    return out;

  function analyzeCode(code){

    var fns=extractFns(code,lang);
    var F=[]; // findings {sev,line,msg}
    lines.forEach(function(l,i){
      var n=i+1, t=l.trim();
      if(/\b(TODO|FIXME|XXX)\b/.test(l)) F.push({sev:'y',line:n,msg:'Marqueur '+(l.match(/TODO|FIXME|XXX/)[0])+' laissé dans le code'});
      if(/console\.log|System\.out\.print|\bprint\s*\(/.test(l)) F.push({sev:'y',line:n,msg:'Trace de debug à retirer'});
      if(/\.\w+\(\)\.\w+\(\)\.\w+\(/.test(l)) F.push({sev:'r',line:n,msg:'Chaîne d\'appels — risque de NullPointerException (loi de Déméter)'});
      if(/\breturn\s+null\s*;?\s*$/.test(l)) F.push({sev:'y',line:n,msg:'Retourne null — préférer Optional/exception'});
      if(/catch\s*\([^)]*\)\s*\{\s*$/.test(l) &amp;&amp; (lines[i+1]||'').trim()==='}' ) F.push({sev:'r',line:n,msg:'Bloc catch vide — erreur avalée'});
      if(/[^=!<>]==[^=]/.test(l) &amp;&amp; lang==='js') F.push({sev:'y',line:n,msg:'Égalité faible == — préférer ==='});
      if(/\bnew\s+\w*\(?\s*\d{2,}\b|\*\s*\d{2,}\b|\bmultiply\(new \w+\(\d+/.test(l)) F.push({sev:'y',line:n,msg:'Nombre magique — extraire une constante nommée'});
      if(l.length>120) F.push({sev:'g',line:n,msg:'Ligne longue ('+l.length+' car.)'});
    });
    var depth=0,maxd=0; for(var i=0;i<code.length;i++){ if(code[i]==='{'){depth++;maxd=Math.max(maxd,depth);} else if(code[i]==='}')depth--; }
    if(maxd>=4) F.push({sev:'y',line:0,msg:'Imbrication profonde ('+maxd+' niveaux) — extraire des méthodes'});
    if(fns.length &amp;&amp; !/@Test|\btest\w*\(|it\(|describe\(|def test_/.test(code)) F.push({sev:'g',line:0,msg:'Aucun test détecté pour '+fns.length+' fonction'+(fns.length>1?'s':'')});
    var r=F.filter(function(x){return x.sev==='r';}).length, y=F.filter(function(x){return x.sev==='y';}).length, g=F.filter(function(x){return x.sev==='g';}).length;
    var score=Math.max(0,100-r*20-y*8-g*3);
    var SEV={r:['🔴','var(--err)'],y:['🟡','var(--warn)'],g:['🟢','var(--ok)']};
    var html='<div style=&quot;display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap&quot;>'+
      '<div style=&quot;font-family:var(--fd);font-size:26px;font-weight:800;color:'+(score>=80?'var(--ok)':score>=55?'var(--warn)':'var(--err)')+'&quot;>'+score+'<span style=&quot;font-size:14px;color:var(--tm)&quot;>/100</span></div>'+
      '<div style=&quot;font-size:12px;color:var(--ts)&quot;>'+lang.toUpperCase()+' · '+loc+' LOC · '+fns.length+' fonction'+(fns.length>1?'s':'')+' · <span style=&quot;color:var(--err)&quot;>'+r+' 🔴</span> <span style=&quot;color:var(--warn)&quot;>'+y+' 🟡</span> <span style=&quot;color:var(--ok)&quot;>'+g+' 🟢</span></div></div>';
    if(!code.trim()) html='<div style=&quot;color:var(--tm)&quot;>Colle du code dans {{code}} pour lancer l\'analyse.</div>';
    else if(!F.length) html+='<div style=&quot;color:var(--ok)&quot;>✅ Aucun problème détecté par les règles de la plateforme.</div>';
    else html+=F.sort(function(a,b){return ('ryg'.indexOf(a.sev))-('ryg'.indexOf(b.sev));}).map(function(f){
      return '<div style=&quot;display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px&quot;><span>'+SEV[f.sev][0]+'</span>'+
        (f.line?'<span style=&quot;font-family:var(--fm);color:var(--tm);min-width:34px&quot;>L'+f.line+'</span>':'<span style=&quot;min-width:34px&quot;></span>')+
        '<span style=&quot;color:var(--ts)&quot;>'+esc(f.msg)+'</span></div>';

      F.map(function(f){return (f.sev==='r'?'[BLOQUANT]':f.sev==='y'?'[ATTENTION]':'[INFO]')+(f.line?' L'+f.line:'')+' — '+f.msg;}).join('\n');
    return {html:html, text:text, score:score, r:r, y:y, g:g, total:F.length, lang:lang, fns:fns.length};
  }
  function genTests(code){
    code=code||''; var lang=detectLang(code), fns=extractFns(code,lang);
    if(!fns.length) return {text:'// Aucune fonction détectée dans le code fourni.', name:'—', lang:lang};
    var cls=(code.match(/class\s+(\w+)/)||[])[1] || 'Unit';
    var out,name;
    if(lang==='java'){
      name=cls+'Test.java';

    } else if(lang==='python'){
      name='test_'+(cls.toLowerCase())+'.py';
      out='import pytest\n\n'+fns.map(function(f){return 'def test_'+f.name+'_nominal():\n    # given / when\n    result = '+f.name+'(  )  # '+f.args+'\n    # then\n    assert result is not None\n\n\ndef test_'+f.name+'_cas_limite():\n    with pytest.raises(ValueError):\n        '+f.name+'(  )';}).join('\n\n\n');
    } else {

  function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
  function methodName(code){ var m=code.match(/(?:public|private|protected|static|final|\s)+[\w<>\[\]]+\s+(\w+)\s*\(|function\s+(\w+)|def\s+(\w+)/); return m?(m[1]||m[2]||m[3]):null; }
  // Moteur de CORRECTION — dérive un patch réel des problèmes détectés.
  function proposeFix(code){
    var lines=(code||'').split('\n'), out=lines.slice(), changes=[], consts=[];
    var ind=function(s){return (s.match(/^\s*/)||[''])[0];};
    for(var i=0;i<out.length;i++){
      var l=out[i];
      // chaîne d'appels a.b().c().d() -> extraction + garde null (anti-NPE)
      var ch=l.match(/^(\s*)(?:([\w<>\[\]]+)\s+)?(\w+)\s*=\s*(\w+)\.(\w+)\(\)\.(\w+)\(\)\.(\w+)\(\)\s*;/);
      if(ch){
        var sp=ch[1], type=ch[2]||'var', tgt=ch[3], root=ch[4], a=ch[5], bcall=ch[6], ccall=ch[7];
        var v1=root+cap(a), v2=v1+cap(bcall);
        var repl=[sp+'var '+v1+' = '+root+'.'+a+'();',
                  sp+'if ('+v1+' == null) throw new IllegalArgumentException(&quot;'+a+' manquant&quot;);',
                  sp+'var '+v2+' = '+v1+'.'+bcall+'();',
                  sp+type+' '+tgt+' = '+v2+'.'+ccall+'();'].join('\n');
        changes.push({line:i+1,before:l,after:repl,why:'chaîne d\'appels → variables intermédiaires + garde null (anti-NPE)'});
        out[i]=repl; l=repl;
      }
      // nombre magique new X(NN) -> constante nommée (en String pour éviter re-flag)
      var mg=l.match(/new\s+(\w+)\((\d{2,})\)/);
      if(mg){
        var cname='FACTEUR_'+mg[2];
        consts.push('private static final '+mg[1]+' '+cname+' = new '+mg[1]+'(&quot;'+mg[2]+'&quot;);');
        out[i]=l.replace(mg[0], cname);
        changes.push({line:i+1,before:l,after:out[i],why:'nombre magique '+mg[2]+' → constante '+cname});
        l=out[i];
      }
      // return null -> exception explicite
      if(/^\s*return\s+null\s*;\s*$/.test(l)){
        out[i]=ind(l)+'throw new IllegalStateException(&quot;valeur indisponible&quot;);';
        changes.push({line:i+1,before:l,after:out[i],why:'return null → exception explicite'});
      }
      // trace de debug -> suppression
      if(/console\.log|System\.out\.print/.test(l)){

      var idx=0; for(var k=0;k<out.length;k++){ if(/\b(public|private|protected|function|def)\b/.test(out[k])){idx=k;break;} }
      var pad=ind(out[idx]||'');

  var fStatus='';

  function healthFlag(a){ return (a.metrics.uses>20 &amp;&amp; (a.metrics.success<75 || a.metrics.humanFix>30)); }

  function renderList(){

      var flag=healthFlag(a);
      return '<div class=&quot;row&quot; data-id=&quot;'+a.id+'&quot;>'+
        '<span class=&quot;ic&quot;>'+a.ic+'</span>'+
        '<div class=&quot;main&quot;><div class=&quot;ti&quot;>'+esc(a.title)+'</div>'+
          '<div class=&quot;meta&quot;>'+esc(a.owner)+' · v'+a.version+' · maj '+a.updated+' · '+vars(a.spec).length+' variables'+(a.kind==='recipe'?' · '+a.tools.length+' outils':'')+'</div></div>'+
        '<span class=&quot;kind '+a.kind+'&quot;>'+(a.kind==='recipe'?'⚙️ agent':'💬 prompt')+'</span>'+
        '<span class=&quot;status '+a.status+'&quot;>'+STATUS_LABEL[a.status]+'</span>'+
        '<div class=&quot;health&quot;>'+(a.metrics.uses?('<b>'+a.metrics.success+'%</b> réussite'+(flag?'<br><span class=&quot;flag&quot;>⚠ à améliorer</span>':'')):'<span style=&quot;color:var(--tm)&quot;>jamais utilisé</span>')+'</div>'+
      '</div>';

  }

  // ── Éditeur ──
  var cur=null;

    cur=A.find(function(x){return x.id===id;}); if(!cur) return;

    var a=cur;

    }).join('');

  function gov(a,act){
    if(act==='review'){ a.status='review'; toast('🟡 Soumis à revue'); }
    else if(act==='draft'){ a.status='draft'; toast('Renvoyé en brouillon'); }
    else if(act==='publish'){ a.status='published'; a.updated='aujourd\'hui'; toast('🟢 Publié en Officiel — visible dans le catalogue'); }
    else if(act==='deprecate'){ a.status='deprecated'; toast('Agent déprécié'); }

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin:14px 0}

.kpi .tr{font-size:11.5px;margin-top:4px;color:var(--tm)}
.kpi .tr.up{color:var(--ok)} .kpi .tr.down{color:var(--err)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--bg-card);padding:17px 19px;margin-bottom:16px}
.panel h3{font-family:var(--fd);font-size:15px;font-weight:800;margin-bottom:3px}
.panel .cap{font-size:11.5px;color:var(--tm);margin-bottom:14px}
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:11px;font-size:12.5px}
.bar .lbl{color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:9px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--deliver))}
.bar .num{text-align:right;color:var(--tp);font-weight:700;font-size:12px}
.sbar .fill.ok{background:linear-gradient(90deg,#2dd4bf,#34d399)}
.sbar .fill.warn{background:linear-gradient(90deg,#fbbf24,#f0a92c)}
.sbar .fill.err{background:linear-gradient(90deg,#f87171,#ef5350)}
.trend{width:100%;height:150px}
.trend .grid-l{stroke:var(--line);stroke-width:1}
.trend .area{fill:url(#g);opacity:.5}
.trend .ln{fill:none;stroke:var(--deliver);stroke-width:2.5}
.trend .dot{fill:var(--deliver)}
.xlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tm);margin-top:4px}
.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.leg{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.leg .li{display:flex;align-items:center;gap:8px;color:var(--ts)}
.leg .sw{width:11px;height:11px;border-radius:3px}
.leg b{color:var(--tp)}
.imp{display:flex;flex-direction:column;gap:9px}
.imp .it{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);padding:11px 13px}
.imp .ic{font-size:19px}
.imp .mn{flex:1;min-width:0}
.imp .mt{font-family:var(--fd);font-weight:700;font-size:13.5px}
.imp .ms{font-size:11.5px;color:var(--warn);margin-top:2px}
.imp .lnk{all:unset;cursor:pointer;font-size:11.5px;font-weight:800;color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver));border-radius:9px;padding:7px 11px;white-space:nowrap}
.imp .why{font-size:11px;color:var(--tm);text-align:right;white-space:nowrap}
.loop{border:1px dashed var(--line2);border-radius:14px;background:rgba(45,212,191,.04);padding:15px 17px;font-size:12.5px;color:var(--ts);line-height:1.6}
.loop b{color:var(--tp)}
.loop .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--tp);font-weight:700}
.loop .flow span{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:5px 11px}
.loop .flow .ar{background:none;border:none;color:var(--tm);padding:0}
.mtable{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1.4fr 1fr 34px 1fr;gap:8px;align-items:center;padding:9px 11px;background:var(--bg-card);font-size:12px}
.mrow.head{background:rgba(255,255,255,.03);color:var(--tm);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.mrow .tk{color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;display:inline-block}
.m-nano{color:#9ca3af;background:rgba(156,163,175,.12)} .m-small{color:var(--ok);background:rgba(52,211,153,.12)}
.m-mid{color:var(--info);background:rgba(96,165,250,.12)} .m-large{color:var(--warn);background:rgba(251,191,36,.12)}
.mrow .arr{color:var(--tm);text-align:center}
.mrow .save{font-weight:800;font-size:11.5px}
.save.pos{color:var(--ok)} .save.zero{color:var(--tm)}
.savecallout{border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.06);border-radius:11px;padding:11px 14px;font-size:12.5px;color:var(--ts);margin-bottom:11px;line-height:1.5}
.savecallout b{color:var(--ok)}

/* ═══ Le parc (gestion) ═══ */
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.sm{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg-card);padding:9px 14px;font-size:13px;color:var(--ts)}
.sm b{font-family:var(--fd);font-size:17px;color:var(--tp)}
.sm .d{width:9px;height:9px;border-radius:50%}
.d-actif{background:var(--ok)} .d-desactive{background:var(--tm)} .d-brouillon{background:var(--line2)} .d-revue{background:var(--warn)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 12px}
.search{flex:1;min-width:200px;font-family:var(--fb);font-size:13.5px;color:var(--tp);background:rgba(10,7,22,.6);border:1px solid var(--line2);border-radius:11px;padding:11px 14px;outline:none}
.search:focus{border-color:var(--accent)}
.seg{display:flex;gap:4px;background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{font-family:var(--fb);font-size:12.5px;font-weight:700;color:var(--ts);background:transparent;border:none;border-radius:8px;padding:8px 13px;cursor:pointer}
.seg button.on{background:rgba(124,92,252,.2);color:var(--tp)}
.stsel{font-family:var(--fb);font-size:12.5px;font-weight:700;color:var(--tp);background:rgba(10,7,22,.6);border:1px solid var(--line2);border-radius:11px;padding:9px 12px;outline:none;cursor:pointer}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thead,.trow{display:grid;grid-template-columns:2.4fr 90px 110px 96px 70px 210px;gap:10px;align-items:center;padding:12px 15px}
.thead{background:rgba(255,255,255,.03);color:var(--tm);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.trow{border-top:1px solid var(--line);font-size:13px}
.trow:hover{background:rgba(255,255,255,.02)}
.trow.off{opacity:.55}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm .ic{font-size:19px}
.nm .t{font-weight:700;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .o{font-size:11px;color:var(--tm)}
.kb{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.kb.agent{color:var(--deliver);background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.3)}
.kb.prompt{color:var(--accent);background:rgba(124,92,252,.12);border:1px solid rgba(124,92,252,.3)}
.st{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.st .d{width:7px;height:7px;border-radius:50%}
.st.actif{color:var(--ok);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.32)}
.st.desactive{color:var(--tm);background:rgba(255,255,255,.04);border:1px solid var(--line2)}
.st.brouillon{color:var(--ts);background:rgba(255,255,255,.04);border:1px solid var(--line2)}
.st.revue{color:var(--warn);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.32)}
.health b{font-weight:800}
.health .flag{font-size:10px;color:var(--warn);display:block;margin-top:1px}
.uses{color:var(--ts);font-size:12.5px}
.acts{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.btn{font-family:var(--fb);font-weight:800;font-size:11.5px;border-radius:8px;padding:7px 11px;cursor:pointer;border:none;white-space:nowrap}
.btn.off{color:var(--warn);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.32)}
.btn.on{color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver))}
.btn.ghost{color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.btn.pub{color:#0f0a1f;background:linear-gradient(135deg,#2dd4bf,#34d399)}
.empty{color:var(--tm);font-size:13px;text-align:center;padding:26px}
@media(max-width:860px){
  .thead,.trow{grid-template-columns:2fr 96px 110px}
  .thead .h3,.thead .h4,.thead .h5,.trow .c3,.trow .c4,.trow .c5{display:none}
}

/* ═══ À valider ═══ */
.policy{border:1px dashed var(--line2);border-radius:12px;background:rgba(255,255,255,.02);padding:13px 15px;font-size:12.5px;color:var(--ts);line-height:1.6;margin:8px 0 16px}
.policy b{color:var(--tp)}
.badge{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;white-space:nowrap}
.b-write{color:var(--warn);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35)}
.b-read{color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.qrow{border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.02);padding:14px 16px;margin-bottom:10px}
.qrow .top{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.qrow .ti{font-family:var(--fd);font-weight:700;font-size:14px}
.qrow .sc{font-size:11.5px;color:var(--tm);margin-left:auto}
.appr{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ap{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ts);border-top:1px solid var(--line);padding-top:9px}
.ap:first-child{border-top:none;padding-top:0}
.ap .apst{width:20px;text-align:center}
.ap .rl{flex:1}.ap .rl b{color:var(--tp)}
.ap .who{color:var(--tm);font-size:11.5px}
.apbtn{font-family:var(--fb);font-weight:800;font-size:12px;color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver));border:none;border-radius:9px;padding:7px 12px;cursor:pointer}
.apbtn.done{background:rgba(52,211,153,.15);color:var(--ok);cursor:default}
.qstatus{font-size:12px;font-weight:700;margin-top:11px;padding:9px 12px;border-radius:10px}
.qs-block{color:var(--warn);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3)}
.qs-ready{color:var(--ok);background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}
.genbtn{font-family:var(--fb);font-weight:800;font-size:13px;color:#0f0a1f;background:linear-gradient(135deg,#2dd4bf,#34d399);border:none;border-radius:11px;padding:11px 18px;cursor:pointer}
.mini{font-size:11px;color:var(--tm);margin-top:9px;line-height:1.5}

/* ═══ Journal d'audit ═══ */
.jfilter{font-size:11.5px;color:var(--tm);margin:8px 0 10px}
.jtable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.jhead,.jrow{display:grid;grid-template-columns:120px 1fr 70px 90px 1.1fr;gap:10px;padding:10px 13px;align-items:center;font-size:12px}
.jhead{background:rgba(255,255,255,.03);color:var(--tm);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.jrow{border-top:1px solid var(--line);cursor:pointer}
.jrow:hover{background:rgba(255,255,255,.02)}
.jrow .rc{color:var(--tp);font-weight:600}
.jrow .jwho{color:var(--ts)}
.jmodel{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(96,165,250,.12);color:var(--info)}
.tool{font-size:10.5px;border-radius:6px;padding:2px 7px;margin:0 3px 3px 0;display:inline-block}
.tool.read{color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.tool.write{color:var(--warn);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3)}
.jdetail{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:9px;padding-top:10px;font-size:12px;color:var(--ts);line-height:1.6;display:none}
.jrow.open .jdetail{display:block}
.jdetail .dl{color:var(--tm);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.03em;margin:8px 0 3px}
.proof{color:var(--ok)}
@media(max-width:820px){.jhead,.jrow{grid-template-columns:100px 1fr 60px}.jhead .h3,.jhead .h4,.jhead .h5,.jrow .c3,.jrow .c4,.jrow .c5{display:none}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;background:rgba(40,28,70,.97);color:var(--tp);font-weight:700;font-size:13px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.spotlight{outline:3px solid var(--accent)!important;outline-offset:4px;border-radius:14px;animation:spotpulse 1.2s ease-in-out infinite;scroll-margin:90px}
@keyframes spotpulse{0%,100%{box-shadow:0 0 0 0 rgba(167,139,250,.55)}50%{box-shadow:0 0 0 12px rgba(167,139,250,0)}}
</style>

        <svg class=&quot;trend&quot; id=&quot;trend&quot; viewBox=&quot;0 0 520 150&quot; preserveAspectRatio=&quot;none&quot;><defs><linearGradient id=&quot;g&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;><stop offset=&quot;0&quot; stop-color=&quot;#2dd4bf&quot; stop-opacity=&quot;.5&quot;/><stop offset=&quot;1&quot; stop-color=&quot;#2dd4bf&quot; stop-opacity=&quot;0&quot;/></linearGradient></defs></svg>

          <h3 style=&quot;font-size:14px;margin-top:18px&quot;>Reprise humaine par équipe</h3><div class=&quot;cap&quot;>Part des résultats retravaillés à la main.</div><div class=&quot;bars sbar&quot; id=&quot;teamRework&quot;></div></div>
