# Capacité de l'inventaire du hub — module « Pipeline Generator ».
# besoin : « un agent qui relit un .gitlab-ci.yml et dit quels jobs manquent pour la stack déclarée »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# LE PIÈGE DU GENRE : la liste de bonnes pratiques. Il « manque » toujours un
# scan SAST, un scan de dépendances, un test de charge, une signature d'image. Une
# liste de dix manques est une liste qu'on ne traite pas, et qui apprend à ignorer
# l'agent.
#
# Ce qui manque vraiment, c'est ce dont l'ABSENCE laisse passer quelque chose de
# précis. Le spec exige donc, pour chaque manque, ce qui peut arriver sans lui.
id: proposer-les-jobs-manquants
kind: prompt
title: 'Les jobs qui manquent — et seulement ceux qui manquent vraiment'
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [ci, qualite]
intent:
  purpose: >-
    Relire une chaîne CI et dire quels jobs manquent — chacun avec ce que son absence laisse passer concrètement, et lesquels ne valent pas la peine ici.
  not_for: >-
    Ce n'est pas une liste de bonnes pratiques : un manque sans conséquence nommée n'est pas un manque. Ce n'est pas non plus un audit de ce qui est cassé (`auditer-une-chaine-ci`) ni une lecture du temps d'attente (`ce-que-cette-chaine-coute-en-temps`).
model_tier: mid
target_level: experimental
variables:
  - name: config_ci
    source: repo
    required: true
    description: >-
      Le ou les fichiers de configuration de la chaîne CI.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - 'Ce que la chaîne couvre déjà'
      - 'Ce qui manque, et ce que ça laisse passer'
      - 'Ce qui ne vaut pas la peine ici'
      - 'Ce que je n''ai pas pu voir'
spec: |-
  Tu relis une chaîne CI et tu dis ce qui lui manque.
  
  {{config_ci}}
  
  Rends exactement ces sections, avec ces titres :
  
  ## Ce que la chaîne couvre déjà
  ## Ce qui manque, et ce que ça laisse passer
  ## Ce qui ne vaut pas la peine ici
  ## Ce que je n'ai pas pu voir
  
  ── LA RÈGLE QUI DÉFINIT CET AGENT ────────────────────────────────────────
  
  UN MANQUE SANS CONSÉQUENCE N'EST PAS UN MANQUE. « Il manque un scan SAST » est une phrase
  qu'on peut écrire devant n'importe quelle chaîne du monde, et c'est pour ça qu'elle ne
  sert à rien. La formulation exigée est : « rien ne vérifie X, donc Y peut arriver
  jusqu'en production sans que personne le voie ».
  
  TROIS MANQUES AU PLUS. Une liste de dix ne se traite pas et apprend à ignorer l'agent.
  Choisis, et dis ce que tu écartes dans la troisième section.
  
  ── CE QU'ON ATTEND ───────────────────────────────────────────────────────
  
  CE QUE LA CHAÎNE COUVRE DÉJÀ
  En quelques lignes : les étapes présentes et ce que chacune protège réellement. C'est
  obligatoire avant de parler de manques — la moitié des « manques » signalés par un lecteur
  pressé sont couverts ailleurs sous un autre nom.
  
  Regarde aussi les CONDITIONS : un job qui existe mais ne se déclenche jamais sur les
  branches de travail est un job absent là où il compte. C'est le manque le plus fréquent et
  le moins visible, parce que le job figure bien dans le fichier.
  
  CE QUI MANQUE, ET CE QUE ÇA LAISSE PASSER
  Trois au plus, du plus coûteux au moins. Chacun avec :
  - ce qui n'est vérifié nulle part ;
  - ce qui peut arriver en conséquence, concrètement, jusqu'où ;
  - le job qui le couvrirait, en une phrase — pas le YAML complet ;
  - où le placer dans la chaîne, et pourquoi là.
  
  CE QUI NE VAUT PAS LA PEINE ICI
  Aussi importante que la précédente. Nomme deux ou trois contrôles qu'on ajouterait par
  réflexe et qui n'apporteraient rien sur CE projet, avec la raison : pas d'utilisateurs
  externes, pas de dépendance tierce, environnement isolé, projet à durée de vie courte.
  Cette section est ce qui distingue un conseil d'une liste type.
  
  CE QUE JE N'AI PAS PU VOIR
  Trois lignes : les fichiers inclus depuis un autre dépôt et que tu ne lis pas, les jobs
  déclarés dans des modèles externes, les règles de protection de branche qui vivent hors du
  fichier, et le fait que tu n'as vu aucune exécution.
  
  ── ET SI LA CHAÎNE EST ABSENTE ───────────────────────────────────────────
  
  Si la matière ne contient aucune configuration de chaîne, dis-le en une ligne et
  arrête-toi. N'invente pas la chaîne qui devrait exister : c'est le métier de
  `generer-un-gitlab-ci`.
