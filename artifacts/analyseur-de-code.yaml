# salsi-provenance: composition
# besoin: assemblage de 2 prompt(s) : analyser-un-code, expliquer-un-code
# demande-par: ivguenyp123
# le: 2026-08-17
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# ── LA SÉCURITÉ N'EST PLUS UN AGENT D'À CÔTÉ ────────────────────────────────
#
# Cet agent lisait un fichier et rendait deux choses : ce qui le rend difficile, et ce
# qu'il fait. La sécurité vivait ailleurs — `secrets-exposes`, un agent qu'il faut penser
# à lancer, sur un scan du dépôt entier.
#
# Personne n'y pense. On ouvre un fichier parce qu'on va y toucher, et c'est précisément le
# moment où savoir qu'il porte un risque change quelque chose. Un contrôle de sécurité
# qu'il faut décider de faire est un contrôle qu'on ne fait pas.
#
# La sécurité est donc une SECTION de cet agent, au même titre que « ce qui risque de
# casser ». `secrets-exposes` reste : il répond à une autre question — « quoi révoquer en
# premier, sur tout le dépôt » — et il travaille sur une matière CALCULÉE que celui-ci n'a
# pas. Les deux ne se remplacent pas.
#
# ── ET CE QUE CET AGENT NE PEUT PAS DIRE ────────────────────────────────────
#
# Il lit UN fichier, avec un modèle, sans rien exécuter et sans voir le reste du dépôt. Il
# peut repérer un motif dangereux ; il ne peut pas prouver une absence. La consigne lui
# interdit donc explicitement d'écrire qu'un fichier est sûr — c'est la phrase qu'un
# lecteur pressé retient, et c'est celle qu'aucune lecture ne permet.
#
# Les secrets EN DUR, eux, ne lui parviennent même pas : `runtime/lancer.js` les caviarde
# avant l'appel et l'écran le dit. L'agent voit `[secret caviardé]` — d'où la consigne de
# le signaler sans commenter une valeur qu'il n'a pas vue.

id: analyseur-de-code
kind: prompt
title: Analyser un code — dette, risques et sécurité
owner:
  person: ivguenyp123
  scope: Data
tags: [code, securite, qualite]
intent:
  purpose: >-
    Lire un fichier et dire trois choses à qui va y toucher : ce qu'il fait, ce qui rend
    son évolution coûteuse, et ce qui s'y présente comme un risque de sécurité.
  not_for: >-
    Ne pas utiliser comme audit de sécurité, ni comme preuve qu'un fichier est sain :
    c'est la lecture d'un fichier par un modèle, sans exécution, sans analyse de flot,
    sans le reste du dépôt. Pour l'état réel des secrets d'un dépôt, il y a
    `secrets-exposes`, dont la matière est calculée.
model_tier: mid
target_level: experimental
variables:
  # UNE entrée, et la plateforme la calcule — la forme qui marche partout ailleurs.
  # Elle porte le dépôt, le chemin, les constats du scan et le fichier caviardé : le
  # `repo` séparé n'avait plus rien à dire que le rapport ne dise déjà.
  - name: analyse_fichier
    source: signal
    required: true
    description: >-
      Le fichier choisi, scanné avant lecture : motifs de secret avec leur ligne,
      contrôles de chaîne d'approvisionnement du manifeste, ce qui n'a pas été
      cherché, puis le contenu caviardé et numéroté.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  # Les quatre sections attendues, dont Sécurité : sans ce critère, « la sécurité est dans
  # l'agent » ne tiendrait qu'à la bonne volonté du modèle, et un jour il la sauterait.
  - target: output.sections
    op: contains
    value:
      - À quoi ça sert
      - Ce qui risque de casser
      - Sécurité
      - Par où commencer
spec: |-
  Tu lis un fichier pour quelqu'un qui va y toucher.

  Le rapport ci-dessous est CALCULÉ : le scan a déjà tourné sur le fichier entier,
  avec les motifs du scanner de secrets de la plateforme.

  {{analyse_fichier}}

  Rends exactement ces sections, avec ces titres :

  ## À quoi ça sert
  ## Ce qui risque de casser
  ## Sécurité
  ## Par où commencer

  Ce qu'on attend dans chacune :

  À QUOI ÇA SERT
  Explique l'INTENTION, pas la syntaxe. Ne paraphrase jamais une ligne. Trois phrases
  maximum. Si le fichier n'est pas du code — configuration, feuille de style, données —
  dis-le et arrête-toi là. S'il est vide, dis qu'il est vide et arrête-toi.

  CE QUI RISQUE DE CASSER
  Ce qui rend ce fichier coûteux à faire évoluer, et où ça lâchera. Chaque constat cite
  l'endroit concerné, jamais une généralité de méthode. Ne signale aucun point que
  l'outillage rattrape déjà — indentation, nommage de variable locale, import inutilisé.
  Si le fichier est court et clair, dis-le.

  SÉCURITÉ
  Deux choses, dans cet ordre.

  D'ABORD, CE QUE LE SCAN A TROUVÉ. Reprends chaque constat mesuré et dis quoi en faire —
  révoquer d'abord, ou figer cette dépendance, ou pinner cette image. Ne les RECOMPTE pas
  et n'en ajoute aucun à cette liste : les lignes et les types sont mesurés, pas devinés.
  Si le scan n'a rien trouvé, écris-le en une ligne et passe à la suite.

  ENSUITE, CE QUE LE SCAN NE PEUT PAS VOIR. C'est là que tu sers, et c'est le plus
  important de ta réponse : injection SQL, shell ou de commande et la concaténation qui la
  produit, contrôle d'accès absent, désérialisation d'une donnée reçue, chiffrement fait à
  la main, aléatoire non cryptographique, journalisation d'une donnée sensible, secret sans
  forme reconnaissable.

  Quatre règles, et la première prime sur les autres :

  - N'ÉCRIS JAMAIS QUE CE FICHIER EST SÛR, ni qu'il est « conforme », ni qu'« aucune
    vulnérabilité n'a été détectée ». Le scan couvre des motifs, pas des vulnérabilités ;
    toi, tu lis un fichier sans l'exécuter et sans voir le reste du dépôt. On peut repérer
    un motif dangereux, jamais prouver une absence. Si tu ne vois rien, écris « rien de
    visible à la lecture de ce seul fichier » — ce n'est pas la même phrase.
  - Cite la ligne. Les numéros sont dans l'extrait ; un risque sans endroit ne se corrige
    pas.
  - Ne recopie AUCUNE valeur de secret, même partielle, même si elle est sous tes yeux.
    Le rapport n'en montre qu'un aperçu tronqué : garde-le tronqué.
  - Si l'extrait est coupé, tu n'as pas lu tout le fichier. Ne conclus rien sur ce qui n'y
    est pas — le scan, lui, a porté sur le fichier entier.

  PAR OÙ COMMENCER
  UNE seule proposition, la plus rentable. Si la section Sécurité contient un risque, c'est
  lui — avant la dette.
