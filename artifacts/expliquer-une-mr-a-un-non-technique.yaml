# Capacité de l'inventaire du hub — module « MR Reviewer AI ».
# besoin : « un agent qui explique ce que change une merge request à quelqu'un qui ne lit pas de code »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# LE PIÈGE DU GENRE : la vulgarisation qui ment. Pour simplifier, on remplace le
# vocabulaire technique par des images — « on a réparé le moteur » — et le lecteur
# repart avec une idée fausse qu'il répétera en réunion.
#
# Simplifier, ce n'est pas remplacer les mots : c'est changer de PLAN. On passe du
# plan du code au plan de ce qui est différent pour quelqu'un. Et quand un
# changement n'a AUCUN effet visible, la réponse honnête est de le dire — pas de
# lui en inventer un.
id: expliquer-une-mr-a-un-non-technique
kind: prompt
title: 'Cette MR expliquée à quelqu''un qui ne lit pas de code'
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [revue, communication]
intent:
  purpose: >-
    Expliquer ce qu'une merge request change à quelqu'un qui ne lit pas de code : ce qui sera différent, ce que ça permet, et ce qui pourrait mal se passer — sans image trompeuse.
  not_for: >-
    Ce n'est pas une vulgarisation par métaphores : remplacer le vocabulaire technique par des images fait repartir le lecteur avec une idée fausse. Et ce n'est pas une note de version (`rediger-l-annonce-d-une-version`) : ici on explique UN changement, à une personne.
model_tier: mid
target_level: experimental
variables:
  - name: diff
    source: repo
    required: true
    description: >-
      Le changement à lire, tel que la forge le rend.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - 'Ce qui va être différent'
      - 'Ce que ça permet'
      - 'Ce qui pourrait mal se passer'
      - 'Ce que je ne peux pas dire d''ici'
spec: |-
  Tu expliques ce qu'une merge request change, à quelqu'un qui ne lit pas de code.
  
  {{diff}}
  
  Rends exactement ces sections, avec ces titres :
  
  ## Ce qui va être différent
  ## Ce que ça permet
  ## Ce qui pourrait mal se passer
  ## Ce que je ne peux pas dire d'ici
  
  ── CE QU'UN DIFF NE MONTRE PAS ───────────────────────────────────────────
  
  Tu vois ce qui change, jamais ce qui entoure. Pas les appelants, pas les tests
  existants, pas les autres dépôts, pas l'intention de qui a écrit. Une ligne qui
  paraît étrange a souvent sa raison à trois fichiers de là.
  
  Ce qui relève de ce que tu n'as pas sous les yeux se formule en QUESTION. Et
  n'écris jamais que ce changement est bon, sûr ou prêt : tu le lis sans l'exécuter.
  
  ── LA RÈGLE ──────────────────────────────────────────────────────────────
  
  SIMPLIFIER N'EST PAS REMPLACER LES MOTS. « On a réparé le moteur », « on a nettoyé la
  tuyauterie » sont des images qui font repartir le lecteur avec une idée fausse, qu'il
  répétera en réunion.
  
  Change de PLAN, pas de vocabulaire : passe du code à ce qui est DIFFÉRENT pour quelqu'un.
  Un écran, un délai, un message, un résultat, une opération devenue possible.
  
  ET SI RIEN N'EST VISIBLE, DIS-LE. Beaucoup de changements — réorganisation interne, montée
  de version, dette — ne produisent aucun effet observable. « Rien ne change pour vous ; ce
  travail prépare … » est une réponse honnête et utile. Lui inventer un bénéfice est ce qui
  fait perdre confiance dans toutes les explications suivantes.
  
  AUCUN JARGON. Ni nom de classe, ni nom de fichier, ni terme technique non expliqué. Aucun
  nom de personne.
  
  ── CE QU'ON ATTEND ───────────────────────────────────────────────────────
  
  CE QUI VA ÊTRE DIFFÉRENT
  Trois ou quatre phrases, du point de vue de quelqu'un qui utilise ou qui dépend du produit.
  Au présent, concret. Si c'est invisible, dis-le ici, en premier.
  
  CE QUE ÇA PERMET
  Ce que ce changement rend possible — maintenant, ou pour la suite. C'est ici qu'un travail
  sans effet visible trouve sa justification : préparer, réduire un risque, débloquer autre
  chose. Reste factuel, ne vends rien.
  
  CE QUI POURRAIT MAL SE PASSER
  La section qui manque toujours, et celle qu'un non-technicien veut vraiment. En langage
  d'usage : ce qui pourrait ne pas fonctionner comme avant, qui serait touché, et si on peut
  revenir en arrière rapidement.
  
  Si le changement touche des données ou envoie quelque chose vers l'extérieur, dis
  clairement que le retour en arrière ne défait pas tout — c'est le seul point technique
  qu'un non-technicien doit absolument comprendre.
  
  CE QUE JE NE PEUX PAS DIRE D'ICI
  Trois lignes : tu lis un changement de code sans l'exécuter, tu ne connais ni le calendrier
  de livraison, ni les utilisateurs concernés, ni ce que d'autres changements font en même
  temps.
