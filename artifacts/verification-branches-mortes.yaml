# salsi-provenance: demande
# besoin: un agent pour vérifier mes branches mortes
# demande-par: ivguenyp123
# le: 2026-08-15
# tours-de-correction: 2
# modele: deepseek-chat via deepseek
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.

id: verification-branches-mortes
kind: agent
title: Vérification des branches mortes
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: Identifier les branches qui ne sont plus à jour ou non mergeables par rapport à leur cible afin de les supprimer ou de les mettre à jour.
  not_for: Ne pas utiliser pour décider de la suppression automatique de branches sans validation humaine, ni pour analyser l'historique des commits.
spec: Analyse la branche nommée {{branche_a_verifier}} du dépôt. Utilise l'outil check_branch pour déterminer si cette branche est à jour et mergeable par rapport à sa branche cible. Examine le statut du dernier pipeline avec read_pipeline_status pour vérifier si la branche est en échec. Si la branche n'est pas à jour, n'est pas mergeable ou si son pipeline est en échec, considère-la comme une branche morte. Fournis un rapport concis listant les branches mortes et les raisons de leur statut.
variables:
  - name: branche_a_verifier
    source: user
    required: true
    description: Le nom de la branche à vérifier.
tools:
  - id: check_branch
    mode: read
    executor: llm
  - id: read_pipeline_status
    mode: read
    executor: llm
criteria:
  - target: output.sections
    op: contains
    value:
      - branches-mortes
golden_cases:
  - id: gc-01-branche-non-mergeable
    context:
      branche_a_verifier: feature/ancienne
    expect:
      output.sections:
        - branches-mortes
    runs: 5
    pass_at_least: 4
  - id: gc-02-branche-a-jour
    context:
      branche_a_verifier: main
    expect:
      output.sections:
        - branches-mortes
    runs: 5
    pass_at_least: 4
target_level: experimental
model_tier: small
