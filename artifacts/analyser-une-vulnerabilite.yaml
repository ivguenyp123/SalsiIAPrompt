# La vulnérabilité est le domaine où l'IA ment le plus utilement : elle sait toujours dire
# quelque chose d'inquiétant. Le spec l'oblige donc à trancher sur l'EXPLOITABILITÉ dans
# ce dépôt-là — la seule question qui décide si on corrige ce soir ou dans deux semaines.

id: analyser-une-vulnerabilite
kind: agent
title: Analyser une vulnérabilité
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [securite, dependances]
moment: alerte

intent:
  purpose: >
    Dire si une vulnérabilité signalée est exploitable dans ce dépôt précis, et quelle
    est la remédiation la moins coûteuse.
  not_for: >
    Ne pas utiliser pour décider d'une mise en production ni pour clore une alerte :
    l'agent donne un avis, la décision appartient à la sécurité.

spec: |
  Tu analyses cette vulnérabilité signalée sur le dépôt {{repo}}, en {{stack}}.

  Structure ta réponse ainsi, avec ces titres exactement :
  ## Exploitable ici
  ## Portée
  ## Remédiation

  Règles :
  - « Exploitable ici » commence par oui, non, ou indéterminé — et rien d'autre en
    premier mot. Le reste de la section justifie en deux phrases.
  - réponds « indéterminé » plutôt que d'inventer : dire « non » à tort est la seule
    erreur qui coûte vraiment cher
  - « Portée » dit ce qui casse si on ne fait rien, pas la gravité théorique du CVE
  - « Remédiation » propose la montée de version la plus petite qui règle le problème
  - si le rapport ne signale aucune vulnérabilité, dis-le et arrête-toi

  Rapport :
  {{rapport}}

variables:
  - name: repo
    source: repo
    required: true
    description: Dépôt analysé.
  - name: stack
    source: repo
    required: true
    description: Stack technique, pour juger de l'exploitabilité réelle.
  - name: rapport
    source: user
    required: true
    description: Sortie de l'outil d'analyse de dépendances, ou fiche du CVE.

tools:
  - id: scan_vulnerabilities
    mode: read
    executor: llm
  - id: read_repo_metadata
    mode: read
    executor: llm

criteria:
  - target: output.sections
    op: exists
    value: true
  - target: output.length
    op: lte
    value: 2000
  - target: output.contains_secret
    op: eq
    value: false

golden_cases:
  - id: gc-01-dependance-transitive
    context: { repo: demo-spring, stack: java, rapport: "CVE-2026-1234 severite haute sur la bibliotheque de serialisation, dependance transitive, atteignable uniquement via un point d'entree de desserialisation" }
    expect: { output.sections: true, output.length: 1500 }
    runs: 5
    pass_at_least: 5

  - id: gc-02-portee-incertaine
    context: { repo: demo-spring, stack: java, rapport: "CVE-2026-9999 severite critique, aucun detail publie, correctif annonce dans la version suivante" }
    expect: { output.sections: true }
    runs: 5
    pass_at_least: 4

  # Le faux positif : la dependance est la, la fonction vulnerable ne l'est pas. C'est le
  # cas ou dire « oui, exploitable » coute une soiree a toute une equipe pour rien.
  - id: gc-03-faux-positif
    context: { repo: demo-spring, stack: java, rapport: "CVE-2026-4321 sur le parseur XML, la dependance est presente mais aucun appel au parseur dans le code" }
    expect: { output.sections: true, output.length: 1200 }
    runs: 5
    pass_at_least: 4

  - id: gc-04-rien-a-signaler
    context: { repo: demo-spring, stack: java, rapport: "0 vulnerabilite trouvee sur 7 dependances" }
    expect: { output.length: 500 }
    runs: 3
    pass_at_least: 3

  - id: gc-05-rapport-vide
    context: { repo: demo-spring, stack: java, rapport: " " }
    expect: { output.length: 300 }
    runs: 3
    pass_at_least: 3

target_level: officiel
model_tier: large
classification:
  max_repo_sensitivity: confidentiel
