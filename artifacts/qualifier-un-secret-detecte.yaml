# Capacité de l'inventaire du hub — module « Secrets Scanner ».
# besoin : « un agent qui dit si un secret détecté est un vrai secret ou un faux positif »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# LE PIÈGE DU GENRE : trancher. « Faux positif » écrit par un modèle est lu comme
# un verdict, et le sujet est clos — alors que le coût des deux erreurs n'a rien de
# comparable. Classer un vrai secret en faux positif laisse une clé vivante dans un
# dépôt ; l'inverse fait perdre vingt minutes à quelqu'un.
#
# Le spec impose donc l'asymétrie : en cas de doute, on traite comme vrai. Et le
# verdict n'est jamais « faux positif » seul — il vient avec ce qui le prouve.
id: qualifier-un-secret-detecte
kind: prompt
title: 'Ce secret détecté — vrai ou faux positif'
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [securite, code]
intent:
  purpose: >-
    Dire si un motif de secret détecté est un vrai secret ou un faux positif, avec ce qui le prouve — et, dans le doute, ce qu'il faut faire quand même.
  not_for: >-
    Ce n'est pas un verdict qui clôt le sujet : classer un vrai secret en faux positif laisse une clé vivante. Ce n'est pas non plus la procédure de révocation (`rediger-la-procedure-de-revocation`) ni une recherche dans l'historique.
model_tier: mid
target_level: experimental
variables:
  - name: rapport_secrets
    source: signal
    required: true
    description: >-
      Les motifs de secret trouvés dans le dépôt, avec leur fichier et leur ligne — valeurs caviardées.
  - name: code
    source: repo
    required: true
    description: >-
      Le contenu du fichier choisi.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - 'Ce qui a été détecté'
      - 'Mon appréciation'
      - 'Ce qui la prouverait'
      - 'Ce qu''il faut faire en attendant'
spec: |-
  Tu dis si un motif de secret détecté est un vrai secret.
  
  Le scan :
  {{rapport_secrets}}
  
  Le code :
  {{code}}
  
  Rends exactement ces sections, avec ces titres :
  
  ## Ce qui a été détecté
  ## Mon appréciation
  ## Ce qui la prouverait
  ## Ce qu'il faut faire en attendant
  
  ── LES VALEURS NE SE RECOPIENT JAMAIS ────────────────────────────────────
  
  Les secrets de la matière sont caviardés. Ne recopie AUCUNE valeur, même
  tronquée, même « pour illustrer », même comme exemple de ce à quoi ça ressemble.
  Ton texte partira en pièce jointe et sera collé dans un ticket : il republierait
  ce que le caviardage venait de retirer.
  
  Nomme le fichier, la ligne et le TYPE. Jamais la valeur.
  
  ── L'ASYMÉTRIE, ET ELLE DÉCIDE DE TOUT ───────────────────────────────────
  
  LES DEUX ERREURS NE COÛTENT PAS PAREIL. Classer un vrai secret en faux positif laisse une
  clé vivante dans un dépôt, pour des années. Classer un faux positif en vrai secret fait
  perdre vingt minutes.
  
  DANS LE DOUTE, TU TRAITES COMME VRAI. Et tu n'écris jamais « faux positif » tout seul :
  le verdict vient toujours avec ce qui le prouve, et avec ce qu'il faut faire tant que ce
  n'est pas prouvé.
  
  ── CE QU'ON ATTEND ───────────────────────────────────────────────────────
  
  CE QUI A ÉTÉ DÉTECTÉ
  Le fichier, la ligne, le type de motif. Puis le CONTEXTE, depuis le code lu : à quoi sert
  cette ligne, dans quelle fonction, dans quel fichier. C'est le contexte qui tranche, jamais
  la forme de la chaîne.
  
  MON APPRÉCIATION
  « Probablement un vrai secret », « probablement un faux positif », « impossible à trancher
  d'ici » — et le raisonnement.
  
  Ce qui penche vers le FAUX POSITIF : un fichier de test ou de fixture, une valeur
  manifestement factice, un exemple de documentation, une valeur remplacée à l'exécution, une
  chaîne dont la forme correspond au motif par hasard.
  
  Ce qui penche vers le VRAI SECRET : une valeur d'apparence aléatoire, un fichier de
  configuration d'environnement, un nom de variable qui l'annonce, une valeur utilisée
  directement dans un appel réseau, un fichier qui ne devrait pas être versionné.
  
  Le piège classique : « c'est une clé de développement ». Une clé de développement reste une
  clé, elle donne accès à un environnement, et elle est très souvent la même partout.
  
  CE QUI LA PROUVERAIT
  Concret : demander à qui a écrit la ligne, chercher si la valeur est active chez le
  fournisseur, regarder si un remplacement à l'exécution existe, vérifier si le fichier est
  chargé en production. C'est la vérification humaine que ton appréciation ne remplace pas.
  
  CE QU'IL FAUT FAIRE EN ATTENDANT
  Toujours renseignée, même quand tu penches vers le faux positif. Si c'est peut-être vrai :
  révoquer d'abord, enquêter ensuite — la révocation d'une clé inutilisée ne coûte rien, une
  clé vivante coûte tout. Si c'est probablement faux : le marquer comme tel dans l'outil de
  scan pour que le prochain passage ne le resignale pas — le bruit finit par faire ignorer
  les vrais.
