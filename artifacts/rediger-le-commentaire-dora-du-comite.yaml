# Capacité de l'inventaire du hub — module « DORA Insights ».
# besoin : « un agent qui rédige en cinq lignes le commentaire DORA pour le comité mensuel »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# LE PIÈGE DU GENRE : la longueur. On demande cinq lignes et on reçoit deux pages,
# parce qu'un modèle a horreur de laisser une nuance de côté. Un commentaire de
# comité qui déborde n'est pas lu — donc il n'existe pas, et le mois suivant
# personne ne le redemande.
#
# Le second piège : le superlatif. « Excellente dynamique », « progression
# remarquable ». Un comité qui lit ça deux mois de suite cesse de croire le
# troisième.
id: rediger-le-commentaire-dora-du-comite
kind: prompt
title: Le commentaire DORA du comité — cinq lignes, et rien de plus
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [dora, communication]
intent:
  purpose: >-
    Rédiger en cinq lignes le commentaire DORA du comité mensuel : ce qui a bougé, ce que ça veut dire, et la seule décision qui est demandée au comité — s'il y en a une.
  not_for: >-
    Ce n'est pas une explication des métriques (`expliquer-les-quatre-metriques-dora`) ni un plan d'action (`dora-et-plan-action`). Ce n'est pas non plus un rapport : cinq lignes, et ce qui n'y tient pas est justement ce qu'un comité n'a pas à trancher.
model_tier: mid
target_level: experimental
variables:
  - name: chiffres_dora
    source: signal
    required: true
    description: >-
      Les quatre métriques DORA calculées sur la période, avec ce qui n'a pas pu être mesuré.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
spec: |-
  Tu écris le commentaire DORA du comité mensuel.
  
  Les chiffres ci-dessous sont CALCULÉS par la plateforme.
  
  {{chiffres_dora}}
  
  ── LA CONTRAINTE, ET ELLE PRIME SUR TOUT LE RESTE ────────────────────────
  
  CINQ LIGNES. Pas de titre, pas de sections, pas de liste à puces, pas de tableau. Cinq
  phrases au plus, en un seul bloc, prêtes à coller dans un support de comité.
  
  Ce qui ne tient pas en cinq lignes n'a pas sa place devant un comité : ce n'est pas de
  la place qui manque, c'est que le détail appelle une discussion technique qui n'aura pas
  lieu là. Si tu as envie d'en écrire plus, c'est le signe qu'il faut une réunion, pas un
  paragraphe — et tu peux le dire, en une ligne, dans les cinq.
  
  ── CE QUE LES CINQ LIGNES CONTIENNENT ────────────────────────────────────
  
  Dans cet ordre, et seulement ce qui est vrai :
  
  1. ce qui a bougé depuis le mois dernier, avec le chiffre — ou « stable », qui est une
     information et non un aveu ;
  2. ce que ça veut dire concrètement pour la livraison — pas la définition de la métrique ;
  3. la cause probable, présentée comme une hypothèse quand c'en est une ;
  4. ce qui est engagé pour le mois qui vient, s'il y a quelque chose ;
  5. LA DÉCISION attendue du comité — un arbitrage, un moyen, une priorité — ou, très
     explicitement, « aucune décision attendue ce mois-ci ».
  
  Le point 5 est le seul qui justifie le passage en comité. Une ligne « aucune décision
  attendue » est une bonne ligne : elle rend au comité le temps qu'un point d'information
  lui aurait pris.
  
  ── LES INTERDITS ─────────────────────────────────────────────────────────
  
  - AUCUN SUPERLATIF. Ni « excellent », ni « remarquable », ni « préoccupant ». Le chiffre
    parle ; l'adjectif ne fait que dire à quel point tu voudrais qu'on le croie.
  - AUCUN CHIFFRE QUI N'EST PAS DANS LA MATIÈRE, et surtout aucune projection : « nous
    atteindrons » n'a rien à faire là.
  - « N/A N'EST PAS ZÉRO ». Si une métrique n'est pas mesurable, dis-le en toutes lettres
    plutôt que de l'omettre — une absence silencieuse se lit comme un zéro.
  - AUCUN NOM DE PERSONNE.
