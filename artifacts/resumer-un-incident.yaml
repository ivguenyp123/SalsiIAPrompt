# Écrit pour le moment où il sert : trois heures du matin, quelqu'un vient d'être reveille
# et doit comprendre en dix secondes. D'où le plafond de longueur très bas — un resume
# d'incident long n'est pas un resume.

id: resumer-un-incident
kind: prompt
title: Résumer un incident
owner:
  person: ivguenyp123
  scope: Livraison
tags: [exploitation, astreinte]
moment: incident

intent:
  purpose: >
    Transformer des notes d'astreinte en résumé exploitable : ce qui s'est passé, ce
    qui a été fait, ce qui reste ouvert.
  not_for: >
    Ne pas utiliser pour rédiger une analyse post-mortem : elle demande des causes
    profondes que des notes prises à chaud ne contiennent pas.

spec: |
  Tu résumes cet incident survenu sur {{repo}}, à partir des notes d'astreinte.

  Structure ta réponse ainsi, avec ces titres exactement :
  ## Ce qui s'est passé
  ## Ce qui a été fait
  ## Ce qui reste ouvert

  Règles :
  - « Ce qui s'est passé » tient en deux phrases, dont l'impact utilisateur
  - n'écris aucune cause qui ne soit pas dans les notes : si la cause est inconnue,
    écris « cause non établie »
  - « Ce qui reste ouvert » est une liste d'actions, chacune avec son porteur si les
    notes le disent
  - ne recopie aucun identifiant technique de connexion présent dans les notes
  - si les notes ne décrivent aucun incident, dis-le et arrête-toi

  Notes :
  {{notes}}

variables:
  - name: repo
    source: repo
    required: true
    description: Service concerné par l'incident.
  - name: notes
    source: user
    required: true
    description: Notes prises pendant l'astreinte, brutes.

tools:
  - id: read_repo_metadata
    mode: read
    executor: llm
  - id: read_pipeline_status
    mode: read
    executor: llm

criteria:
  - target: output.sections
    op: exists
    value: true
  - target: output.length
    op: lte
    value: 1500
  - target: output.contains_secret
    op: eq
    value: false

golden_cases:
  - id: gc-01-incident-clair
    context: { repo: demo-spring, notes: "23h10 alerte 5xx sur le service paiement. 23h14 rollback de la version 4.2.1 vers 4.2.0. 23h20 taux d'erreur revenu a zero. cause probable une migration de schema non retrocompatible." }
    expect: { output.sections: true, output.length: 1200 }
    runs: 5
    pass_at_least: 5

  - id: gc-02-cause-inconnue
    context: { repo: demo-spring, notes: "02h40 latence x10 sur l'API. 03h05 redemarrage des pods, retour a la normale. rien trouve dans les logs." }
    expect: { output.sections: true }
    runs: 5
    pass_at_least: 4

  - id: gc-03-pas-un-incident
    context: { repo: demo-spring, notes: "maintenance planifiee de 22h a 23h, bandeau affiche, aucun impact." }
    expect: { output.length: 500 }
    runs: 3
    pass_at_least: 3

  - id: gc-04-notes-vides
    context: { repo: demo-spring, notes: " " }
    expect: { output.length: 300 }
    runs: 3
    pass_at_least: 3

target_level: team
model_tier: small
classification:
  max_repo_sensitivity: confidentiel
