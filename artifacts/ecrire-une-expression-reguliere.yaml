# Le plus petit agent du catalogue, et celui qui rend le plus de temps : personne n'écrit
# une expression régulière juste du premier coup, et tout le monde en écrit.
# `output.is_valid_json` rend sa sortie vérifiable par du code, sans juge.

id: ecrire-une-expression-reguliere
kind: prompt
title: Écrire une expression régulière
owner:
  person: ivguenyp123
  scope: Data
tags: [regex, outillage]
moment: revue

intent:
  purpose: >
    Traduire une intention décrite en français en expression régulière, avec les cas
    qu'elle accepte et ceux qu'elle rejette.
  not_for: >
    Ne pas utiliser pour valider une adresse électronique ni un IBAN : ces formats ont
    des bibliothèques dédiées, et une expression régulière y est toujours fausse.

spec: |
  Tu écris une expression régulière pour le besoin décrit ci-dessous, dans le contexte
  du dépôt {{repo}}.

  Rends UNIQUEMENT un objet JSON, sans texte autour, avec exactement ces clés :
  {"motif": "...", "explication": "...", "accepte": ["..."], "rejette": ["..."]}

  Règles :
  - `motif` ne contient ni délimiteur ni drapeau : uniquement l'expression
  - `explication` tient en une phrase et décrit l'intention, pas la syntaxe
  - `accepte` et `rejette` contiennent trois exemples chacun, tous différents
  - au moins un exemple de `rejette` doit être un cas qu'on croirait accepté
  - si le besoin est ambigu, choisis l'interprétation la plus restrictive et dis-le
    dans `explication`

  Besoin :
  {{besoin}}

variables:
  - name: repo
    source: repo
    required: true
    description: Dépôt concerné, pour situer le format attendu.
  - name: besoin
    source: user
    required: true
    description: Ce que l'expression doit reconnaître, décrit en français.

tools:
  - id: read_repo_metadata
    mode: read
    executor: llm

criteria:
  - target: output.is_valid_json
    op: eq
    value: true
  - target: output.length
    op: lte
    value: 1200
  - target: output.contains_secret
    op: eq
    value: false

golden_cases:
  - id: gc-01-nominal
    context: { repo: demo-data, besoin: "un numero de version SemVer, sans prefixe v" }
    expect: { output.is_valid_json: true, output.length: 800 }
    runs: 5
    pass_at_least: 5

  - id: gc-02-nominal-tag-image
    context: { repo: demo-data, besoin: "un tag d'image docker de la forme 1.2.3-preprod" }
    expect: { output.is_valid_json: true }
    runs: 5
    pass_at_least: 5

  - id: gc-03-besoin-ambigu
    context: { repo: demo-data, besoin: "un identifiant" }
    expect: { output.is_valid_json: true }
    runs: 5
    pass_at_least: 4

  - id: gc-04-besoin-vide
    context: { repo: demo-data, besoin: " " }
    expect: { output.length: 400 }
    runs: 3
    pass_at_least: 3

target_level: team
model_tier: nano
classification:
  max_repo_sensitivity: public
