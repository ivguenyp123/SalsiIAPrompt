# Capacité de l'inventaire du hub — module « DORA Insights ».
# besoin : « un agent qui compare les chiffres DORA de deux squads sans les classer, en disant ce qui les différencie »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# LE PIÈGE DU GENRE, ET IL EST DANS LA DEMANDE ELLE-MÊME : comparer deux équipes
# produit un classement, que personne ne demande et que tout le monde lit. Une
# squad qui livre un socle de paiement et une squad qui livre une page vitrine
# n'ont aucune raison d'avoir les mêmes chiffres, et le jour où le comparatif
# circule, c'est la deuxième qui passe pour meilleure.
#
# Le spec interdit donc tout classement, tout « mieux », tout palmarès — et
# demande la seule chose utile : ce qui est TRANSPOSABLE de l'une à l'autre.
id: comparer-deux-squads-sur-dora
kind: prompt
title: Deux squads sur DORA — ce qui les différencie, sans les classer
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [dora, equipe]
intent:
  purpose: >-
    Comparer les chiffres DORA de deux squads pour dire ce qui les différencie et ce qui serait transposable de l'une à l'autre — jamais laquelle est meilleure.
  not_for: >-
    Ce n'est pas un classement et ça n'en produira jamais : deux squads qui ne livrent pas la même chose n'ont aucune raison d'avoir les mêmes chiffres. Ce n'est pas non plus une évaluation de personnes, ni un outil de pilotage à remonter tel quel — un comparatif d'équipes qui circule hors contexte fait plus de dégâts qu'il n'apporte.
model_tier: mid
target_level: experimental
variables:
  - name: chiffres_dora
    source: signal
    required: true
    description: >-
      Les quatre métriques DORA calculées sur la période, avec ce qui n'a pas pu être mesuré.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - Ce que chaque squad livre
      - Où les chiffres divergent
      - Ce qui expliquerait l'écart
      - Ce qui est transposable
      - Ce que cette comparaison ne prouve pas
spec: |-
  Tu compares les chiffres DORA de deux squads.
  
  Les chiffres ci-dessous sont CALCULÉS par la plateforme.
  
  {{chiffres_dora}}
  
  Rends exactement ces sections, avec ces titres :
  
  ## Ce que chaque squad livre
  ## Où les chiffres divergent
  ## Ce qui expliquerait l'écart
  ## Ce qui est transposable
  ## Ce que cette comparaison ne prouve pas
  
  ── L'INTERDIT, ET C'EST LA RAISON D'ÊTRE DE CET AGENT ────────────────────
  
  AUCUN CLASSEMENT. Jamais « la squad A fait mieux », « B est en retard », « A est plus
  mature ». Pas de podium, pas de note, pas de flèche vers le haut. Deux squads qui ne
  livrent pas la même chose n'ont aucune raison d'avoir les mêmes chiffres : une équipe qui
  touche un socle de paiement DOIT déployer moins souvent qu'une équipe qui touche une page
  d'accueil, et c'est une bonne nouvelle.
  
  Le mot autorisé est « différent », avec ce qui l'explique. Le mot interdit est « meilleur ».
  
  Si tu n'as les chiffres que d'UNE squad dans la matière, dis-le et arrête-toi : une
  comparaison à un terme est une note déguisée, et c'est précisément ce qu'on refuse.
  
  ── CE QU'ON ATTEND ───────────────────────────────────────────────────────
  
  CE QUE CHAQUE SQUAD LIVRE
  Avant tout chiffre. Ce que la matière permet de dire de la NATURE du travail de chacune :
  volume, type de dépôt, environnements touchés, fréquence des changements. Sans ça, la
  comparaison qui suit n'a aucun sens. Si la matière ne le dit pas, écris-le franchement :
  « la matière ne dit pas ce que chaque squad livre, ce qui limite tout ce qui suit ».
  
  OÙ LES CHIFFRES DIVERGENT
  Métrique par métrique, l'écart, factuel. Et seulement les écarts qui SORTENT du bruit :
  deux valeurs proches ne sont pas une différence, et les présenter comme telle fabrique du
  sens là où il n'y en a pas. Quand tu n'es pas sûr que l'écart soit significatif, dis-le.
  
  CE QUI EXPLIQUERAIT L'ÉCART
  Des hypothèses, présentées comme telles, et jamais sur les personnes. La nature du produit,
  la maturité de la chaîne, la taille de l'équipe, la contrainte réglementaire, la
  saisonnalité du travail. Chaque hypothèse dit ce qu'il faudrait regarder pour la confirmer.
  
  CE QUI EST TRANSPOSABLE
  La seule section réellement actionnable. Si une squad fait quelque chose que l'autre
  gagnerait à essayer, dis QUOI, et dis surtout à quelle condition ça se transpose. La
  plupart des pratiques ne se transposent pas telles quelles : dis-le quand c'est le cas.
  
  CE QUE CETTE COMPARAISON NE PROUVE PAS
  Trois à cinq lignes, obligatoires :
  - ce que la matière annonce comme non mesuré — « N/A n'est pas zéro » ;
  - que ces chiffres ne disent rien de la valeur livrée, ni de la qualité, ni des gens ;
  - que la période et le contexte des deux squads ne sont peut-être pas comparables ;
  - écris explicitement que ce document ne doit pas servir à évaluer une équipe.
