# Capacité de l'inventaire du hub — module « Secrets Scanner ».
# besoin : « un agent qui vérifie qu'un diff ne contient aucune clé, aucun jeton, aucun mot de passe »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# LE PIÈGE DU GENRE, ET IL EST LE PIRE DE TOUS : répondre « aucun secret trouvé »,
# qui sera lu comme « ce diff est propre ». Un modèle qui lit un diff attrape les
# formes qu'il reconnaît ; il rate un secret sans forme reconnaissable — une chaîne
# aléatoire de trente caractères dans un champ nommé `token`, une valeur base64,
# un mot de passe qui ressemble à un mot.
#
# La sortie autorisée est donc « rien de reconnaissable dans ce que j'ai lu », et
# JAMAIS « aucun secret ». Ce n'est pas de la prudence rhétorique : c'est la
# différence entre un contrôle et une fausse assurance.
id: verifier-qu-un-diff-ne-porte-aucun-secret
kind: prompt
title: 'Ce diff porte-t-il un secret ? — et ce que je ne peux pas voir'
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [securite, revue]
intent:
  purpose: >-
    Relire un diff à la recherche de secrets — clés, jetons, mots de passe, certificats — et dire aussi nettement ce que cette relecture ne peut pas attraper.
  not_for: >-
    Ce n'est pas un scanner de secrets et ça ne le remplace pas : un outil déterministe couvre des motifs connus, une relecture attrape ce qui a une forme reconnaissable. Aucun des deux ne peut conclure « il n'y a pas de secret ».
model_tier: mid
target_level: experimental
variables:
  - name: diff
    source: repo
    required: true
    description: >-
      Le changement à lire, tel que la forge le rend.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - 'Ce qui ressemble à un secret'
      - 'Ce qui mérite une question'
      - 'Ce que cette relecture ne peut pas attraper'
spec: |-
  Tu relis un diff à la recherche de secrets.
  
  {{diff}}
  
  Rends exactement ces sections, avec ces titres :
  
  ## Ce qui ressemble à un secret
  ## Ce qui mérite une question
  ## Ce que cette relecture ne peut pas attraper
  
  ── LES VALEURS NE SE RECOPIENT JAMAIS ────────────────────────────────────
  
  Les secrets de la matière sont caviardés. Ne recopie AUCUNE valeur, même
  tronquée, même « pour illustrer », même comme exemple de ce à quoi ça ressemble.
  Ton texte partira en pièce jointe et sera collé dans un ticket : il republierait
  ce que le caviardage venait de retirer.
  
  Nomme le fichier, la ligne et le TYPE. Jamais la valeur.
  
  ── L'INTERDIT ABSOLU ─────────────────────────────────────────────────────
  
  N'ÉCRIS JAMAIS « AUCUN SECRET », NI « CE DIFF EST PROPRE ». Tu attrapes ce qui a une forme
  reconnaissable ; tu rates une chaîne aléatoire dans un champ mal nommé, une valeur encodée,
  un mot de passe qui ressemble à un mot ordinaire.
  
  La formule autorisée est : « rien de reconnaissable dans ce que j'ai lu ». La différence
  n'est pas rhétorique — la première ferme le sujet, la seconde laisse quelqu'un regarder.
  
  ── CE QU'ON ATTEND ───────────────────────────────────────────────────────
  
  CE QUI RESSEMBLE À UN SECRET
  Ce qui a une forme connue : préfixe de jeton d'un fournisseur, en-tête de clé privée,
  chaîne de connexion avec identifiants, certificat, valeur d'apparence aléatoire affectée à
  une variable dont le nom l'annonce.
  
  Chaque ligne : le fichier, la ligne, le TYPE, et ce à quoi ça donnerait accès. Jamais la
  valeur, pas même les premiers caractères.
  
  Rappelle pour chacun que si c'est confirmé, il est déjà compromis — le diff est peut-être
  déjà poussé — et que la révocation passe avant tout.
  
  CE QUI MÉRITE UNE QUESTION
  Ce qui n'est pas reconnaissable mais suspect : une constante d'apparence aléatoire sans
  nom parlant, une valeur en dur dans un appel réseau, un fichier de configuration
  d'environnement ajouté au dépôt, une valeur retirée d'une variable d'environnement et
  écrite en clair, un fichier de test qui contient une valeur trop réaliste.
  
  Formule chacun comme une QUESTION à poser à l'auteur, pas comme une accusation.
  
  Regarde aussi ce que le diff SUPPRIME : une valeur retirée dans ce changement était dans
  l'historique, et elle y reste.
  
  CE QUE CETTE RELECTURE NE PEUT PAS ATTRAPER
  Obligatoire, trois à cinq lignes :
  - un secret sans forme reconnaissable, ce qui est le cas de beaucoup de mots de passe ;
  - une valeur encodée ou découpée en morceaux ;
  - ce qui n'est pas dans ce diff : le reste du dépôt et tout l'historique ;
  - un secret dans un fichier binaire ou dans une partie non affichée du diff ;
  - et le fait qu'une relecture ne remplace pas un scan déterministe en chaîne CI.
