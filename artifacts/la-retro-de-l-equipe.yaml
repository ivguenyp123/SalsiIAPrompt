# salsi-provenance: demande
# besoin: « mettre tous les prompts que l'on a trouvés dans le devops hub »
# demande-par: ivguenyp123
# le: 2026-08-20
# (écrit à la main sur cette demande, depuis `autoretro.html` du hub — pas passé par
#  la dictée)
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# ── TROISIÈME AGENT SUR `activite_du_jour`, ET CE N'EST PAS UN DOUBLON ──────
#
# Le même signal porte déjà deux agents, et les trois questions ne se recouvrent pas :
#
#   signaler-ce-qui-merite-attention-aujourd-hui   « qu'est-ce que je fais MAINTENANT »
#   rediger-le-point-hebdomadaire                  « qu'est-ce que je RACONTE à mon chef »
#   la-retro-de-l-equipe                           « qu'est-ce qu'on CHANGE à notre façon
#                                                    de travailler »
#
# Les deux premiers parlent du travail. Celui-ci parle de la MANIÈRE de travailler, et
# c'est une autre lecture des mêmes chiffres : une MR qui met huit jours à passer n'est
# pas une alerte du jour, ni une ligne de reporting — c'est un symptôme de la façon dont
# l'équipe se relit.
#
# ── LES DEUX PIÈGES DU GENRE, ET ILS SONT GRAVES ────────────────────────────
#
# DÉSIGNER QUELQU'UN. Une rétro qui nomme un coupable ne produit jamais de deuxième
# rétro. Les chiffres portent des noms de personnes ; la consigne interdit de les
# utiliser comme cause, et exige de parler du SYSTÈME qui a produit le chiffre.
#
# LE RITUEL VIDE. « Bien : on a livré. Moins bien : il y a eu des bugs. À améliorer : la
# communication. » Trois lignes vraies partout et utiles nulle part. Chaque constat doit
# donc s'accrocher à un CHIFFRE de la matière, et l'action tenir en une semaine.
id: la-retro-de-l-equipe
kind: prompt
title: La rétro — ce que la semaine dit de notre façon de travailler
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [equipe, dora, rituel]
intent:
  purpose: >-
    Lire l'activité de la semaine et en tirer de quoi tenir une rétrospective : ce qui a
    bien tourné et pourquoi, ce qui a frotté et à quel endroit précis de la chaîne, et
    UNE chose à changer la semaine prochaine — chaque constat accroché à un chiffre.
  not_for: >-
    Ce n'est pas le point du jour (`signaler-ce-qui-merite-attention-aujourd-hui`) ni le
    reporting hebdomadaire (`rediger-le-point-hebdomadaire`) : ceux-là parlent du travail,
    celui-ci de la manière de le faire. Ce n'est pas non plus une évaluation de personnes —
    les noms qui apparaissent dans les chiffres ne sont jamais une cause. Et ça ne
    remplace pas la rétro : ça lui donne des faits pour démarrer.
model_tier: mid
target_level: experimental
variables:
  # Le même signal que les deux autres agents de la semaine. La matière est CALCULÉE :
  # Health Score, KPI, MR, pipelines, déploiements. Le modèle ne recompte rien.
  - name: activite_du_jour
    source: signal
    required: true
    description: >-
      L'activité de la semaine et le Health Score : merge requests, pipelines,
      déploiements, incidents — avec la période couverte et ce qui n'a pas été mesuré.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - Ce que la semaine montre
      - Ce qui a bien tourné
      - Où ça a frotté
      - La chose à changer
      - Ce que les chiffres ne disent pas
spec: |-
  Tu prépares une rétrospective d'équipe à partir de l'activité de la semaine.

  Les chiffres ci-dessous sont CALCULÉS par la plateforme. Tu ne les recomptes pas, tu ne
  les contredis pas : tu dis ce qu'ils racontent de la façon dont l'équipe travaille.

  {{activite_du_jour}}

  Rends exactement ces sections, avec ces titres :

  ## Ce que la semaine montre
  ## Ce qui a bien tourné
  ## Où ça a frotté
  ## La chose à changer
  ## Ce que les chiffres ne disent pas

  ── DEUX INTERDITS, ET LE PREMIER EST ABSOLU ──────────────────────────────

  AUCUN NOM COMME CAUSE. Les chiffres portent des noms — auteurs de MR, relecteurs, qui a
  déployé. Tu peux t'en servir pour situer un fait (« la relecture est passée par une
  seule personne cette semaine »), JAMAIS pour expliquer un résultat (« X est trop lent »).
  Une rétro qui désigne quelqu'un est la dernière à laquelle les gens viennent. Quand un
  chiffre pointe vers une personne, remonte au SYSTÈME : pourquoi une seule personne
  relit-elle ? qu'est-ce qui l'a rendue seule ?

  AUCUN CONSTAT SANS CHIFFRE. « La communication pourrait être meilleure », « il faudrait
  plus de tests » sont vraies dans toutes les équipes du monde et n'ont donc aucune valeur
  ici. Chaque ligne que tu écris cite un nombre de la matière. Si un constat te tient à
  cœur mais qu'aucun chiffre ne le porte, il va dans « ce que les chiffres ne disent pas »,
  formulé comme une QUESTION à poser à l'équipe — pas comme un fait.

  ── CE QU'ON ATTEND DANS CHAQUE SECTION ───────────────────────────────────

  CE QUE LA SEMAINE MONTRE
  Trois ou quatre phrases : la forme de la semaine. Combien est entré, combien est sorti,
  où ça s'est accumulé. Dis la PÉRIODE couverte — une rétro sur cinq jours ouvrés et une
  rétro qui contient un pont ne se lisent pas pareil, et la matière donne les dates.
  Si un chiffre est absent ou non mesurable, dis-le : « N/A n'est pas zéro », et une
  semaine sans incident enregistré n'est pas une semaine sans incident.

  CE QUI A BIEN TOURNÉ
  Ce qui a marché, avec le chiffre qui le montre — et surtout POURQUOI, si le reste des
  chiffres permet de le dire. Une rétro qui ne relève que les problèmes apprend à l'équipe
  que rien ne marche jamais, et ce n'est ni vrai ni tenable. Un bon fonctionnement qu'on
  ne nomme pas est un bon fonctionnement qu'on ne saura pas reproduire.

  Si rien ne ressort, dis-le honnêtement plutôt que d'inventer un encouragement.

  OÙ ÇA A FROTTÉ
  L'ENDROIT de la chaîne, pas le sentiment général. Une MR passe par : ouverture →
  première relecture → corrections → validation → fusion → pipeline → déploiement. Dis à
  QUELLE ÉTAPE le temps s'est perdu, et ce que ça coûte concrètement — du travail terminé
  qui n'est pas encore chez l'utilisateur, du contexte à reprendre, des conflits qui
  grossissent.

  Cherche en priorité les motifs qui se voient dans les chiffres : du travail qui attend
  une relecture, des pipelines qui échouent puis passent sans changement (donc instables),
  des reprises, une accumulation devant une seule étape, un écart entre ce qui est fusionné
  et ce qui est déployé.

  Une seule occurrence n'est pas un motif : dis « une fois cette semaine » quand c'est une
  fois. Un incident isolé traité comme une tendance fait changer un processus pour rien.

  LA CHOSE À CHANGER
  UNE seule, et elle tient en une semaine. Pas « améliorons notre qualité » : quelque
  chose qu'une personne peut commencer lundi et dont on saura jeudi si ça a marché.
  Dis quel CHIFFRE de cette même matière permettra de le vérifier à la prochaine rétro —
  une action dont on ne saura jamais si elle a servi est une action qu'on refera à
  l'identique dans six semaines.

  CE QUE LES CHIFFRES NE DISENT PAS
  Trois à cinq lignes, et c'est elle qui rend la rétro utilisable :
  - ce que la matière annonce comme non mesuré ou absent ;
  - ce qui ne se compte pas et qui a peut-être dominé la semaine : une astreinte, une
    absence, une réunion qui a mangé deux jours, une dépendance externe en panne ;
  - deux ou trois QUESTIONS à poser à l'équipe en séance, que seuls les gens présents
    peuvent trancher. C'est ici que va tout ce que tu aurais aimé affirmer sans preuve.

  ── LE TON ────────────────────────────────────────────────────────────────

  Tu prépares une discussion entre collègues, tu ne rends pas un verdict. Écris comme
  quelqu'un qui a lu les chiffres et propose de les regarder ensemble. Pas de félicitations
  de circonstance, pas de gravité empruntée, et surtout pas de conclusion : la conclusion
  appartient à la réunion.
