# Capacité de l'inventaire du hub — module « Secrets Scanner ».
# besoin : « un agent qui dit si un secret retiré du code est encore lisible dans l'historique git »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# LE PIÈGE DU GENRE : la question elle-même est mal posée, et le spec doit le dire.
# « Est-ce que le secret est encore dans l'historique » a presque toujours la même
# réponse — OUI, s'il y a été un jour. Git conserve tout ; retirer une ligne
# ajoute un commit, ça n'en enlève aucun.
#
# La vraie question, et celle à laquelle l'agent doit répondre, est : puisqu'il y
# est, qu'est-ce que ça implique, et la réécriture d'historique en vaut-elle le
# prix. La réponse est souvent non — révoquer suffit, et coûte infiniment moins.
id: reperer-les-secrets-dans-l-historique
kind: prompt
title: 'Ce secret est-il encore dans l''historique ? — et ce que ça change'
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [securite, incident]
intent:
  purpose: >-
    Dire si un secret retiré du code reste lisible dans l'historique, ce que ça implique réellement, et si une réécriture d'historique en vaut le prix — le plus souvent, non.
  not_for: >-
    Ce n'est pas une recherche exhaustive dans l'historique : la matière n'en donne qu'une partie. Et ce n'est pas une procédure de révocation (`rediger-la-procedure-de-revocation`), qui doit être faite AVANT de se poser cette question.
model_tier: mid
target_level: experimental
variables:
  - name: rapport_secrets
    source: signal
    required: true
    description: >-
      Les motifs de secret trouvés dans le dépôt, avec leur fichier et leur ligne — valeurs caviardées.
  - name: historique_commits
    source: repo
    required: true
    description: >-
      Les commits de la période, avec leur auteur, leur date et leur message.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - 'La réponse courte'
      - 'Ce que ça implique vraiment'
      - 'La réécriture : ce qu''elle coûte'
      - 'Ma recommandation'
      - 'Ce que je n''ai pas pu vérifier'
spec: |-
  Tu dis si un secret retiré du code est encore lisible dans l'historique git.
  
  Le scan :
  {{rapport_secrets}}
  
  L'historique :
  {{historique_commits}}
  
  Rends exactement ces sections, avec ces titres :
  
  ## La réponse courte
  ## Ce que ça implique vraiment
  ## La réécriture : ce qu'elle coûte
  ## Ma recommandation
  ## Ce que je n'ai pas pu vérifier
  
  ── LES VALEURS NE SE RECOPIENT JAMAIS ────────────────────────────────────
  
  Les secrets de la matière sont caviardés. Ne recopie AUCUNE valeur, même
  tronquée, même « pour illustrer », même comme exemple de ce à quoi ça ressemble.
  Ton texte partira en pièce jointe et sera collé dans un ticket : il republierait
  ce que le caviardage venait de retirer.
  
  Nomme le fichier, la ligne et le TYPE. Jamais la valeur.
  
  ── LA RÉPONSE EST PRESQUE TOUJOURS OUI, ET IL FAUT LE DIRE ───────────────
  
  Git ne supprime rien. Retirer une ligne AJOUTE un commit ; le commit d'origine reste, avec
  sa valeur, dans le dépôt et dans tous les clones qui en ont été faits.
  
  La question intéressante n'est donc pas « y est-il encore » mais « puisqu'il y est,
  qu'est-ce que ça change, et faut-il réécrire ». Réponds à celle-là.
  
  ── CE QU'ON ATTEND ───────────────────────────────────────────────────────
  
  LA RÉPONSE COURTE
  Deux phrases. Si le secret a été committé un jour, il est dans l'historique — dis-le
  franchement, sans détour. Si la matière ne permet pas de savoir s'il l'a été, dis ça.
  
  CE QUE ÇA IMPLIQUE VRAIMENT
  La nuance qui compte, et qu'on rate en général. Ce qui décide de la gravité :
  - le secret est-il RÉVOQUÉ ? Une valeur morte dans l'historique n'est qu'une chaîne de
    caractères, et le sujet est clos. C'est la première chose à établir ;
  - qui a accès au dépôt, et existe-t-il des clones ou des miroirs hors de ce périmètre ;
  - la valeur a-t-elle circulé ailleurs — journaux de CI, artefacts, images construites, une
    copie de sauvegarde.
  Dans l'immense majorité des cas, un secret révoqué rend la réécriture d'historique inutile.
  
  LA RÉÉCRITURE : CE QU'ELLE COÛTE
  Sans l'adoucir : elle change tous les identifiants de commit à partir du point réécrit.
  Tous les clones existants deviennent incompatibles, toutes les branches en cours doivent
  être reprises, tous les liens vers des commits dans les tickets et les rapports cassent,
  et les copies déjà faites gardent la valeur de toute façon.
  
  C'est une opération qui s'annonce, se planifie et se fait avec l'équipe — jamais un
  vendredi, jamais dans l'urgence.
  
  MA RECOMMANDATION
  Une phrase, tranchée, avec la condition qui la porte : « révoquer suffit, la réécriture n'a
  pas de bénéfice ici » ou « la réécriture se justifie parce que … ». Le cas où elle se
  justifie vraiment est rare : une valeur non révocable, un dépôt qui doit devenir public, une
  donnée personnelle.
  
  CE QUE JE N'AI PAS PU VÉRIFIER
  Trois lignes : la matière ne donne qu'une PARTIE de l'historique, tu n'as pas cherché dans
  tous les commits, tu ne vois ni les branches supprimées, ni les étiquettes, ni les
  requêtes de fusion fermées — qui gardent leur contenu.
