# salsi-provenance: demande
# besoin: un agent qui recupere mes dora et m'explique comment les ameliorer
# demande-par: ivguenyp123
# le: 2026-08-17
# tours-de-correction: 2
# modele: deepseek-chat via deepseek
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.

id: analyse-dora-et-amelioration
kind: agent
title: Analyse et amélioration des DORA
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: Récupère les métriques DORA du dépôt et explique comment les améliorer.
  not_for: Ne pas utiliser pour modifier directement le code ou les pipelines, ni pour comparer les performances entre équipes.
spec: |-
    Récupère les métriques DORA du dépôt en utilisant les outils disponibles.
    Analyse le statut du pipeline, les résultats des tests et les vulnérabilités pour identifier les goulots d'étranglement.
    Explique, en français, les points faibles de la livraison et propose des actions concrètes pour améliorer la fréquence de déploiement, le délai d'exécution, le taux d'échec et le temps de restauration.
    Base ton analyse sur les données récupérées et non sur des suppositions.
    Structure ta réponse en deux sections : « Constats » et « Recommandations ».
    Dans « Constats », liste les problèmes identifiés avec les preuves à l'appui.
    Dans « Recommandations », propose des actions correctives hiérarchisées par impact.
    Termine par un résumé en trois points clés.
    Adapte tes recommandations au contexte suivant : {{contexte_equipe}}.
variables:
  - name: contexte_equipe
    source: user
    required: true
    description: Contexte sur l'équipe et les objectifs de livraison pour adapter les recommandations.
tools:
  - id: read_pipeline_status
    mode: read
    executor: llm
  - id: run_tests
    mode: read
    executor: llm
  - id: scan_vulnerabilities
    mode: read
    executor: llm
  - id: read_repo_metadata
    mode: read
    executor: llm
criteria:
  - target: output.sections
    op: contains
    value:
      - Recommandations
  - target: output.length
    op: gte
    value: 500
golden_cases:
  - id: gc-01-pipeline-echoue
    context:
      contexte_equipe: Équipe en phase de stabilisation
    expect:
      output.sections:
        - Constats
        - Recommandations
    runs: 5
    pass_at_least: 4
  - id: gc-02-pipeline-succes
    context:
      contexte_equipe: Équipe cherchant à accélérer
    expect:
      output.sections:
        - Constats
        - Recommandations
    runs: 5
    pass_at_least: 4
  - id: gc-03-vulnerabilites
    context:
      contexte_equipe: Équipe avec des exigences de sécurité
    expect:
      output.sections:
        - Constats
        - Recommandations
    runs: 5
    pass_at_least: 4
target_level: team
model_tier: mid
