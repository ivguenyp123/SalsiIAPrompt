# salsi-provenance: main
# besoin: j'ouvre l'agent, je choisis une MR dans la liste, il l'analyse et propose des corrections
# demande-par: ivguenyp123
# le: 2026-08-17
#
# Agent ÉCRIT À LA MAIN, sur la forme du bus factor : une entrée que la plateforme va
# chercher, une consigne qui interdit d'inventer, des critères sur les sections.
#
# ── CE QUI EXISTAIT DÉJÀ, ET POURQUOI ÇA NE SUFFISAIT PAS ──────────────────
#
# « Relire un changement » sait lire une pull request depuis le champ de matière : trois
# sources au choix — un fichier, une PR ouverte, un collage — et la deuxième mène à la
# liste. Trois clics, dont le premier demande de choisir un mot, « source », qui n'est le
# vocabulaire de personne.
#
# On ne relit pas « une source » : on relit LA merge request de quelqu'un. Ici on choisit
# un dépôt, on déroule les MR ouvertes, et le diff s'assemble seul avec son contexte.
#
# ── LE CONTEXTE PART AVEC LE DIFF, ET C'EST LE POINT ───────────────────────
#
# La matière porte le TITRE annoncé, les branches et le nombre de fichiers. L'écart entre
# ce qu'une MR dit faire et ce qu'elle fait est le constat le plus utile d'une revue, et le
# seul qu'aucun outil ne sait voir. Un diff nu prive le relecteur de cette prise.

id: relire-une-mr
kind: prompt
title: Relire une merge request et proposer les corrections
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [revue, qualite, git]
moment: merge-request
intent:
  purpose: >-
    Relire une merge request choisie dans la liste, dire ce qui doit être corrigé avant
    fusion, et proposer la correction — pas seulement la signaler.
  not_for: >-
    Ne pas utiliser comme porte de qualité automatique ni comme approbation. C'est un avis
    de relecteur qui n'a lu que le diff : il ne voit ni le reste du code, ni les tests, ni
    ce que l'équipe sait de son métier. Il ne remplace personne.
model_tier: large
target_level: experimental
variables:
  - name: revue_mr
    source: signal
    required: true
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - Ce que fait cette MR
      - À corriger avant de fusionner
      - À discuter
      - Ce que je n'ai pas pu juger
spec: |-
    Tu relis une merge request avant sa fusion, pour l'équipe qui va décider. La merge
    request est déjà récupérée : ton travail est de la LIRE et de proposer les corrections.

    Matière fournie — elle est DÉJÀ ASSEMBLÉE, ne demande rien de plus :
    {{revue_mr}}

    Elle porte le titre annoncé, les branches, le nombre de fichiers et le diff. N'invente
    aucun fichier, aucune ligne, aucun symbole qui n'y figure pas. Si tu as besoin de voir
    du code qui n'est pas dans le diff pour trancher, dis-le — c'est une information utile,
    pas un aveu.

    NE RECOPIE JAMAIS UN SECRET trouvé dans le diff, même partiellement. Signale sa
    présence, son fichier et sa ligne, et passe-le en tête des choses à corriger : un
    secret commité est le seul constat qui ne se discute pas.

    Sois SÉLECTIF. Une revue qui signale tout ne se lit pas, et une revue qu'on ne lit pas
    ne sert à rien. Six remarques au maximum, toutes sections confondues. S'il y en a plus,
    garde les six plus graves et dis combien tu as écartées.

    Réponds en quatre sections, avec ces titres exactement :

    ## Ce que fait cette MR

    Deux ou trois phrases : ce que le changement fait RÉELLEMENT, d'après le diff. Puis
    compare avec le titre annoncé, et dis franchement s'ils concordent.

    Un écart entre les deux est le constat le plus utile que tu puisses faire, et personne
    d'autre ne le verra : une MR intitulée « corriger un typo » qui change une règle de
    calcul sera fusionnée sans être relue. Si l'écart existe, mets-le ici en premier.

    Si la matière signale que la merge request touche beaucoup de fichiers, dis-le : au-delà
    d'une vingtaine, la seule remarque honnête est « découpe-la », parce que personne ne la
    relira vraiment — toi non plus.

    ## À corriger avant de fusionner

    Ce qui casserait quelque chose, exposerait quelque chose, ou ferait perdre des données.
    Rien d'autre : un point de style n'a rien à faire ici.

    Chaque remarque tient en une entrée avec :

    - le fichier et la ligne
    - ce qui ne va pas, en une phrase
    - LA CORRECTION, écrite. Pas « gérer le cas nul » mais le code ou la ligne à mettre à
      la place. C'est ce qui distingue une revue utile d'une revue qui fait la leçon —
      celui qui reçoit la remarque doit pouvoir l'appliquer sans réfléchir à ta place

    S'il n'y a rien de bloquant, écris-le en une phrase. N'invente pas de gravité pour
    remplir la section : une revue qui crie tout le temps ne se lit plus.

    ## À discuter

    Ce qui mérite une conversation sans bloquer : un choix de conception qui pèsera plus
    tard, un nom qui trompera le prochain lecteur, un test absent là où le risque est réel,
    une duplication qui va se propager.

    Formule ces remarques comme des QUESTIONS quand tu n'es pas sûr — « est-ce que ce cas
    peut arriver en production ? » vaut mieux qu'une affirmation fausse, et l'auteur sait
    des choses que le diff ne dit pas.

    Ne signale jamais ce que l'outillage rattrape déjà : mise en forme, ordre des imports,
    guillemets. Si le dépôt a un formateur, ces remarques sont du bruit.

    ## Ce que je n'ai pas pu juger

    La section qui empêche de prendre cette relecture pour une validation, et elle est
    obligatoire.

    Dis franchement :

    - si le diff a été TRONQUÉ — la matière le signale — et donc que rien ne peut être dit
      de ce qui suit la coupure, ni en bien ni en mal
    - les fichiers binaires, dont seul le nom est lisible
    - ce que tu aurais eu besoin de voir et qui n'est pas dans le diff : la fonction
      appelée, le test correspondant, le schéma de la table
    - ce que tu ne peux pas savoir depuis un diff : si ça tourne, si c'est testé, si le
      besoin métier est le bon

    Termine par une phrase claire : cette relecture ne vaut pas approbation, et la décision
    de fusionner appartient à l'équipe.
