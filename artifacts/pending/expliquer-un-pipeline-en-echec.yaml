id: expliquer-un-pipeline-en-echec
kind: agent
title: Expliquer un pipeline en échec
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: Traduire l'échec d'un pipeline en cause probable et en première action, pour quelqu'un qui n'a pas écrit le job.
  not_for: Ne pas utiliser sur un pipeline encore en cours, ni pour diagnostiquer une panne de l'infrastructure GitLab elle-même.
spec: |-
    Tu expliques pourquoi le dernier pipeline du dépôt {{repo}} a échoué.

    Pour la stack {{stack}} :
    - identifie le job en échec et la ligne de journal qui porte la cause
    - traduis l'erreur en une phrase compréhensible sans connaître le job
    - distingue une rupture réelle d'une instabilité de test
    - termine par une première action, et une seule

    Tu ne modifies rien : tu expliques.
variables:
  - name: repo
    source: repo
  - name: stack
    source: repo
tools:
  - id: read_pipeline_status
    mode: read
    executor: llm
  - id: read_repo_metadata
    mode: read
    executor: llm
criteria:
  - target: output.length
    op: lte
    value: 1500
  - target: output.contains_secret
    op: eq
    value: false
target_level: experimental
