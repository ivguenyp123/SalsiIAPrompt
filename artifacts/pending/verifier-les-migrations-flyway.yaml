id: verifier-les-migrations-flyway
kind: agent
title: Vérifier les migrations Flyway
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: Analyser les scripts de migration et signaler les ruptures de compatibilité ascendante.
  not_for: Ne pas utiliser sur un dépôt sans migrations versionnées, ni pour appliquer une migration.
spec: |-
    Tu analyses les migrations du dépôt {{repo}}.

    Pour la stack {{stack}} :
    - repère les changements de schéma non rétrocompatibles
    - signale toute colonne supprimée ou renommée
    - rédige un résumé des risques pour la merge request
variables:
  - name: repo
    source: repo
  - name: stack
    source: repo
tools:
  - id: read_repo_metadata
    mode: read
    executor: llm
criteria:
  - target: output.length
    op: lte
    value: 2000
  - target: output.contains_secret
    op: eq
    value: false
target_level: experimental
