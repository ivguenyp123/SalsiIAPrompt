# salsi-provenance: demande
# besoin: je voudrais un agent ia pour calculer mon bus factor et me donner des conseils
# demande-par: ivguenyp123
# le: 2026-08-17
# tours-de-correction: 3
# modele: deepseek-chat via deepseek
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.

id: bus-factor-analyzer
kind: agent
title: Analyse du bus factor et recommandations
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: Calculer le bus factor d'un dépôt et fournir des conseils pour réduire la dépendance aux contributeurs clés.
  not_for: Ne pas utiliser pour évaluer la performance individuelle des développeurs ou pour prendre des décisions de gestion des ressources humaines.
spec: |-
    Analyse le dépôt pour estimer son bus factor, c'est-à-dire le nombre minimal de contributeurs dont l'absence bloquerait le projet.
    Commence par lire les métadonnées du dépôt pour comprendre la stack et la branche par défaut.
    Examine ensuite l'historique des commits et les fichiers modifiés pour identifier les zones de code critiques et les contributeurs principaux.
    Évalue le nombre de contributeurs actifs et la répartition des connaissances sur les zones critiques identifiées.
    Calcule un bus factor global pour le dépôt en te basant sur la concentration des contributions et la complexité des modules.
    Produis un rapport structuré avec les sections suivantes :
    - `bus_factor_estime` : le nombre estimé de contributeurs clés.
    - `zones_risque` : une liste des fichiers ou modules les plus critiques et les plus dépendants d'un seul contributeur.
    - `contributeurs_cles` : une liste des contributeurs dont l'absence serait la plus impactante.
    - `conseils` : une liste de recommandations concrètes pour réduire le risque, comme la revue de code croisée, la documentation, ou la répartition des tâches.
    Assure-toi que le rapport est en français et que les conseils sont actionnables.
    Utilise le seuil de contribution fourni par l'utilisateur ({{seuil_contribution}}) pour déterminer quels contributeurs sont considérés comme clés.
variables:
  - name: seuil_contribution
    source: user
    required: true
    description: Le pourcentage de contributions (commits) à partir duquel un contributeur est considéré comme clé.
tools:
  - id: read_repo_metadata
    mode: read
    executor: llm
  - id: read_pipeline_status
    mode: read
    executor: llm
criteria:
  - target: output.json_keys
    op: contains
    value:
      - conseils
  - target: output.json_keys
    op: contains
    value:
      - bus_factor_estime
  - target: output.is_valid_json
    op: eq
    value: true
golden_cases:
  - id: gc-01-petit-module
    context:
      seuil_contribution: "20"
    expect:
      output.json_keys:
        - conseils
        - bus_factor_estime
      output.is_valid_json: true
    runs: 5
    pass_at_least: 4
  - id: gc-02-regles-metier
    context:
      seuil_contribution: "30"
    expect:
      output.json_keys:
        - conseils
        - bus_factor_estime
      output.is_valid_json: true
    runs: 5
    pass_at_least: 4
  - id: gc-03-fichier-fleuve
    context:
      seuil_contribution: "10"
    expect:
      output.json_keys:
        - conseils
        - bus_factor_estime
      output.is_valid_json: true
    runs: 5
    pass_at_least: 4
target_level: team
model_tier: mid
