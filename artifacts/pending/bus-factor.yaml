# besoin: assemblage de 1 prompt(s) : reproduire-le-calcul-du-bus-factor
# demande-par: ivguenyp123
# le: 2026-08-17
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.

id: bus-factor
kind: prompt
title: "bus factor "
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: "lire mon bus facror "
  not_for: "quand je ne veux pas travailler sur mon bus factor "
model_tier: mid
target_level: experimental
variables:
  - name: repartition_contributions
    source: signal
    required: true
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.is_valid_json
    op: eq
    value: true
  - target: output.json_keys
    op: contains
    value:
      - score
      - zones
spec: |-
    Reproduit le bus factor de la plateforme, avec la même pondération et les mêmes paliers de risque

    Matière fournie :
    - repartition_contributions : {{repartition_contributions}}

    Rends du JSON, et RIEN d'autre — pas de texte avant ni après.

    Les clés sont exactement celles-ci, sans en ajouter ni en retirer :
      - "score" — Bus factor global (personnes)
          seuils  : RISQUE CRITIQUE < 2 · RISQUE MOYEN < 3 · RISQUE FAIBLE au-delà
          calcul  : MÉDIANE PONDÉRÉE des facteurs de zone, jamais moyenne — chaque zone pesant son nombre de commits. On trie les zones par facteur croissant, on cumule les poids, et la valeur retenue est celle qui fait franchir la moitié du poids total. Le résultat est plafonné à 5 et arrondi à une décimale.
      - "zones" — Zones à risque (liste)
          forme   : une liste d'objets `{ "zone": "<chemin>", "facteur": <nombre>, "commits": <nombre>, "contributeurs": [ { "nom": "<nom>", "part": <pourcentage> } ] }`
          calcul  : Le facteur d'une zone est le nombre de personnes nécessaires pour couvrir 80 % de ses commits : on trie ses contributeurs du plus actif au moins actif, on cumule leurs parts arrondies, et on compte combien il en a fallu pour atteindre 80. Ne sont listées que les zones d'AU MOINS 5 COMMITS, triées de la plus fragile à la plus solide, les 10 premières, avec au plus 3 contributeurs chacune.

    Le niveau des champs qui en portent un est l'une de ces valeurs EXACTEMENT : "RISQUE CRITIQUE", "RISQUE MOYEN", "RISQUE FAIBLE".

    Fenêtre d'observation : les 200 commits les plus récents, et non une durée. La plateforme mesure qui sait quoi MAINTENANT ; l'historique complet dirait qui savait quoi autrefois. Aucun chiffre ne se calcule sur une autre période sans le dire.

    Périmètre : Une « zone » est un répertoire pris à DEUX niveaux de profondeur — `src/components`, `frontend/lib` — un fichier à la racine formant sa propre zone. Le découpage est arbitraire et le code le dit : sur un dépôt très plat ou très profond, il peut être inadapté.

    Ces règles PRIMENT sur le calcul. Applique-les après avoir calculé, avant de rendre la réponse :
      · Une zone de moins de 5 commits n'est pas une alerte — Elle est écartée de la liste. Un fichier touché une fois par une seule personne donnerait un facteur de 1 sans qu'aucune connaissance soit réellement en jeu.
      · Les compteurs portent sur TOUTES les zones, la liste non — « critiques » compte les zones de facteur 1, « à surveiller » celles de facteur 2, « saines » celles de facteur 3 ou plus — sur l'ensemble des zones, y compris celles trop petites pour être listées. Les deux ne portent donc pas sur le même ensemble, et c'est voulu.
      · Une part de 70 % ou plus signale une personne dominante — La plateforme la marque visuellement, et c'est le sens même du rapport : ce n'est pas le nombre de contributeurs qui compte, c'est la concentration.
      · Aucun commit — Le rapport ne rend pas un score de 0 : il dit que le projet semble vide. Zéro personne se lirait comme un bus factor catastrophique alors qu'il n'y a rien à mesurer.

    Chaque champ vaut un objet `{ "valeur": <nombre>, "niveau": "<niveau>" }`. Les champs dont la forme est précisée plus haut suivent la leur, pas celle-ci. Une zone sans contributeur exploitable est écartée plutôt que rendue à zéro, et un dépôt sans commit ne donne pas de score du tout — pas un score nul.
