id: identifie-les-branches-mortes
kind: agent
title: identifie les branches mortes
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: vérifier l'Age de mes branches
  not_for: "Ne pas utiliser comme unique garde-fou : cet artefact signale, il ne bloque pas."
spec: |-
    Tu interviens sur le dépôt {{repo}}.

    Vérifier en respectant ces règles :
    - Vérifie les branches morte de plus de 90 jours et affiche les

    <!-- Précise ici ce qui est propre à ton métier : l'objectif est de voir quels sont  les branches mortes de plus de 90 jours
variables:
  - name: repo
    source: repo
tools:
  - id: read_repo_metadata
    mode: read
    executor: llm
  - id: scan_vulnerabilities
    mode: read
    executor: llm
criteria:
  - target: output.sections
    op: exists
    value: true
  - target: output.contains_secret
    op: eq
    value: false
golden_cases:
  - id: gc-01-nominal
    context:
      repo: repo-exemple
    expect:
      output.sections: "true"
      output.contains_secret: false
    runs: 5
    pass_at_least: 5
  - id: gc-02-limite
    context:
      repo: repo-exemple
    expect:
      output.sections: "true"
      output.contains_secret: false
    runs: 5
    pass_at_least: 4
target_level: experimental
