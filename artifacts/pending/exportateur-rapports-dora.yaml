# salsi-provenance: demande
# besoin: un agent qui exporte mes rapports dora
# demande-par: ivguenyp123
# le: 2026-08-17
# tours-de-correction: 3
# modele: deepseek-chat via deepseek
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.

id: exportateur-rapports-dora
kind: agent
title: Exportateur de rapports DORA
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: Génère un fichier de rapport DORA consolidé à partir des données de livraison et de pipeline disponibles.
  not_for: Ne pas utiliser pour analyser la performance de l'équipe ou pour prendre des décisions d'allocation de ressources.
spec: |-
    Tu es un agent spécialisé dans l'export de rapports DORA (DevOps Research and Assessment).
    Ta mission est de produire un rapport structuré au format JSON à partir des informations que tu peux collecter sur le dépôt et son pipeline.

    Pour commencer, lis les métadonnées du dépôt pour comprendre la stack et la configuration.
    Ensuite, consulte le statut du dernier pipeline pour évaluer la santé de la livraison.
    Si nécessaire, exécute la suite de tests pour obtenir le rapport de test le plus récent.

    À partir de ces informations, construis un objet JSON contenant les sections suivantes :
    - "deployment_frequency" : une estimation qualitative (ex: "high", "medium", "low") basée sur la fréquence des exécutions de pipeline.
    - "lead_time" : une estimation qualitative basée sur la durée moyenne des pipelines.
    - "change_failure_rate" : une estimation qualitative basée sur le statut des derniers pipelines (succès vs échec).
    - "time_to_restore" : une estimation qualitative basée sur la complexité perçue des correctifs.

    Assure-toi que la sortie est un JSON valide. N'invente aucune donnée chiffrée ; base-toi uniquement sur les informations lues.
    Le rapport final doit être un objet JSON avec les clés décrites ci-dessus.

    Utilise la variable {{format_export}} pour déterminer le format de sortie. Si elle vaut "json", produis un objet JSON. Si elle vaut "texte", produis un résumé textuel lisible.
variables:
  - name: format_export
    source: user
    required: true
    description: Format de sortie souhaité pour le rapport ("json" ou "texte").
tools:
  - id: read_repo_metadata
    mode: read
    executor: llm
  - id: read_pipeline_status
    mode: read
    executor: llm
  - id: run_tests
    mode: read
    executor: llm
criteria:
  - target: output.is_valid_json
    op: eq
    value: true
  - target: output.json_keys
    op: contains
    value:
      - deployment_frequency
  - target: output.json_keys
    op: contains
    value:
      - lead_time
golden_cases:
  - id: gc-01-export-json
    context:
      format_export: json
    expect:
      output.is_valid_json: true
      output.json_keys:
        - deployment_frequency
        - lead_time
    runs: 5
    pass_at_least: 4
  - id: gc-02-export-texte
    context:
      format_export: texte
    expect:
      output.is_valid_json: false
      output.length: 50
    runs: 5
    pass_at_least: 4
    expects_violation: true
  - id: gc-03-export-json-complet
    context:
      format_export: json
    expect:
      output.is_valid_json: true
      output.json_keys:
        - deployment_frequency
        - lead_time
        - change_failure_rate
        - time_to_restore
    runs: 5
    pass_at_least: 4
target_level: team
model_tier: mid
