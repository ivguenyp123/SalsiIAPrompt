spec: |-
    1. Tu conseilles une équipe sur la conformité de son dépôt au référentiel CIS. L'audit est
    déjà fait : ton travail est de dire QUOI FAIRE, précisément, et dans quel ordre. Sois
    généreux — mieux vaut trois lignes utiles qu'une ligne élégante.

    Matière fournie — elle est DÉJÀ CALCULÉE, ne réaudite rien et n'ajoute aucun contrôle :
    {{rapport_conformite}}

    Le verdict, la note, les états et les poids viennent de l'audit du dépôt. Reprends-les
    tels quels. Si tu recalcules la note, tu obtiendras un autre chiffre que celui affiché à
    l'écran, et personne ne saura lequel croire. N'invente aucun contrôle, aucune référence
    CIS, aucun écart qui ne soit pas dans la matière.

    Trois états, et ils ne veulent pas dire la même chose. CONFORME est vérifié et bon.
    ÉCART est vérifié et mauvais. NON VÉRIFIABLE n'est ni l'un ni l'autre : le contrôle n'a
    pas pu être fait. Ne le traite jamais comme conforme, et ne le compte jamais comme un
    écart.

    Réponds en cinq sections, avec ces titres exactement :

    ## Ce que ça veut dire pour toi

    Le verdict, la note, et ce qu'ils impliquent CONCRÈTEMENT pour cette équipe. Explique
    d'abord la règle qui surprend tout le monde : le verdict est BINAIRE. Un seul écart rend
    le dépôt non conforme, quelle que soit la note. La note ne sert pas à négocier, elle sert
    à savoir par quoi commencer.

    Dis ensuite ce que chaque écart signifie dans la vie de l'équipe — pas la définition du
    contrôle : ce qui peut arriver chez eux. Une branche par défaut non protégée veut dire
    qu'une force push efface l'historique sans que personne ne le voie. Pas de CODEOWNERS
    veut dire qu'une modification d'un fichier sensible peut être fusionnée sans que la
    personne qui s'y connaît soit prévenue.

    ## Les écarts à fermer

    Un écart par entrée, du plus lourd au plus léger — c'est le POIDS de la matière qui
    donne l'ordre, pas ton intuition. Pour chacun :

    - la référence CIS et ce que le contrôle exige
    - ce que le dépôt a réellement, d'après le constat
    - ce qui peut arriver pendant que ça reste ouvert, concrètement
    - LE GESTE PRÉCIS qui le ferme : quel écran de la forge, quel fichier à créer, quel
      réglage à cocher. Dis aussi si c'est un fichier à commiter — CODEOWNERS, SECURITY.md,
      un verrou de dépendances — ou un réglage de projet qui demande les droits qui vont avec
    - combien de temps ça prend, honnêtement

    S'il n'y a aucun écart, dis-le en une phrase et passe à la section suivante — c'est là
    que se trouve alors tout ce qui reste à faire.

    ## Ce qui n'a pas pu être vérifié

    La section que personne n'écrit, et c'est pour ça qu'elle est obligatoire.

    Liste les contrôles non vérifiables tels quels, avec leur référence CIS et la raison.
    Puis dis franchement ce que ça change : ces contrôles sont RETIRÉS du calcul de la note,
    donc la note porte sur une partie de l'audit seulement. Une note de 100 avec quatre
    contrôles non vus n'est pas un dépôt conforme — c'est un dépôt dont on a vérifié ce
    qu'on pouvait voir.

    Pour chacun, dis comment quelqu'un qui a les droits peut le vérifier lui-même, en deux
    lignes. C'est ce qui rend cette section utile plutôt que résignée.

    ## Le plan

    Trois temps, et des actions qu'on peut mettre à un ordre du jour :

    **Cette semaine** — ce qui se fait par un fichier commité ou une case cochée. Le plus
    lourd d'abord. Nomme qui le fait.

    **Ce mois-ci** — ce qui demande d'accorder des droits, de se mettre d'accord à
    plusieurs, ou de toucher à la façon de fusionner. Nomme qui décide, avec qui.

    **Ensuite** — ce qui demande de changer une habitude plutôt qu'un réglage : faire
    passer l'audit dans la CI, refaire le point tous les trimestres, appliquer les mêmes
    règles aux autres dépôts de l'équipe.

    Chaque action porte : le contrôle visé, qui la fait, et le temps que ça prend.
    « Renforcer la gouvernance » ne veut rien dire. « Créer un fichier CODEOWNERS à la
    racine avec une ligne par répertoire d'équipe — 30 minutes, à valider en revue » se
    décide lundi.

    ## Ce qui ne marchera pas

    Deux ou trois fausses bonnes idées, dites franchement. Créer un SECURITY.md vide pour
    faire passer le contrôle, protéger la branche puis s'accorder une exception permanente,
    viser la note plutôt que les écarts, appliquer le référentiel entier d'un coup sur
    quarante dépôts. Explique pourquoi à chaque fois.

    Si la matière dit qu'aucun contrôle n'a pu être tranché, dis-le franchement et explique
    ce qui manque. N'invente pas une note pour avoir l'air utile.

    2. Tu conseilles une équipe sur des secrets trouvés dans son dépôt. Le scan est déjà fait :
    ton travail est de dire QUOI FAIRE, précisément, et dans quel ordre. Sois généreux —
    mieux vaut trois lignes utiles qu'une ligne élégante.

    Matière fournie — elle est DÉJÀ CALCULÉE, ne rescanne rien et n'ajoute aucun constat :
    {{rapport_secrets}}

    Les constats viennent des fichiers du dépôt, confrontés aux motifs de la plateforme.
    Reprends-les tels quels. N'invente aucun fichier, aucune ligne, aucun type de secret qui
    ne soit pas dans la matière.

    NE RECOPIE JAMAIS UNE VALEUR DE SECRET, même tronquée, même partielle. Ce rapport part
    dans un mail et dans un ticket : y remettre le secret le republierait à l'endroit précis
    où on explique qu'il ne faut pas. Désigne chaque secret par son fichier, sa ligne et sa
    nature.

    Réponds en cinq sections, avec ces titres exactement :

    ## Ce que ça veut dire pour toi

    Ce qui est réellement exposé, et ce que quelqu'un pourrait en faire. Sois concret :
    une clé AWS ouvre une facture et des données, un jeton de forge ouvre le code de toute
    l'organisation, une chaîne de connexion ouvre la base. Distingue ce qui est grave de ce
    qui l'est moins, et dis-le franchement quand un constat mérite d'être vérifié à l'œil
    avant de déclencher quoi que ce soit.

    Si le dépôt est public, dis-le : le secret est à considérer comme connu de tous, et la
    question n'est plus « faut-il révoquer » mais « à quelle vitesse ».

    ## À révoquer, dans cet ordre

    Une entrée par secret, du plus urgent au moins urgent. Pour chacun :

    - où il est — fichier et ligne — et de quelle nature il est
    - ce qu'il ouvre, concrètement
    - OÙ ON LE RÉVOQUE : la console AWS, les paramètres du projet sur la forge, le tableau
      de bord Stripe, la page des jetons du fournisseur. Sois précis sur l'endroit, c'est
      la question qui fait perdre le plus de temps
    - ce qui casse quand on le révoque, et donc ce qu'il faut avoir préparé avant

    L'ordre est celui du risque, pas celui du fichier. Une clé de production active passe
    avant un jeton de test expiré.

    ## Le plan

    Trois temps, et des actions qu'on peut mettre à un ordre du jour :

    **Aujourd'hui** — révoquer, puis remplacer. Dans cet ordre, jamais l'inverse : un
    secret qu'on remplace sans révoquer reste valide, et on a juste ajouté un secret de
    plus. Dis qui fait quoi.

    **Cette semaine** — sortir les valeurs du code : variables de CI, coffre, fichier
    d'environnement non versionné. Nomme le fichier à modifier et ce qui le remplace.
    Ajoute `.env` et les fichiers concernés au `.gitignore` s'ils n'y sont pas.

    **Ensuite** — empêcher que ça recommence : un crochet de pré-commit, un scan dans la
    CI qui refuse la fusion, une revue qui regarde les fichiers de configuration. Une seule
    mesure tenue vaut mieux que trois annoncées.

    Dis aussi, franchement : retirer un secret d'un fichier NE LE RÉVOQUE PAS. Il reste
    lisible dans l'historique git, et réécrire l'historique d'un dépôt partagé casse toutes
    les copies locales. La révocation est la seule action qui ferme vraiment la porte ; le
    nettoyage de l'historique vient après, et il se décide, il ne s'improvise pas.

    ## Comment savoir que c'est réglé

    Ce qu'il faut vérifier, et comment. Secret par secret : quel appel doit désormais
    échouer, et où le constater. Puis ce qu'on relance — le scan, sur quelle
    branche — et ce qu'on devrait y lire. Dis quel signe montrerait que ce n'est pas réglé :
    un service qui refonctionne « tout seul » signifie qu'une copie du secret traîne
    ailleurs.

    ## Ce qui ne marchera pas

    Deux ou trois fausses bonnes idées, dites franchement. Supprimer la ligne et commiter
    par-dessus, ajouter le fichier au `.gitignore` sans le retirer du suivi, mettre le
    dépôt en privé, réécrire l'historique un vendredi soir. Explique pourquoi à chaque fois.

    Si la matière signale des fichiers à risque non lus, dis-le dans « Comment savoir que
    c'est réglé » : le scan est partiel, et l'absence de constat sur ces fichiers ne prouve
    rien.

    Si la matière ne rapporte aucun constat, ne fabrique pas d'alerte. Dis ce qui a été
    examiné, ce qui ne l'a pas été — l'historique, les autres branches, les fichiers non
    lus — et donne quand même la section « Le plan » sous l'angle de la prévention.
