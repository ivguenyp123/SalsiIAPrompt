# Capacité de l'inventaire du hub — module « Générateur de rapport × Générateur de rapport ».
# besoin : « un agent qui fusionne deux rapports de dépôt en une seule synthèse, sans répéter deux fois la même chose »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# LE PIÈGE DU GENRE : la concaténation. Deux rapports collés bout à bout avec un
# titre au-dessus, où le lecteur doit faire lui-même le travail de rapprochement.
#
# Fusionner, c'est décider ce qui est COMMUN — et donc systémique, donc
# prioritaire — et ce qui est PROPRE à l'un. Un défaut présent dans les deux dépôts
# n'est pas deux défauts : c'est une pratique d'équipe, et ça ne se corrige pas au
# même endroit.
id: fusionner-deux-rapports-de-depot
kind: prompt
title: 'Deux rapports en une synthèse — sans redire deux fois la même chose'
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [depot, communication]
intent:
  purpose: >-
    Fusionner deux rapports de dépôt en une synthèse : ce qui est commun aux deux — donc systémique — et ce qui est propre à chacun, sans jamais répéter ni recomposer de total.
  not_for: >-
    Ce n'est pas une concaténation de deux rapports, et ce n'est pas une comparaison — pour « qu'est-ce qui les différencie », c'est `extraire-ce-qui-differe-entre-deux-rapports`. Et ça ne recompose aucun chiffre global.
model_tier: mid
target_level: experimental
variables:
  - name: rapport_depot
    source: signal
    required: true
    description: >-
      L'état du dépôt et ses corrections à faire, calculés par la plateforme.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - 'Ce qui est commun aux deux'
      - 'Ce qui est propre à chacun'
      - 'Par où commencer'
      - 'Ce qui n''est pas comparable'
spec: |-
  Tu fusionnes deux rapports de dépôt en une seule synthèse.
  
  {{rapport_depot}}
  
  Rends exactement ces sections, avec ces titres :
  
  ## Ce qui est commun aux deux
  ## Ce qui est propre à chacun
  ## Par où commencer
  ## Ce qui n'est pas comparable
  
  ── PLUSIEURS RAPPORTS, ET ILS NE SE COMPARENT PAS TOUJOURS ───────────────
  
  Deux rapports peuvent porter sur des périmètres différents, avoir été calculés à
  des dates différentes, ou ne pas avoir passé les mêmes contrôles. Un chiffre
  comparé à un autre qui ne mesure pas la même chose produit un écart inventé.
  
  Vérifie donc d'abord ce qui est comparable, dis ce qui ne l'est pas, et ne
  recompose JAMAIS un total à partir de plusieurs rapports — additionner des taux
  n'a aucun sens, et un total recomposé sera cité comme s'il avait été mesuré.
  
  ── LA RÈGLE ──────────────────────────────────────────────────────────────
  
  NE CONCATÈNE PAS. Deux rapports collés bout à bout laissent tout le travail au lecteur.
  Fusionner, c'est trancher entre le COMMUN et le PROPRE, et cette distinction est toute la
  valeur du document.
  
  Si la matière ne contient qu'UN rapport, dis-le et arrête-toi : une fusion à un terme n'a
  pas de sens.
  
  ── CE QU'ON ATTEND ───────────────────────────────────────────────────────
  
  CE QUI EST COMMUN AUX DEUX
  En premier, parce que c'est le plus important. Un même défaut dans deux dépôts n'est pas
  deux défauts : c'est une PRATIQUE — une habitude d'équipe, un modèle de projet, un
  outillage manquant. Et ça ne se corrige pas dans les dépôts, ça se corrige à la source.
  
  Dis pour chaque point commun ce que ça suggère sur l'origine, et où agir.
  
  CE QUI EST PROPRE À CHACUN
  Ce qui n'apparaît que d'un côté, groupé par dépôt. Court. Et interroge l'écart : pourquoi
  l'un et pas l'autre ? Un dépôt plus ancien, une équipe différente, un usage différent. La
  réponse est souvent plus instructive que le constat.
  
  PAR OÙ COMMENCER
  UNE action, et elle sort presque toujours de la première section : ce qui règle un point
  commun aux deux règle deux problèmes d'un coup, et souvent les suivants. Dis ce que ça
  supprime.
  
  CE QUI N'EST PAS COMPARABLE
  Obligatoire : les périmètres différents, les dates de calcul différentes, les contrôles qui
  ne se sont pas appliqués des deux côtés, et ce que chaque rapport annonce comme non mesuré.
  « N/A n'est pas zéro », et un contrôle non applicable d'un côté ne fait pas de l'autre un
  mauvais élève.
