# salsi-provenance: demande
# besoin: un agent pour exporter mon rapport dora
# demande-par: ivguenyp123
# le: 2026-08-16
# tours-de-correction: 2
# modele: deepseek-chat via deepseek
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.

id: export-rapport-dora
kind: agent
title: Export du rapport DORA
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: Générer un rapport DORA (mesures de livraison logicielle) à partir des données du dépôt et le formater pour export.
  not_for: Ne pas utiliser pour analyser la sécurité du code, exécuter des tests ou modifier le dépôt.
spec: |-
    Tu es un agent chargé de préparer l'export du rapport DORA pour le dépôt courant, en analysant la branche {{branche_cible}}.
    Rassemble les informations nécessaires à partir des outils disponibles.
    Commence par lire les métadonnées du dépôt pour identifier la branche par défaut et la stack technique.
    Vérifie ensuite le statut du dernier pipeline sur la branche {{branche_cible}}.
    Exécute la suite de tests pour obtenir le rapport de réussite.
    Déclenche un scan des vulnérabilités des dépendances et lis le résultat.
    À partir de ces données, produis un rapport structuré en JSON valide.
    Le rapport doit contenir les sections suivantes : `deployment_frequency`, `lead_time`, `change_failure_rate`, `time_to_restore`.
    Pour chaque section, indique une valeur qualitative (élevée, moyenne, faible) basée sur les informations collectées.
    Termine en affichant le rapport JSON complet, sans texte additionnel.
variables:
  - name: branche_cible
    source: user
    required: true
    description: Nom de la branche à analyser pour le rapport DORA.
tools:
  - id: read_repo_metadata
    mode: read
    executor: llm
  - id: read_pipeline_status
    mode: read
    executor: llm
  - id: run_tests
    mode: read
    executor: llm
  - id: scan_vulnerabilities
    mode: read
    executor: llm
criteria:
  - target: output.is_valid_json
    op: eq
    value: true
  - target: output.json_keys
    op: contains
    value:
      - deployment_frequency
  - target: output.json_keys
    op: contains
    value:
      - lead_time
  - target: output.json_keys
    op: contains
    value:
      - change_failure_rate
  - target: output.json_keys
    op: contains
    value:
      - time_to_restore
golden_cases:
  - id: gc-01-rapport-complet
    context:
      branche_cible: main
    expect:
      output.is_valid_json: true
      output.sections:
        - deployment_frequency
        - lead_time
        - change_failure_rate
        - time_to_restore
    runs: 5
    pass_at_least: 4
  - id: gc-02-rapport-succes
    context:
      branche_cible: develop
    expect:
      output.is_valid_json: true
    runs: 5
    pass_at_least: 4
  - id: gc-03-rapport-echec
    context:
      branche_cible: feature/test
    expect:
      output.is_valid_json: true
    runs: 5
    pass_at_least: 4
target_level: team
model_tier: mid
