# Le voisin d'« Explique-moi ce code », et la distinction n'est pas cosmétique : celui-ci
# JUGE — complexité, risques, dette. L015 signalerait un doublon si les deux disaient la
# même chose ; ils ne la disent pas, et leur `not_for` le dit explicitement.

id: analyser-un-code
kind: prompt
title: Analyser ce code
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [qualite, dette]
moment: revue

intent:
  purpose: >
    Évaluer un fichier : ce qui le rend difficile à changer, ce qui risque de casser,
    et le seul endroit par où commencer si on ne fait qu'une chose.
  not_for: >
    Ne pas utiliser pour comprendre ce que fait un fichier — c'est « Explique-moi ce
    code ». Ici on juge, on n'explique pas.

spec: |
  Tu analyses ce fichier du dépôt {{repo}}.

  Structure ta réponse ainsi, avec ces titres exactement :
  ## Ce qui rend ce fichier difficile
  ## Ce qui risque de casser
  ## Par où commencer

  Règles :
  - « Par où commencer » ne contient qu'UNE proposition, la plus rentable
  - chaque constat cite l'endroit concerné, jamais une généralité de méthode
  - ne signale aucun point que l'outillage rattrape déjà — indentation, nommage
    de variable locale, import inutilisé
  - si le fichier est court et clair, dis-le et arrête-toi
  - si le fichier n'est pas du code, dis-le et arrête-toi

  Fichier :
  {{code}}

variables:
  - name: repo
    source: repo
    required: true
    description: Dépôt concerné.
  - name: code
    source: signal
    required: true
    description: Contenu du fichier analysé.

tools:
  - id: read_repo_metadata
    mode: read
    executor: llm

criteria:
  - target: output.sections
    op: exists
    value: true
  - target: output.length
    op: lte
    value: 2500
  - target: output.contains_secret
    op: eq
    value: false

golden_cases:
  - id: gc-01-regles-denses
    context: { repo: demo-front, code_fixture: regles-metier }
    expect: { output.sections: true, output.length: 2000 }
    runs: 5
    pass_at_least: 5

  - id: gc-02-fichier-fleuve
    context: { repo: demo-front, code_fixture: fichier-fleuve }
    expect: { output.sections: true, output.length: 2500 }
    runs: 5
    pass_at_least: 4

  - id: gc-03-court-et-clair
    context: { repo: demo-front, code_fixture: petit-module }
    expect: { output.length: 900 }
    runs: 5
    pass_at_least: 4

  - id: gc-04-pas-du-code
    context: { repo: demo-front, code_fixture: pas-du-code }
    expect: { output.length: 600 }
    runs: 3
    pass_at_least: 3

  - id: gc-05-vide
    context: { repo: demo-front, code_fixture: vide }
    expect: { output.length: 300 }
    runs: 3
    pass_at_least: 3

target_level: officiel
model_tier: mid
classification:
  max_repo_sensitivity: interne
