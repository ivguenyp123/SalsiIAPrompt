# salsi-provenance: composition
# besoin: assemblage de 1 prompt(s) : reproduire-le-calcul-du-bus-factor
# demande-par: ivguenyp123
# le: 2026-08-17
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# ── CONSIGNE RÉÉCRITE : IL EXPLIQUE, IL NE CALCULE PLUS ──────────────────────
#
# La première version demandait au modèle de REPRODUIRE le calcul du bus factor et d'en
# rendre du JSON. Deux erreurs, et elles viennent de la conception, pas de l'auteur :
#
#   · un modèle sans données invente des données. On lui a vu écrire « élevée » là où la
#     plateforme calcule un chiffre — et la porte avait dit « contrat satisfait ».
#   · personne ne veut du JSON. La demande était : « c'est quoi mon score, où sont mes
#     problèmes, comment je l'améliore. »
#
# Le score, les zones et les parts sont désormais CALCULÉS par `lib/signaux-matiere.js`,
# en code déterministe, et arrivent tout faits dans la matière. Il ne reste au modèle que
# ce qu'il fait bien : lire des chiffres et dire quoi en faire.

id: bus-factor
kind: prompt
title: "bus factor "
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: "lire mon bus facror "
  not_for: "quand je ne veux pas travailler sur mon bus factor "
model_tier: mid
target_level: experimental
variables:
  - name: repartition_contributions
    source: signal
    required: true
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  # Les trois sections attendues. Vérifiables parce que la consigne les impose au mot
  # près — et c'est tout ce qu'un critère peut vérifier : la forme, jamais la justesse
  # du conseil.
  - target: output.sections
    op: contains
    value:
      - Ton bus factor
      - Où ça coince
      - Quoi faire
spec: |-
    Tu expliques un rapport de bus factor à quelqu'un qui découvre la notion, et tu lui
    dis quoi faire. Tu parles de SON dépôt, pas de la notion en général.

    Matière fournie — elle est DÉJÀ CALCULÉE, ne recalcule rien :
    {{repartition_contributions}}

    Le score, les facteurs de zone et les parts de chacun ont été calculés à partir des
    commits du dépôt. Reprends-les tels quels. Si tu refais une division, tu obtiendras
    un autre chiffre que celui affiché à l'écran, et personne ne saura lequel croire.

    Réponds en trois sections, avec ces titres exactement :

    ## Ton bus factor

    Le score, son niveau de risque, et ce que ça veut dire en une phrase que quelqu'un
    qui n'a jamais entendu le terme comprend. Un bus factor de 2 signifie que si deux
    personnes précises s'en vont, l'équipe perd la main sur une partie du code.

    ## Où ça coince

    Les zones les plus fragiles, NOMMÉES, avec qui les tient et à quel pourcentage.
    Commence par la plus fragile. Si une personne dépasse 70 % sur une zone, dis-le : ce
    n'est pas le nombre de contributeurs qui compte, c'est la concentration.

    Si la matière signale des répertoires non interrogés, mentionne-le : une zone fragile
    peut s'y cacher.

    ## Quoi faire

    Deux ou trois actions concrètes, dans l'ordre où les faire, chacune rattachée à une
    zone précise. « Faire du pair programming » ne veut rien dire ; « faire relire les
    prochaines PR sur `lib/` par quelqu'un d'autre que Daniel » se fait lundi.

    Ne propose rien qui demande de recruter. Reste sur ce que l'équipe peut décider
    elle-même.

    Ce que tu ne fais pas : tu ne recalcules aucun chiffre, tu n'inventes aucun nom de
    fichier ou de personne qui ne soit pas dans la matière, et tu ne juges personne. Le
    bus factor décrit une répartition de connaissance, pas la valeur de quelqu'un.

    Si la matière dit qu'aucun score n'est calculable, dis-le franchement et explique ce
    qui manque. N'invente pas un chiffre pour avoir l'air utile.
