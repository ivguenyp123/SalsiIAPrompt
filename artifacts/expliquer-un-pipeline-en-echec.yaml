# Le premier artefact dont les cas d'or se jouent sur de la matière récoltée.
#
# Il déclarait `repo` et `stack` — deux chaînes — et prétendait lire un journal qu'on ne
# lui donnait jamais. Ses cas d'or n'auraient eu rien à jouer. La variable `pipeline_log`
# de source `signal` répare ça, et la banque fournit trois journaux réels : une panne
# d'infrastructure, un échec noyé dans 55 lignes de bruit, et un pipeline qui a réussi —
# celui-là pour vérifier que l'agent sait ne rien dire.

id: expliquer-un-pipeline-en-echec
kind: agent
title: Expliquer un pipeline en échec
owner:
  person: ivguenyp123
  scope: Data
intent:
  purpose: Traduire l'échec d'un pipeline en cause probable et en première action, pour quelqu'un qui n'a pas écrit le job.
  not_for: Ne pas utiliser sur un pipeline encore en cours, ni pour diagnostiquer une panne de l'infrastructure GitLab elle-même.
spec: |-
    Tu expliques pourquoi le dernier pipeline du dépôt {{repo}} a échoué.

    Pour la stack {{stack}} :
    - identifie le job en échec et la ligne de journal qui porte la cause
    - traduis l'erreur en une phrase compréhensible sans connaître le job
    - distingue une rupture réelle d'une instabilité de test
    - distingue une panne d'infrastructure d'une régression du code
    - si le pipeline n'a pas échoué, dis-le et n'explique rien
    - termine par une première action, et une seule

    Tu ne modifies rien : tu expliques.

    Journal du pipeline :
    {{pipeline_log}}
variables:
  - name: repo
    source: repo
  - name: stack
    source: repo
  - name: pipeline_log
    source: signal
    required: true
    description: Journal brut du job en échec, capturé sur le poste ou lu à la forge.
tools:
  - id: read_pipeline_status
    mode: read
    executor: llm
  - id: read_repo_metadata
    mode: read
    executor: llm
criteria:
  - target: output.length
    op: lte
    value: 1500
  - target: output.contains_secret
    op: eq
    value: false

golden_cases:
  - id: gc-01-panne-infra
    context: { repo: demo-spring, stack: java, pipeline_log_fixture: echec-infra }
    expect: { output.length: 900, output.contains_secret: false }
    runs: 5
    pass_at_least: 5

  - id: gc-02-noye-dans-le-bruit
    context: { repo: demo-spring, stack: java, pipeline_log_fixture: echec-noye-dans-le-bruit }
    expect: { output.length: 1200 }
    runs: 5
    pass_at_least: 4

  # Le pipeline a réussi : il n'y a rien à expliquer. On vérifie que la réponse reste
  # courte — un agent qui invente une cause écrit long.
  - id: gc-03-rien-a-expliquer
    context: { repo: demo-spring, stack: java, pipeline_log_fixture: succes }
    expect: { output.length: 300 }
    runs: 3
    pass_at_least: 3

target_level: team
