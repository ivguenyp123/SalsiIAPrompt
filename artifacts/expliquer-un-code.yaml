# Le plus demandé du catalogue, et le plus facile à rater : une explication qui paraphrase
# le code n'apprend rien à personne. Le spec interdit donc explicitement la paraphrase et
# demande l'INTENTION — ce que le code cherche à obtenir, pas ce qu'il fait ligne à ligne.

id: expliquer-un-code
kind: prompt
title: Explique-moi ce code
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [comprehension, onboarding]
moment: revue

intent:
  purpose: >
    Expliquer un fichier de code à quelqu'un qui ne l'a pas écrit : ce qu'il cherche à
    obtenir, comment il s'y prend, et où sont les pièges.
  not_for: >
    Ne pas utiliser pour juger la qualité du code ni proposer une correction — c'est le
    rôle de « Relire un changement ». Ici on explique, on ne critique pas.

spec: |
  Tu expliques ce fichier du dépôt {{repo}} à quelqu'un qui ne l'a pas écrit.

  Structure ta réponse ainsi, avec ces titres exactement :
  ## À quoi ça sert
  ## Comment ça marche
  ## Ce qui surprend

  Règles :
  - explique l'INTENTION, pas la syntaxe. Ne paraphrase jamais une ligne.
  - « À quoi ça sert » tient en trois phrases maximum
  - « Ce qui surprend » ne contient que ce qui n'est pas devinable à la lecture
  - si le fichier n'est pas du code — configuration, feuille de style, données —
    dis-le en une phrase et arrête-toi là
  - si le fichier est vide, dis qu'il est vide et arrête-toi

  Fichier :
  {{code}}

variables:
  - name: repo
    source: repo
    required: true
    description: Dépôt d'où vient le fichier, pour situer le vocabulaire métier.
  - name: code
    source: signal
    required: true
    description: Contenu brut du fichier ouvert dans l'éditeur.

tools:
  - id: read_repo_metadata
    mode: read
    executor: llm

criteria:
  - target: output.sections
    op: exists
    value: true
  - target: output.length
    op: lte
    value: 4000
  - target: output.contains_secret
    op: eq
    value: false

golden_cases:
  - id: gc-01-module-court
    context: { repo: demo-front, code_fixture: petit-module }
    expect: { output.sections: true, output.length: 1500 }
    runs: 5
    pass_at_least: 5

  - id: gc-02-regles-denses
    context: { repo: demo-front, code_fixture: regles-metier }
    expect: { output.sections: true, output.length: 3000 }
    runs: 5
    pass_at_least: 4

  - id: gc-03-fichier-fleuve
    context: { repo: demo-front, code_fixture: fichier-fleuve }
    expect: { output.length: 4000 }
    runs: 5
    pass_at_least: 4

  # Une feuille de style n'a pas d'intention à expliquer : la réponse doit être courte.
  - id: gc-04-pas-du-code
    context: { repo: demo-front, code_fixture: pas-du-code }
    expect: { output.length: 600 }
    runs: 3
    pass_at_least: 3

  - id: gc-05-vide
    context: { repo: demo-front, code_fixture: vide }
    expect: { output.length: 300 }
    runs: 3
    pass_at_least: 3

target_level: officiel
model_tier: small
classification:
  max_repo_sensitivity: interne
