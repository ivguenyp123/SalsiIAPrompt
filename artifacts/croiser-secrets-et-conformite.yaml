# Capacité de l'inventaire du hub — module « Security Scanner × Secrets Scanner ».
# besoin : « un agent qui croise le scan de secrets et l'audit CIS pour classer les risques par urgence réelle »
# demandé par ivguenyp123, le 2026-08-20.
#
# Le linter l'a laissé passer : sa FORME est vérifiée. Aucun cas d'or n'a été joué —
# ce qu'il fait vraiment reste à mesurer au banc d'essai.
#
# POURQUOI CE CROISEMENT : un secret exposé et un écart de conformité n'ont pas le
# même statut, et lus séparément on les traite dans le désordre. Un secret est un
# fait accompli — il est compromis, la révocation est immédiate. Un écart de
# conformité est une porte ouverte — il n'a peut-être jamais servi.
#
# Ce que le croisement révèle et qu'aucun des deux rapports ne montre seul : un
# écart de conformité qui rend un secret exposé BEAUCOUP plus dangereux. Une clé
# dans un dépôt à qui tout le monde a accès, sans protection de branche et sans
# trace des accès, n'est pas le même incident que la même clé dans un dépôt
# restreint.
id: croiser-secrets-et-conformite
kind: prompt
title: 'Secrets et conformité croisés — l''urgence réelle'
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [securite, conformite]
intent:
  purpose: >-
    Croiser le scan de secrets et l'audit de conformité pour classer les risques par urgence réelle — en montrant où un écart de conformité aggrave une exposition.
  not_for: >-
    Ce n'est pas une procédure de révocation (`rediger-la-procedure-de-revocation`) ni une priorisation de conformité seule (`prioriser-les-ecarts-de-conformite`). Le croisement sert à ordonner, pas à traiter.
model_tier: mid
target_level: experimental
variables:
  - name: rapport_secrets
    source: signal
    required: true
    description: >-
      Les motifs de secret trouvés dans le dépôt, avec leur fichier et leur ligne — valeurs caviardées.
  - name: rapport_conformite
    source: signal
    required: true
    description: >-
      La conformité du dépôt au référentiel CIS : les contrôles passés, échoués, non applicables.
criteria:
  - target: output.contains_secret
    op: eq
    value: false
  - target: output.sections
    op: contains
    value:
      - 'À faire dans l''heure'
      - 'Ce qui aggrave l''exposition'
      - 'À traiter ensuite'
      - 'Ce que le croisement ne dit pas'
spec: |-
  Tu croises un scan de secrets et un audit de conformité pour classer les risques.
  
  Les secrets :
  {{rapport_secrets}}
  
  La conformité :
  {{rapport_conformite}}
  
  Rends exactement ces sections, avec ces titres :
  
  ## À faire dans l'heure
  ## Ce qui aggrave l'exposition
  ## À traiter ensuite
  ## Ce que le croisement ne dit pas
  
  ── LES VALEURS NE SE RECOPIENT JAMAIS ────────────────────────────────────
  
  Les secrets de la matière sont caviardés. Ne recopie AUCUNE valeur, même tronquée. Nomme le
  fichier, la ligne et le TYPE — jamais la valeur. Ce texte partira dans un ticket.
  
  ── L'ORDRE, ET IL EST LE CONTENU ─────────────────────────────────────────
  
  UN SECRET EXPOSÉ PASSE AVANT TOUT ÉCART DE CONFORMITÉ. Un secret committé est un fait
  accompli : il est compromis, et la révocation est immédiate. Un écart de conformité est une
  porte ouverte qui n'a peut-être jamais servi.
  
  Aucune exception à cet ordre, même quand l'écart de conformité est classé critique.
  
  ── CE QU'ON ATTEND ───────────────────────────────────────────────────────
  
  À FAIRE DANS L'HEURE
  Les secrets à révoquer, par type et par ce qu'ils ouvrent. Chacun avec où révoquer. Rappelle
  que le retrait du code ne révoque rien.
  
  Si aucun secret n'a été trouvé, écris « rien à révoquer dans ce qui a été scanné » — et pas
  « aucun secret », parce que le scan ne cherche que des motifs connus.
  
  CE QUI AGGRAVE L'EXPOSITION
  Le cœur du croisement, et ce qu'aucun rapport ne montre seul. Les écarts de conformité qui
  rendent les secrets trouvés PLUS dangereux, ou qui rendront la prochaine fuite plus
  probable :
  - un dépôt largement accessible : la clé a été vue par beaucoup plus de monde ;
  - pas de protection de branche : rien n'a empêché la valeur d'arriver, et rien ne
    l'empêchera la prochaine fois ;
  - pas de contrôle de secrets dans la chaîne : la détection s'est faite après coup ;
  - pas de trace des accès : impossible de savoir qui a lu ;
  - des jetons sans expiration : une clé compromise le reste indéfiniment.
  
  Chaque ligne dit ce que l'écart change à la gravité du secret. C'est ce qui transforme deux
  listes en une décision.
  
  À TRAITER ENSUITE
  Les écarts de conformité qui restent, dans l'ordre de ce qu'ils ouvrent. Court : la
  priorisation détaillée est le métier d'un autre agent.
  
  CE QUE LE CROISEMENT NE DIT PAS
  Trois à cinq lignes : les deux scans sont des planchers — ce qui n'a pas été cherché n'a pas
  été trouvé ; « N/A n'est pas zéro » ; aucun des deux ne dit si un secret a été UTILISÉ, ce
  qui demande les journaux du fournisseur ; et l'historique n'a pas été fouillé.
