# Le seul agent du catalogue qui rend un PLAN plutôt qu'un résultat. C'est délibéré : une
# migration se décide avant de se faire, et un agent qui migrerait tout seul produirait un
# diff que personne ne saurait relire.

id: preparer-une-migration-java-21
kind: agent
title: Préparer une migration Java 21
owner:
  person: ivguenyp123
  scope: Plateforme
tags: [migration, java]
moment: cadrage

intent:
  purpose: >
    Établir le plan de montée d'un service vers Java 21 : ce qui bloque, dans quel
    ordre, et ce qui peut se faire sans interruption.
  not_for: >
    Ne pas utiliser pour appliquer la migration : cet agent produit un plan à relire,
    pas un changement. Le code se migre ensuite, étape par étape.

spec: |
  Tu prépares la montée du dépôt {{repo}} vers Java 21, depuis la version {{version_source}}.

  Structure ta réponse ainsi, avec ces titres exactement :
  ## Ce qui bloque
  ## L'ordre
  ## Ce qui peut attendre

  Règles :
  - « Ce qui bloque » ne liste que ce qui empêche de compiler ou de démarrer
  - « L'ordre » est une suite d'étapes, chacune livrable et réversible seule
  - chaque étape dit ce qui prouve qu'elle est réussie
  - ne propose aucune réécriture de code applicatif : la migration porte sur la
    plateforme, pas sur le métier
  - si la version source est déjà 21 ou plus, dis-le et arrête-toi

  Dépendances et configuration :
  {{inventaire}}

variables:
  - name: repo
    source: repo
    required: true
    description: Dépôt à migrer.
  - name: version_source
    source: repo
    required: true
    description: Version de Java actuellement utilisée.
  - name: inventaire
    source: user
    required: true
    description: Extrait du pom ou du build, et configuration du runtime.

tools:
  - id: read_repo_metadata
    mode: read
    executor: llm
  - id: run_tests
    mode: read
    executor: llm

criteria:
  - target: output.sections
    op: exists
    value: true
  - target: output.length
    op: lte
    value: 3500
  - target: output.contains_secret
    op: eq
    value: false

golden_cases:
  - id: gc-01-depuis-java-8
    context: { repo: demo-spring, version_source: "8", inventaire: "spring-boot 2.3, javax.* partout, plugin maven-compiler 3.8, jdk 8" }
    expect: { output.sections: true, output.length: 3000 }
    runs: 5
    pass_at_least: 5

  - id: gc-02-depuis-java-17
    context: { repo: demo-spring, version_source: "17", inventaire: "spring-boot 3.1, jakarta.*, jdk 17" }
    expect: { output.sections: true, output.length: 2000 }
    runs: 5
    pass_at_least: 4

  - id: gc-03-deja-migre
    context: { repo: demo-spring, version_source: "21", inventaire: "spring-boot 3.3, jdk 21" }
    expect: { output.length: 600 }
    runs: 3
    pass_at_least: 3

  - id: gc-04-inventaire-vide
    context: { repo: demo-spring, version_source: "8", inventaire: " " }
    expect: { output.length: 400 }
    runs: 3
    pass_at_least: 3

target_level: team
model_tier: large
classification:
  max_repo_sensitivity: interne
