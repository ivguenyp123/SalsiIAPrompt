  # ══════════════════════════════════════════════════════════════════════════
  #
  # Cette famille-ci n'est pas un module du hub : c'est ce qui se passe ENTRE les
  # modules. Toutes les capacités ci-dessus lisent UNE source et rendent UNE sortie.
  # Celles-ci en croisent plusieurs — deux rapports, la rétro et les chiffres, le scan
  # de secrets et l'audit de conformité. C'est là que la valeur cesse d'être la somme
  # des outils pour devenir ce qu'aucun d'eux ne dit tout seul.
  #
  # Le nom de module dit ce qui est croisé, avec un `×` : la traçabilité vers le hub
  # reste vraie, elle porte simplement sur deux surfaces au lieu d'une.
  #
  - cle: croiser
    titre: "Croiser & Composer"
    icone: 🧩
    modules:

      - module: Générateur de rapport × Générateur de rapport
        prompts:
          - id: fusionner-deux-rapports-de-depot
            titre: Fusionner deux rapports de dépôt
            besoin: "un agent qui fusionne deux rapports de dépôt en une seule synthèse, sans répéter deux fois la même chose"
            entrees: [rapport_depot]
            sortie: texte
          - id: extraire-ce-qui-differe-entre-deux-rapports
            titre: Extraire ce qui diffère entre deux rapports
            besoin: "un agent qui dit ce qui différencie deux rapports de dépôt et laisse tomber ce qu'ils ont en commun"
            entrees: [rapport_depot]
            sortie: liste
          - id: consolider-les-rapports-d-une-tribu
            titre: Consolider les rapports d'une tribu
            besoin: "un agent qui consolide les rapports de plusieurs squads en un rapport de tribu, avec un verdict par squad"
            entrees: [rapport_depot]
            sortie: texte
          - id: resumer-trois-rapports-en-une-page
            titre: Résumer trois rapports en une page
            besoin: "un agent qui résume trois rapports de dépôt en une page, avec ce qui demande une décision"
            entrees: [rapport_depot]
            sortie: texte

      - module: DORA Insights × DevOps Assessment
        prompts:
          - id: croiser-dora-et-maturite
            titre: Croiser DORA et maturité
            besoin: "un agent qui croise les chiffres DORA et le score de maturité pour dire où agir en premier"
            entrees: [chiffres_dora, scores_maturite]
            sortie: texte
          - id: expliquer-un-ecart-entre-mesure-et-declaratif
            titre: Expliquer un écart entre mesure et déclaratif
            besoin: "un agent qui explique pourquoi une équipe a un bon score de maturité déclaré et de mauvais chiffres mesurés"
            entrees: [chiffres_dora, scores_maturite]
            sortie: texte

      - module: Security Scanner × Secrets Scanner
        prompts:
          - id: croiser-secrets-et-conformite
            titre: Croiser secrets et conformité
            besoin: "un agent qui croise le scan de secrets et l'audit CIS pour classer les risques par urgence réelle"
            entrees: [rapport_secrets, rapport_conformite]
            sortie: liste
          - id: croiser-vulnerabilites-et-dependances
            titre: Croiser vulnérabilités et dépendances
            besoin: "un agent qui croise les vulnérabilités signalées et les dépendances réellement utilisées pour dire lesquelles sont atteignables"
            entrees: [rapport_vulnerabilites, inventaire_dependances]
            sortie: liste

      - module: Auto Retro × DORA Insights
        prompts:
          - id: confronter-la-retro-aux-chiffres
            titre: Confronter la rétro aux chiffres
            besoin: "un agent qui confronte ce que l'équipe a ressenti en rétro aux chiffres mesurés du sprint"
            entrees: [activite_sprint, chiffres_dora]
            sortie: texte
          - id: relier-un-incident-aux-changements-livres
            titre: Relier un incident aux changements livrés
            besoin: "un agent qui relie un incident aux changements livrés juste avant, sans conclure trop vite"
            entrees: [notes_incident, historique_commits]
            sortie: texte

      - module: Comparaisons
        prompts:
          - id: comparer-deux-depots
            titre: Comparer deux dépôts
            besoin: "un agent qui compare deux dépôts et dit ce que l'un fait mieux que l'autre, et ce qui est transposable"
            entrees: [rapport_depot]
            sortie: texte
          - id: comparer-un-depot-a-lui-meme-dans-le-temps
            titre: Comparer un dépôt à lui-même dans le temps
            besoin: "un agent qui compare l'état d'un dépôt à celui d'il y a trois mois et dit ce qui a vraiment bougé"
            entrees: [rapport_depot]
            sortie: texte
          - id: comparer-deux-configurations-de-ci
            titre: Comparer deux configurations de CI
            besoin: "un agent qui compare deux .gitlab-ci.yml et dit ce que l'un fait que l'autre ne fait pas"
            entrees: [config_ci]
            sortie: liste
          - id: comparer-une-estimation-a-la-charge-reelle
            titre: Comparer une estimation à la charge réelle
            besoin: "un agent qui compare une estimation à la charge réellement passée et dit d'où vient l'écart"
            entrees: [besoin_metier, activite_sprint]
            sortie: texte

      - module: Restitutions
        prompts:
          - id: reecrire-pour-un-comite
            titre: Réécrire pour un comité
            besoin: "un agent qui réécrit une synthèse technique pour un comité de direction, sans jargon et sans perdre le fond"
            entrees: [rapport_depot]
            sortie: texte
          - id: reecrire-pour-quelqu-un-qui-arrive
            titre: Réécrire pour quelqu'un qui arrive
            besoin: "un agent qui réécrit une synthèse pour quelqu'un qui vient d'arriver sur le projet"
            entrees: [rapport_depot]
            sortie: texte
          - id: transformer-un-rapport-en-message-teams
            titre: Transformer un rapport en message Teams
            besoin: "un agent qui transforme un rapport en message Teams court, avec les trois points qui comptent"
            entrees: [rapport_depot]
            sortie: texte
          - id: transformer-un-rapport-en-tickets
            titre: Transformer un rapport en tickets
            besoin: "un agent qui transforme les actions d'un rapport en tickets prêts à créer, un par action"
            entrees: [rapport_depot]
            sortie: liste
          - id: transformer-un-rapport-en-plan-de-presentation
            titre: Transformer un rapport en plan de présentation
            besoin: "un agent qui transforme un rapport en plan de présentation, une idée par diapositive"
            entrees: [rapport_depot]
            sortie: liste

      - module: Cohérence
        prompts:
          - id: verifier-que-la-doc-dit-ce-que-le-code-fait
            titre: Vérifier que la doc dit ce que le code fait
            besoin: "un agent qui vérifie qu'un README décrit encore ce que le code fait vraiment"
            entrees: [code, rapport_depot]
            sortie: texte
          - id: verifier-qu-une-mr-tient-sa-promesse
            titre: Vérifier qu'une MR tient sa promesse
            besoin: "un agent qui vérifie qu'une merge request fait ce que son titre annonce, et rien d'autre"
            entrees: [diff]
            sortie: texte
          - id: verifier-la-coherence-entre-la-ci-et-la-stack
            titre: Vérifier la cohérence entre la CI et la stack
            besoin: "un agent qui vérifie qu'un pipeline correspond à la stack réellement présente dans le dépôt"
            entrees: [config_ci, inventaire_fichiers]
            sortie: texte
          - id: verifier-qu-un-flag-documente-existe-encore
            titre: Vérifier qu'un flag documenté existe encore
            besoin: "un agent qui vérifie que les feature flags documentés existent encore dans le code, et l'inverse"
            entrees: [inventaire_flags, code]
            sortie: liste

