# Les contrats de sortie extraits de la plateforme.
#
# Un navigateur ne sait pas lister un dossier : ce manifeste est la seule liste écrite à
# la main du dossier, et `test/contrats.test.js` échoue si elle ne correspond plus aux
# fichiers présents. La désynchronisation devient un test rouge, pas un contrat muet.
#
# ── CE QUI RESTE À FAIRE, ET C'EST L'ESSENTIEL ───────────────────────────────
#
# Cinq modules sont extraits. Les autres n'ont pas encore de contrat, donc les agents
# qu'on en tire traitent le bon sujet SANS reproduire le rapport — ils aident, ils ne
# remplacent pas. C'est dit à l'écran plutôt que masqué.
#
# Extraire un contrat n'est pas une écriture : c'est une LECTURE du code du module. Les
# clés, les unités et les seuils s'y trouvent, ou ils ne s'y trouvent pas. Rien ne doit
# être comblé de mémoire — un seuil approximatif ferait diverger deux rapports censés être
# le même, et personne ne saurait lequel croire.
#
# ── UNE FORME NE SUFFIT PAS : IL FAUT LE CALCUL ──────────────────────────────
#
# Les cinq contrats ont d'abord été extraits en FORME seule — clés, unités, seuils. À
# l'usage, ça ne reproduit pas : ça ressemble. Deux exemples tirés de ces cinq modules :
#
#   · `avgReviewTime` d'« Auto Retro » est une MOYENNE ; le lead time de « DORA Insights »
#     est une MÉDIANE. Même sujet, même unité, deux chiffres qui ne se comparent pas.
#   · Le bus factor global est une MÉDIANE PONDÉRÉE. Le code raconte pourquoi : en moyenne,
#     un module critique noyé dans neuf sains donnait 4.6/5 et « RISQUE FAIBLE ».
#
# Chaque contrat porte donc, en plus de sa forme : le CALCUL de chaque champ, la FENÊTRE
# d'observation, le PÉRIMÈTRE, et les RÈGLES qui priment sur le calcul. `test/contrats.js`
# refuse un champ sans calcul déclaré.
#
# ── LES DÉSACCORDS DE LA PLATEFORME NE SE CORRIGENT PAS ICI ──────────────────
#
# La lecture des cinq modules a mis au jour des divergences réelles entre eux. Le registre
# ne les arbitre pas : chaque contrat porte la convention de SON module, parce qu'un
# contrat sert à reproduire un rapport, pas à réformer la plateforme. Elles sont consignées
# pour être tranchées par quelqu'un qui en a la charge.
#
#   L'ABSENCE. « DORA Insights » écrit `N/A` quand il n'a pas pu mesurer, et refuse même de
#   décerner « Elite » sans MTTR. « Auto Retro » et « Daily Report » écrivent `0`. Sur
#   « Daily Report », la conséquence n'est pas anodine : une semaine SANS AUCUN pipeline
#   donne un taux de succès de 0 %, qui franchit les deux bornes du Health Score et lui
#   coûte 35 points. Une semaine calme est notée comme une semaine catastrophique.
#
#   LES MÉTRIQUES MANQUANTES. « DORA Insights » les RETIRE de sa moyenne puis plafonne le
#   score. « DevOps Assessment » garde l'axe à 0 dans la moyenne des huit. Deux réponses
#   opposées à la même question.
#
#   UN AXE MESURÉ SANS RÉPONSE AU QUESTIONNAIRE, dans « DevOps Assessment », voit son score
#   divisé par deux : la moyenne déclaré/mesuré se fait avec un déclaré traité comme nul.
#   Un rapport produit sans remplir le quiz n'est donc pas comparable à un rapport complet.
#
#   LE NOM DES ENVIRONNEMENTS. « Auto Retro » classe un déploiement d'après le nom : « prod »
#   en PROD, « uat »/« staging » en UAT, TOUT LE RESTE en DEV. Le code signale lui-même que
#   sur un workflow « recette / preprod / integration / homolog », tout retombe en DEV.

contrats:
  - auto-retro.yaml
  - bus-factor.yaml
  - daily-report.yaml
  - devops-assessment.yaml
  - dora-insights.yaml

# ── CE QUI A ÉTÉ EXAMINÉ SANS DONNER DE CONTRAT ──────────────────────────────
#
# Consigné pour que personne ne refasse la recherche. Trois raisons distinctes, et elles
# n'appellent pas la même suite.
#
# LA SORTIE EST ÉCRITE PAR UN MODÈLE — il n'y a rien à reproduire mécaniquement.
#   Platform Concierge   js/platform-concierge.js   6 appels de complétion
#   MR Reviewer AI       js/mr-reviewer.js          la revue est du texte libre
#   Smart Estimate       js/smart-estimate.js       l'estimation est un jugement
#
# LA SORTIE EST UNE LISTE D'OBJETS DU DÉPÔT, sans vocabulaire propre à fixer : le contrat
# serait « une liste de fichiers », ce qu'un agent n'a pas besoin qu'on lui déclare.
#   Repo Diet            js/repo-diet.js            { path, size } par fichier
#   Branch Monitor       js/branch-cleaner.js       { name, ok } par branche
#   Secrets Scanner      js/secrets-scanner.js      les constats, pas un rapport chiffré
#   Project Scaffolder   js/project-scaffolder.js   des fichiers générés
#   Pipeline Generator   js/pipeline-generator.js   un fichier de CI
#   Release Notes        js/releasenotes.js         un texte de notes
#
# ── LA QUESTION OUVERTE A ÉTÉ TRANCHÉE, ET J'AVAIS LU LE MAUVAIS FICHIER ─────
#
# `js/insights.js` n'était pas « à rattacher » : c'EST le module « DORA Insights ». La
# table `MODULE_URLS` de `js/hub.js` (~ligne 204) le dit — 'DORA Insights' →
# 'insights.html' → `js/insights.js`. Le contrat lisait `js/dora-workspace.js`, qui est
# la page « DORA Tribu », absente du catalogue du hub.
#
# DEUX SEUILS DE LEAD TIME COEXISTENT DANS LA PLATEFORME, et c'est la lecture qui l'a
# révélé. Trois fichiers, trois commentaires qui se renvoient l'un à l'autre :
#
#   js/insights.js        lt : Elite ≤ 24 h, High ≤ 168 h, Medium ≤ 720 h
#                         « seuils DORA Accelerate 2024 alignés sur hub.html »
#   js/hub.js             lt : Elite ≤ 1 h,  High ≤ 24 h,  Medium ≤ 168 h
#                         « aligné insights.js »
#   js/dora-workspace.js  lt : Elite ≤ 1 h,  High ≤ 24 h,  Medium ≤ 168 h
#
# Chacun se dit aligné sur l'autre, et ils ne le sont pas. Un même dépôt peut donc être
# « Elite » sur une page et « High » sur la suivante. Le désaccord appartient à la
# plateforme : le registre ne le tranche pas, il porte les seuils de la page qu'il
# reproduit — celle qui s'appelle « DORA Insights ».
#
# CE QUI N'EST À L'INVENTAIRE D'AUCUNE CAPACITÉ, et n'a donc pas de contrat à porter :
#   js/dora-workspace.js  « DORA Tribu » — un tableau de bord multi-dépôts, hors
#                         `MODULE_URLS`. Rien à extraire tant qu'aucune capacité ne le
#                         demande.
#
# RESTENT SANS FICHIER ÉVIDENT — les capacités « Comparaisons », « Cohérence »,
# « Restitutions », « Incidents » et « Livraison ». Elles n'ont pas d'entrée dans
# `MODULE_URLS` : ce sont probablement des capacités décrites avant d'être construites.
# Rien à extraire d'un module qui n'existe pas encore.
