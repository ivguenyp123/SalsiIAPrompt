# Dépôt de démonstration — la cible de l'agent « préparer la livraison ».
#
# Il vit dans un sous-dossier du dépôt produit faute d'avoir pu créer un dépôt dédié :
# l'intégration GitHub de cette session n'a pas le droit d'en créer. Sur une vraie cible,
# ce fichier est à la racine, comme l'exige GitLab.
stages: [build, deploy]

variables:
  IMAGE_TAG: "1.4.2"
  REGISTRY: registry.interne.lcl

build:
  stage: build
  script:
    - docker build -t $REGISTRY/demo-spring:$IMAGE_TAG .
    - docker push $REGISTRY/demo-spring:$IMAGE_TAG

deploy:preprod:
  stage: deploy
  script:
    - kubectl apply -k k8s/overlays/preprod
